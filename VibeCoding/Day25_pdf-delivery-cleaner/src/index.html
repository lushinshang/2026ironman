<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 對外交付清理器 — Day25</title>
  <style>
/* shared/base.css — 共用樣式基底 */
:root {
  --color-bg: #f7f7f8;
  --color-surface: #ffffff;
  --color-border: #d9d9de;
  --color-text: #1f2328;
  --color-text-muted: #6b7280;
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-danger: #dc2626;
  --color-toast-bg: #1f2328;
  --color-toast-text: #ffffff;
  --radius: 8px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans);
  color: var(--color-text);
  background: var(--color-bg);
  line-height: 1.6;
}

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px 16px;
}

h1, h2, h3 { line-height: 1.3; }

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 1rem;
}

button, .btn {
  font-family: inherit;
  font-size: 0.95rem;
  padding: 8px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

button:hover, .btn:hover { background: var(--color-bg); }

button.primary, .btn.primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #ffffff;
}

button.primary:hover, .btn.primary:hover { background: var(--color-primary-hover); }

button:disabled, .btn:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.dropzone {
  border: 2px dashed var(--color-border);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  color: var(--color-text-muted);
  cursor: pointer;
  background: #ffffff;
}

.dropzone.dragover {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: #eff6ff;
}

.nav-back {
  display: inline-block;
  margin-bottom: 16px;
  color: var(--color-text-muted);
  text-decoration: none;
}

.nav-back:hover { text-decoration: underline; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 32px;
  transform: translateX(-50%);
  background: var(--color-toast-bg);
  color: var(--color-toast-text);
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 1000;
}

.toast.show { opacity: 1; }

.btn-group {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin: 0.5rem 0;
}
.btn-sm {
  padding: 0.35rem 0.65rem;
  font-size: 0.85rem;
}

.categories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
  margin: 1rem 0;
}

.category-card {
  background: #ffffff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.category-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.category-title {
  font-weight: 700;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.category-badge {
  font-size: 0.8rem;
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 600;
}
.badge-clean { background: #dcfce7; color: #166534; }
.badge-dirty { background: #fee2e2; color: #991b1b; }

.category-details {
  font-size: 0.82rem;
  color: #64748b;
  margin: 4px 0 8px 0;
  max-height: 80px;
  overflow-y: auto;
}

.comparison-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 1rem;
  font-size: 0.9rem;
}
.comparison-table th, .comparison-table td {
  border: 1px solid #e2e8f0;
  padding: 8px 12px;
  text-align: left;
}
.comparison-table th {
  background: #f8fafc;
  font-weight: 600;
}

.clean-banner {
  background: #ecfdf5;
  border: 1px solid #6ee7b7;
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  color: #065f46;
  margin: 1rem 0;
}
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-back">
      <a href="../index.html">← 回首頁</a>
    </nav>

    <header>
      <h1>PDF 對外交付清理器</h1>
      <p class="subtitle" style="color: var(--color-text-muted);">
        在將 PDF 發送給外部客戶或合作廠商前，掃描並一鍵清理 Metadata、內部超連結、審閱註解、表單欄位、附件與動作腳本。
      </p>
    </header>

    <div class="dropzone" id="drop-zone">
      <div style="font-size: 2rem; margin-bottom: 0.5rem;">🧹</div>
      <div style="margin-bottom: 0.75rem;">拖放 PDF 檔案至此，或點擊選取</div>
      <input type="file" id="file-input" accept="application/pdf,.pdf" style="display: none;">
      <button type="button" class="btn secondary" id="btn-select-file">選擇 PDF 檔案</button>
    </div>

    <div id="editor-section" style="display: none;">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
          <div>
            <h3 style="margin: 0 0 4px 0; font-size: 1.1rem;" id="doc-filename">document.pdf</h3>
            <div style="font-size: 0.85rem; color: #64748b;">
              總頁數：<strong id="doc-page-count" style="color: #2563eb;">0</strong> 頁｜檔案大小：<span id="doc-file-size">0 KB</span>
            </div>
          </div>

          <div class="btn-group">
            <button type="button" class="btn primary btn-sm" id="btn-clean-now">🧹 開始清理所選項目</button>
            <button type="button" class="btn secondary btn-sm" id="btn-download-clean" disabled>🚀 下載 clean-for-delivery.pdf</button>
            <button type="button" class="btn secondary btn-sm" id="btn-copy-summary">📋 複製清理摘要</button>
            <button type="button" class="btn secondary btn-sm" id="btn-reset">重新上傳</button>
          </div>
        </div>
      </div>

      <!-- Clean state banner if 0 items found -->
      <div id="clean-state-banner" class="clean-banner" style="display: none;">
        <div style="font-size: 1.5rem; margin-bottom: 4px;">🎉</div>
        <h3 style="margin: 0 0 4px 0;">掃描完成：未偵測到需要清理的對外風險項目！</h3>
        <p style="margin: 0; font-size: 0.9rem;">此 PDF 的屬性、連結、註解、表單、附件與動作腳本皆為安全狀態，可安心對外交付。</p>
      </div>

      <!-- Categories selection grid -->
      <div id="categories-container" class="categories-grid"></div>

      <!-- Comparison Table Area -->
      <div id="comparison-section" class="card" style="display: none;">
        <h3 style="margin: 0 0 8px 0; font-size: 1.05rem;">清理前後對照表</h3>
        <table class="comparison-table">
          <thead>
            <tr>
              <th>清理項目類別</th>
              <th>清理前偵測數量</th>
              <th>清理後數量</th>
              <th>狀態</th>
            </tr>
          </thead>
          <tbody id="comparison-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="btn-group" style="margin-top: 2rem; border-top: 1px solid #e2e8f0; padding-top: 1.5rem;">
      <button type="button" class="btn secondary" id="btn-download-offline">💾 下載本工具離線版</button>
    </div>

    <!--{{LICENSES}}-->
  </div>

  <!--{{ASSET:cantoo_pdf_lib}}-->
  <!--{{SHARED:util-escape}}-->
  <!--{{SHARED:ui-toast}}-->
  <!--{{SHARED:ui-debounce}}-->
  <!--{{SHARED:io-download}}-->
  <!--{{SHARED:io-clipboard}}-->
  <!--{{SHARED:io-dropzone}}-->
  <!--{{SHARED:pdf-file-size}}-->
  <!--{{SHARED:pdf-build}}-->

  <script>
  (function () {
    var state = {
      file: null,
      fileName: '',
      pdfBytes: null,
      cleanedBytes: null,
      totalPages: 0,
      scanBefore: null, // { metadata: {...}, links: [...], comments: [...], forms: [...], attachments: [...], actions: [...] }
      scanAfter: null
    };

    var dropZone = document.getElementById('drop-zone');
    var fileInput = document.getElementById('file-input');
    var btnSelectFile = document.getElementById('btn-select-file');
    var editorSection = document.getElementById('editor-section');

    var docFilename = document.getElementById('doc-filename');
    var docPageCount = document.getElementById('doc-page-count');
    var docFileSize = document.getElementById('doc-file-size');

    var cleanStateBanner = document.getElementById('clean-state-banner');
    var categoriesContainer = document.getElementById('categories-container');
    var comparisonSection = document.getElementById('comparison-section');
    var comparisonTbody = document.getElementById('comparison-tbody');

    var btnCleanNow = document.getElementById('btn-clean-now');
    var btnDownloadClean = document.getElementById('btn-download-clean');
    var btnCopySummary = document.getElementById('btn-copy-summary');
    var btnReset = document.getElementById('btn-reset');
    var btnDownloadOffline = document.getElementById('btn-download-offline');

    // 手動走底層物件模型解析 /Names/EmbeddedFiles name tree，取代高階 API
    // getAttachments()：高階 API 對 /Params（選填欄位）做強型別 lookup，
    // 缺少 /Params 的 PDF（例如 pypdf 產生的檔案）會直接拋例外，導致完全讀不到檔名／大小。
    function collectEmbeddedFileEntries(namesArray, out) {
      // namesArray: PDFArray，內容為 [name1, fileSpecRef1, name2, fileSpecRef2, ...]
      for (var i = 0; i < namesArray.size(); i += 2) {
        try {
          var nameObj = namesArray.lookup(i);
          var fileSpec = namesArray.lookup(i + 1, PDFLib.PDFDict);
          if (!fileSpec) continue;

          var displayName;
          if (nameObj instanceof PDFLib.PDFHexString || nameObj instanceof PDFLib.PDFString) {
            displayName = nameObj.decodeText();
          } else {
            continue;
          }

          var ef = fileSpec.lookupMaybe(PDFLib.PDFName.of('EF'), PDFLib.PDFDict);
          if (!ef) continue;

          // 檔名優先 /UF，沒有則退回 /F
          // lookupMaybe 對「值存在但型別不符」會直接拋例外（不像對「鍵不存在」那樣容錯），
          // 所以字串型欄位一律同時列出 PDFString / PDFHexString 兩種可能型別
          var ufName = fileSpec.lookupMaybe(PDFLib.PDFName.of('UF'), PDFLib.PDFHexString, PDFLib.PDFString);
          var fName = fileSpec.lookupMaybe(PDFLib.PDFName.of('F'), PDFLib.PDFHexString, PDFLib.PDFString);
          if (ufName) displayName = ufName.decodeText();
          else if (fName) displayName = fName.decodeText();

          var stream = ef.lookupMaybe(PDFLib.PDFName.of('F'), PDFLib.PDFRawStream);
          var size = null;
          if (stream) {
            // /Params/Size 為選填，缺欄位時改用解壓縮後的實際 bytes 長度
            var params = stream.dict.lookupMaybe(PDFLib.PDFName.of('Params'), PDFLib.PDFDict);
            var sizeNum = params ? params.lookupMaybe(PDFLib.PDFName.of('Size'), PDFLib.PDFNumber) : null;
            if (sizeNum) {
              size = sizeNum.asNumber();
            } else {
              size = PDFLib.decodePDFRawStream(stream).decode().length;
            }
          }

          out.push({ name: displayName, size: size });
        } catch (entryErr) {
          // 單一附件解析失敗不影響其他附件
        }
      }
    }

    function getEmbeddedFileNamesManual(doc) {
      var out = [];
      try {
        if (!doc.catalog.has(PDFLib.PDFName.of('Names'))) return out;
        var namesDict = doc.catalog.lookupMaybe(PDFLib.PDFName.of('Names'), PDFLib.PDFDict);
        if (!namesDict || !namesDict.has(PDFLib.PDFName.of('EmbeddedFiles'))) return out;
        var efDict = namesDict.lookupMaybe(PDFLib.PDFName.of('EmbeddedFiles'), PDFLib.PDFDict);
        if (!efDict) return out;

        // Name tree 可能是 /Names 陣列，也可能是 /Kids 遞迴子樹
        var queue = [efDict];
        while (queue.length > 0) {
          var node = queue.shift();
          try {
            var namesArr = node.lookupMaybe(PDFLib.PDFName.of('Names'), PDFLib.PDFArray);
            if (namesArr) {
              collectEmbeddedFileEntries(namesArr, out);
            }
            var kids = node.lookupMaybe(PDFLib.PDFName.of('Kids'), PDFLib.PDFArray);
            if (kids) {
              for (var k = 0; k < kids.size(); k++) {
                try {
                  var kidDict = kids.lookup(k, PDFLib.PDFDict);
                  if (kidDict) queue.push(kidDict);
                } catch (kidErr) {
                  // 單一子樹解析失敗不影響其他子樹
                }
              }
            }
          } catch (nodeErr) {
            // 單一節點解析失敗不影響其他節點
          }
        }
      } catch (e) {
        // 走訪失敗時回傳目前已收集到的結果（可能為空）
      }
      return out;
    }

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      var k = 1024;
      var sizes = ['B', 'KB', 'MB', 'GB'];
      var i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }

    function scanPdfDoc(doc) {
      var res = {
        metadata: { count: 0, items: [] },
        links: { count: 0, items: [] },
        comments: { count: 0, items: [] },
        forms: { count: 0, items: [] },
        attachments: { count: 0, items: [] },
        actions: { count: 0, items: [] }
      };

      // 1. Metadata
      var title = doc.getTitle();
      var author = doc.getAuthor();
      var subject = doc.getSubject();
      var creator = doc.getCreator();
      var producer = doc.getProducer();
      var hasXmp = doc.catalog.has(PDFLib.PDFName.of('Metadata'));

      if (title && title.trim()) res.metadata.items.push('標題 (Title): ' + title);
      if (author && author.trim()) res.metadata.items.push('作者 (Author): ' + author);
      if (subject && subject.trim()) res.metadata.items.push('主旨 (Subject): ' + subject);
      if (creator && creator.trim() && creator !== 'pdf-lib (https://github.com/Hopding/pdf-lib)') res.metadata.items.push('建立應用程式 (Creator): ' + creator);
      if (producer && producer.trim() && producer !== 'pdf-lib (https://github.com/Hopding/pdf-lib)') res.metadata.items.push('生產者 (Producer): ' + producer);
      if (hasXmp) res.metadata.items.push('XMP 內嵌中繼資料串流');
      res.metadata.count = res.metadata.items.length;

      // 2. Links & 3. Comments (Iterate pages)
      var pageCount = doc.getPageCount();
      for (var pIdx = 0; pIdx < pageCount; pIdx++) {
        var page = doc.getPage(pIdx);
        var annotsRef = page.node.get(PDFLib.PDFName.of('Annots'));
        if (annotsRef) {
          var annotsArr = doc.context.lookup(annotsRef);
          if (annotsArr && typeof annotsArr.size === 'function') {
            for (var aIdx = 0; aIdx < annotsArr.size(); aIdx++) {
              var annotObj = doc.context.lookup(annotsArr.get(aIdx));
              if (!annotObj || typeof annotObj.get !== 'function') continue;

              var subTypeObj = annotObj.get(PDFLib.PDFName.of('Subtype'));
              var subType = subTypeObj ? (subTypeObj.asString ? subTypeObj.asString().replace(/^\//, '') : String(subTypeObj).replace(/^\//, '')) : '';

              if (subType === 'Link') {
                var aDict = annotObj.get(PDFLib.PDFName.of('A'));
                var uri = '';
                if (aDict) {
                  var lookupA = doc.context.lookup(aDict);
                  var uriObj = lookupA && lookupA.get ? lookupA.get(PDFLib.PDFName.of('URI')) : null;
                  if (uriObj) {
                    uri = uriObj.decodeText ? uriObj.decodeText() : (uriObj.asString ? uriObj.asString() : String(uriObj));
                  }
                }
                res.links.items.push('第 ' + (pIdx + 1) + ' 頁連結' + (uri ? ': ' + uri : ''));
                res.links.count++;
              } else if (subType && subType !== 'Widget') {
                var contentsObj = annotObj.get(PDFLib.PDFName.of('Contents'));
                var commentText = contentsObj ? (contentsObj.decodeText ? contentsObj.decodeText() : (contentsObj.asString ? contentsObj.asString() : String(contentsObj))) : '';
                res.comments.items.push('第 ' + (pIdx + 1) + ' 頁 [' + subType + ']' + (commentText ? ': ' + commentText : ''));
                res.comments.count++;
              }
            }
          }
        }
      }

      // 4. Forms
      if (doc.catalog.has(PDFLib.PDFName.of('AcroForm'))) {
        try {
          var form = doc.getForm();
          var fields = form.getFields();
          res.forms.count = fields.length;
          fields.forEach(function (f) {
            res.forms.items.push('表單欄位: ' + f.getName());
          });
          if (fields.length === 0) {
            res.forms.count = 1;
            res.forms.items.push('AcroForm 字典結構');
          }
        } catch (e) {
          res.forms.count = 1;
          res.forms.items.push('AcroForm 字典');
        }
      }

      // 5. Attachments
      // 優先手動走底層物件模型解析 name tree（見 getEmbeddedFileNamesManual）：
      // 高階 API getAttachments() 對 /Params（選填欄位）做強型別 lookup，缺少該欄位的
      // PDF（例如 pypdf 產生的檔案）會直接拋例外，導致完全讀不到檔名／大小。
      try {
        var hasEmbeddedFilesDict = false;
        if (doc.catalog.has(PDFLib.PDFName.of('Names'))) {
          var namesLookup = doc.context.lookup(doc.catalog.get(PDFLib.PDFName.of('Names')));
          hasEmbeddedFilesDict = !!(namesLookup && namesLookup.has && namesLookup.has(PDFLib.PDFName.of('EmbeddedFiles')));
        }

        var manualEntries = getEmbeddedFileNamesManual(doc);
        if (manualEntries.length > 0) {
          manualEntries.forEach(function (entry) {
            res.attachments.count++;
            var sizeLabel = typeof entry.size === 'number' ? formatBytes(entry.size) : '未知大小';
            res.attachments.items.push(entry.name + '（' + sizeLabel + '）');
          });
        } else if (hasEmbeddedFilesDict) {
          // 最後防線：完全無法解析出任何檔名／大小時，至少標示字典存在
          res.attachments.count++;
          res.attachments.items.push('內嵌附件字典 (EmbeddedFiles，檔名解析失敗)');
        }
      } catch (e) {
        // Fallback：手動解析整體失敗時，至少標示字典存在
        if (doc.catalog.has(PDFLib.PDFName.of('Names'))) {
          var names = doc.context.lookup(doc.catalog.get(PDFLib.PDFName.of('Names')));
          if (names && names.has && names.has(PDFLib.PDFName.of('EmbeddedFiles'))) {
            res.attachments.count++;
            res.attachments.items.push('內嵌附件字典 (EmbeddedFiles，檔名解析失敗)');
          }
        }
      }

      // 6. Actions
      if (doc.catalog.has(PDFLib.PDFName.of('OpenAction'))) {
        res.actions.count++;
        res.actions.items.push('文件開啟動作 (/OpenAction)');
      }
      if (doc.catalog.has(PDFLib.PDFName.of('AA'))) {
        res.actions.count++;
        res.actions.items.push('附加動作字典 (/AA)');
      }

      return res;
    }

    var categoryDefs = [
      { id: 'metadata', name: '文件屬性 (Metadata / XMP)', icon: '📝', desc: '作者、軟體、修改時間與 XMP 串流' },
      { id: 'links', name: '超連結 (Link Annotations)', icon: '🔗', desc: '外部網站連結、內部路徑或 mailto' },
      { id: 'comments', name: '註解與標記 (Comments)', icon: '💬', desc: '審查便利貼、螢光畫記、標註形狀' },
      { id: 'forms', name: '表單欄位 (AcroForm / Fields)', icon: '📋', desc: '互動式填表欄位與輸入資料' },
      { id: 'attachments', name: '內嵌附件 (Embedded Files)', icon: '📎', desc: '隨檔夾帶的附加檔案' },
      { id: 'actions', name: '動作與腳本 (Actions / JS)', icon: '⚙️', desc: '開啟動作與自動化執行腳本' }
    ];

    function renderScanView() {
      if (!state.scanBefore) return;

      var totalFound = 0;
      categoryDefs.forEach(function (cat) {
        totalFound += state.scanBefore[cat.id].count;
      });

      if (totalFound === 0) {
        if (cleanStateBanner) cleanStateBanner.style.display = 'block';
        if (categoriesContainer) categoriesContainer.innerHTML = '';
        if (btnCleanNow) btnCleanNow.disabled = true;
        return;
      }

      if (cleanStateBanner) cleanStateBanner.style.display = 'none';
      if (btnCleanNow) btnCleanNow.disabled = false;
      if (!categoriesContainer) return;

      categoriesContainer.innerHTML = '';

      categoryDefs.forEach(function (cat) {
        var scanData = state.scanBefore[cat.id];
        var isDirty = scanData.count > 0;

        var card = document.createElement('div');
        card.className = 'category-card';

        var header = document.createElement('div');
        header.className = 'category-header';

        var titleBox = document.createElement('div');
        titleBox.className = 'category-title';

        var chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.id = 'chk-cat-' + cat.id;
        chk.checked = isDirty; // default check if dirty
        chk.disabled = !isDirty;

        var lbl = document.createElement('label');
        lbl.htmlFor = 'chk-cat-' + cat.id;
        lbl.textContent = cat.icon + ' ' + cat.name;

        titleBox.appendChild(chk);
        titleBox.appendChild(lbl);

        var badge = document.createElement('span');
        badge.className = 'category-badge ' + (isDirty ? 'badge-dirty' : 'badge-clean');
        badge.textContent = isDirty ? '偵測到 ' + scanData.count + ' 項' : '無風險';

        header.appendChild(titleBox);
        header.appendChild(badge);

        var details = document.createElement('div');
        details.className = 'category-details';
        if (isDirty) {
          details.innerHTML = scanData.items.map(function (it) {
            return '• ' + escapeHtml(it);
          }).join('<br>');
        } else {
          details.textContent = '未偵測到此類物件。';
        }
        if (cat.id === 'actions') {
          var disclosure = document.createElement('div');
          disclosure.style.marginTop = '4px';
          disclosure.style.color = '#b45309';
          disclosure.textContent = '⚠️ 本工具無法完整偵測此類物件，建議另用專業工具確認送出前無殘留 Action。';
          details.appendChild(document.createElement('br'));
          details.appendChild(disclosure);
        }

        card.appendChild(header);
        card.appendChild(details);
        categoriesContainer.appendChild(card);
      });
    }

    function renderComparisonTable() {
      if (!state.scanBefore || !state.scanAfter || !comparisonTbody) return;
      comparisonTbody.innerHTML = '';

      categoryDefs.forEach(function (cat) {
        var beforeCount = state.scanBefore[cat.id].count;
        var afterCount = state.scanAfter[cat.id].count;
        var isCleaned = (beforeCount > 0 && afterCount === 0);

        var tr = document.createElement('tr');
        tr.innerHTML = '<td><strong>' + cat.icon + ' ' + escapeHtml(cat.name) + '</strong></td>' +
                       '<td>' + beforeCount + ' 項</td>' +
                       '<td>' + afterCount + ' 項</td>' +
                       '<td>' + (isCleaned ? '<span style="color:#16a34a; font-weight:600;">✅ 已完全清除</span>' : (beforeCount === 0 ? '<span style="color:#64748b;">原本即無</span>' : '<span style="color:#475569;">原樣保留</span>')) + '</td>';
        comparisonTbody.appendChild(tr);
      });

      if (comparisonSection) comparisonSection.style.display = 'block';
    }

    function executeCleaning() {
      if (!state.pdfBytes) return;
      showToast('正在執行對外交付清理...');

      PDFLib.PDFDocument.load(state.pdfBytes).then(function (doc) {
        var chkMeta = document.getElementById('chk-cat-metadata');
        var chkLinks = document.getElementById('chk-cat-links');
        var chkComments = document.getElementById('chk-cat-comments');
        var chkForms = document.getElementById('chk-cat-forms');
        var chkAttachments = document.getElementById('chk-cat-attachments');
        var chkActions = document.getElementById('chk-cat-actions');

        // 1. Clean Metadata
        if (chkMeta && chkMeta.checked) {
          doc.setTitle('');
          doc.setAuthor('');
          doc.setSubject('');
          doc.setKeywords([]);
          doc.setProducer('');
          doc.setCreator('');
          doc.setCreationDate(new Date(0));
          doc.setModificationDate(new Date(0));
          if (doc.catalog.has(PDFLib.PDFName.of('Metadata'))) {
            doc.catalog.delete(PDFLib.PDFName.of('Metadata'));
          }
        }

        // 2. Clean Links & 3. Clean Comments
        var cleanLinks = chkLinks && chkLinks.checked;
        var cleanComments = chkComments && chkComments.checked;

        if (cleanLinks || cleanComments) {
          var pCount = doc.getPageCount();
          for (var p = 0; p < pCount; p++) {
            var page = doc.getPage(p);
            var annotsRef = page.node.get(PDFLib.PDFName.of('Annots'));
            if (annotsRef) {
              var annotsArr = doc.context.lookup(annotsRef);
              if (annotsArr && typeof annotsArr.size === 'function') {
                var keptRefs = [];
                for (var a = 0; a < annotsArr.size(); a++) {
                  var rawRef = annotsArr.get(a);
                  var annotObj = doc.context.lookup(rawRef);
                  if (!annotObj || typeof annotObj.get !== 'function') continue;

                  var subTypeObj = annotObj.get(PDFLib.PDFName.of('Subtype'));
                  var subType = subTypeObj ? (subTypeObj.asString ? subTypeObj.asString().replace(/^\//, '') : String(subTypeObj).replace(/^\//, '')) : '';

                  if (subType === 'Link') {
                    if (!cleanLinks) keptRefs.push(rawRef);
                  } else if (subType === 'Widget') {
                    // Widgets are preserved unless forms cleaned
                    keptRefs.push(rawRef);
                  } else {
                    // Other comments/annotations
                    if (!cleanComments) keptRefs.push(rawRef);
                  }
                }

                if (keptRefs.length > 0) {
                  page.node.set(PDFLib.PDFName.of('Annots'), doc.context.obj(keptRefs));
                } else {
                  page.node.delete(PDFLib.PDFName.of('Annots'));
                }
              }
            }
          }
        }

        // 4. Clean Forms
        if (chkForms && chkForms.checked) {
          if (doc.catalog.has(PDFLib.PDFName.of('AcroForm'))) {
            doc.catalog.delete(PDFLib.PDFName.of('AcroForm'));
          }
        }

        // 5. Clean Attachments
        if (chkAttachments && chkAttachments.checked) {
          if (doc.catalog.has(PDFLib.PDFName.of('Names'))) {
            var namesObj = doc.context.lookup(doc.catalog.get(PDFLib.PDFName.of('Names')));
            if (namesObj && namesObj.delete) {
              namesObj.delete(PDFLib.PDFName.of('EmbeddedFiles'));
            }
          }
          if (doc.catalog.has(PDFLib.PDFName.of('AF'))) {
            doc.catalog.delete(PDFLib.PDFName.of('AF'));
          }
        }

        // 6. Clean Actions
        if (chkActions && chkActions.checked) {
          if (doc.catalog.has(PDFLib.PDFName.of('OpenAction'))) {
            doc.catalog.delete(PDFLib.PDFName.of('OpenAction'));
          }
          if (doc.catalog.has(PDFLib.PDFName.of('AA'))) {
            doc.catalog.delete(PDFLib.PDFName.of('AA'));
          }
        }

        return doc.save();
      }).then(function (outBytes) {
        state.cleanedBytes = outBytes;
        return PDFLib.PDFDocument.load(outBytes);
      }).then(function (reloadedDoc) {
        state.scanAfter = scanPdfDoc(reloadedDoc);
        renderComparisonTable();
        if (btnDownloadClean) btnDownloadClean.disabled = false;
        showToast('清理完成！已生成對照表。');
      }).catch(function (err) {
        showToast('清理失敗：' + err.message);
      });
    }

    function loadPdf(file) {
      var gate = checkPdfFileSize(file.size);
      if (!gate.ok) {
        showToast(gate.message, 3500);
        return;
      }

      showToast('正在讀取並掃描 PDF 文件...');

      file.arrayBuffer().then(function (ab) {
        var bytes = new Uint8Array(ab);
        return PDFLib.PDFDocument.load(bytes).then(function (doc) {
          state.file = file;
          state.fileName = file.name || 'document.pdf';
          state.pdfBytes = bytes;
          state.cleanedBytes = null;
          state.totalPages = doc.getPageCount();
          state.scanBefore = scanPdfDoc(doc);
          state.scanAfter = null;

          if (docFilename) docFilename.textContent = state.fileName;
          if (docPageCount) docPageCount.textContent = state.totalPages;
          if (docFileSize) docFileSize.textContent = formatBytes(file.size);

          if (dropZone) dropZone.style.display = 'none';
          if (editorSection) editorSection.style.display = 'block';
          if (comparisonSection) comparisonSection.style.display = 'none';
          if (btnDownloadClean) btnDownloadClean.disabled = true;

          renderScanView();
          showToast('掃描完成');
        });
      }).catch(function (err) {
        showToast('載入失敗：' + (err.message || '無效檔案'));
      });
    }

    if (btnSelectFile && fileInput) {
      btnSelectFile.addEventListener('click', function () { fileInput.click(); });
      fileInput.addEventListener('change', function () {
        if (fileInput.files && fileInput.files[0]) {
          loadPdf(fileInput.files[0]);
          fileInput.value = '';
        }
      });
    }

    if (dropZone) {
      setupDropZone(dropZone, function () {}, {
        accept: ['.pdf', 'application/pdf'],
        gate: function (file) { return checkPdfFileSize(file.size); },
        onError: function (msg) { showToast(msg); }
      });
      dropZone.addEventListener('drop', function (e) {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          loadPdf(e.dataTransfer.files[0]);
        }
      });
    }

    if (btnCleanNow) {
      btnCleanNow.addEventListener('click', executeCleaning);
    }

    if (btnDownloadClean) {
      btnDownloadClean.addEventListener('click', function () {
        if (!state.cleanedBytes) return;
        var blob = new Blob([state.cleanedBytes], { type: 'application/pdf' });
        downloadFile('clean-for-delivery.pdf', blob, 'application/pdf');
        showToast('已下載 clean-for-delivery.pdf');
      });
    }

    if (btnCopySummary) {
      btnCopySummary.addEventListener('click', function () {
        if (!state.scanBefore) return;
        var text = '【PDF 對外交付清理摘要】\n' +
                   '檔案名稱：' + state.fileName + '\n' +
                   '總頁數：' + state.totalPages + ' 頁\n' +
                   categoryDefs.map(function (cat) {
                     var b = state.scanBefore[cat.id].count;
                     var a = state.scanAfter ? state.scanAfter[cat.id].count : '-';
                     return '• ' + cat.name + '：清理前 ' + b + ' 項，清理後 ' + a + ' 項';
                   }).join('\n') + '\n';
        copyToClipboard(text).then(function () {
          showToast('已複製清理摘要至剪貼簿');
        });
      });
    }

    if (btnReset) {
      btnReset.addEventListener('click', function () {
        state.file = null;
        state.fileName = '';
        state.pdfBytes = null;
        state.cleanedBytes = null;
        state.totalPages = 0;
        state.scanBefore = null;
        state.scanAfter = null;

        if (editorSection) editorSection.style.display = 'none';
        if (dropZone) dropZone.style.display = 'block';
        if (categoriesContainer) categoriesContainer.innerHTML = '';
        if (comparisonSection) comparisonSection.style.display = 'none';
        showToast('已重置');
      });
    }

    function buildCleanHtmlCopy() {
      var doc = document.documentElement.cloneNode(true);

      var toast = doc.querySelector('#__shared_toast');
      if (toast) toast.remove();

      var navBack = doc.querySelector('.nav-back');
      if (navBack) navBack.remove();

      var offlineBtn = doc.querySelector('#btn-download-offline');
      if (offlineBtn) offlineBtn.remove();

      var edSection = doc.querySelector('#editor-section');
      if (edSection) edSection.style.display = 'none';

      var dZone = doc.querySelector('#drop-zone');
      if (dZone) dZone.style.display = 'block';

      var pCount = doc.querySelector('#doc-page-count');
      if (pCount) pCount.textContent = '0';

      var fName = doc.querySelector('#doc-filename');
      if (fName) fName.textContent = 'document.pdf';

      var cGrid = doc.querySelector('#categories-container');
      if (cGrid) cGrid.innerHTML = '';

      var cmpSection = doc.querySelector('#comparison-section');
      if (cmpSection) cmpSection.style.display = 'none';

      return '<!DOCTYPE html>\n' + doc.outerHTML;
    }

    window.buildCleanHtmlCopy = buildCleanHtmlCopy;
    window._debugState = state;

    if (btnDownloadOffline) {
      btnDownloadOffline.addEventListener('click', function () {
        var cleanHtml = buildCleanHtmlCopy();
        downloadFile('pdf-delivery-cleaner-offline.html', cleanHtml, 'text/html;charset=utf-8');
        showToast('已下載離線版工具');
      });
    }
  })();
  </script>
</body>
</html>
