// shared/util-escape.js
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// shared/ui-toast.js
function showToast(msg, ms) {
  if (ms === undefined) ms = 2000;
  var el = document.getElementById('__shared_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '__shared_toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  if (el.__hideTimer) {
    clearTimeout(el.__hideTimer);
  }
  el.__hideTimer = setTimeout(function () {
    el.classList.remove('show');
  }, ms);
}

</script>

// shared/ui-debounce.js
function debounce(fn, ms) {
  if (ms === undefined) ms = 150;
  var timer = null;
  return function () {
    var args = arguments;
    var ctx = this;
    if (timer) {
      clearTimeout(timer);
    }
    timer = setTimeout(function () {
      fn.apply(ctx, args);
    }, ms);
  };
}

</script>

// shared/io-download.js
function downloadFile(filename, content, mime) {
  if (mime === undefined) mime = 'text/plain;charset=utf-8';
  var blob = new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () {
    URL.revokeObjectURL(url);
  }, 0);
}

</script>

// shared/io-clipboard.js
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () {
      return true;
    }).catch(function () {
      return false;
    });
  }
  return new Promise(function (resolve) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    var ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(textarea);
    resolve(ok);
  });
}

function pasteImageFromClipboard() {
  if (!navigator.clipboard || !navigator.clipboard.read) {
    return Promise.resolve(null);
  }
  return navigator.clipboard.read().then(function (items) {
    if (!items || items.length === 0) return null;
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      if (item && item.types) {
        for (var t = 0; t < item.types.length; t++) {
          if (item.types[t].indexOf('image/') === 0) {
            return item.getType(item.types[t]);
          }
        }
      }
    }
    return null;
  }).catch(function () {
    return null;
  });
}

// shared/io-dropzone.js
function ioDropzoneHandleFile(file, onData, opts) {
  opts = opts || {};
  // 預設只收 .txt / .md（契約第 3 節）。不要改成 [] ——那會變成靜默全收。
  var accept = opts.accept || ['.txt', '.md'];
  var onError = opts.onError || function () {};

  function isAccepted(fileName) {
    if (accept.length === 0) return true;
    var lower = fileName.toLowerCase();
    for (var i = 0; i < accept.length; i++) {
      if (lower.indexOf(accept[i].toLowerCase(), lower.length - accept[i].length) !== -1) {
        return true;
      }
    }
    return false;
  }

  if (!isAccepted(file.name)) {
    onError('不支援的檔案類型：' + file.name);
    return;
  }

  if (opts.gate) {
    var gateResult = opts.gate(file);
    if (!gateResult.ok) {
      onError(gateResult.message);
      return;
    }
  }

  var reader = new FileReader();
  reader.onload = function () {
    onData(reader.result, file.name);
  };
  reader.onerror = function () {
    onError('讀取檔案失敗：' + file.name);
  };
  if (opts.mode === 'bytes') {
    reader.readAsArrayBuffer(file);
  } else {
    reader.readAsText(file);
  }
}

function setupDropZone(dropEl, onData, opts) {
  opts = opts || {};

  dropEl.addEventListener('dragover', function (e) {
    e.preventDefault();
    dropEl.classList.add('dragover');
  });

  dropEl.addEventListener('dragleave', function () {
    dropEl.classList.remove('dragover');
  });

  dropEl.addEventListener('drop', function (e) {
    e.preventDefault();
    dropEl.classList.remove('dragover');
    var files = e.dataTransfer.files;
    if (!files || files.length === 0) return;

    if (opts.multiple === true) {
      if (opts.gateBatch) {
        var batchResult = opts.gateBatch(files);
        if (!batchResult.ok) {
          (opts.onError || function () {})(batchResult.message);
          return;
        }
      }
      var total = files.length;
      for (var i = 0; i < total; i++) {
        (function (idx) {
          var meta = { index: idx, total: total };
          var wrappedOnData = function (result, fileName) {
            onData(result, fileName, meta);
          };
          ioDropzoneHandleFile(files[idx], wrappedOnData, opts);
        })(i);
      }
    } else {
      ioDropzoneHandleFile(files[0], onData, opts);
    }
  });
}

function setupFilePicker(inputEl, onData, opts) {
  opts = opts || {};

  inputEl.addEventListener('change', function () {
    var files = inputEl.files;
    if (!files || files.length === 0) return;

    if (opts.multiple === true) {
      if (opts.gateBatch) {
        var batchResult = opts.gateBatch(files);
        if (!batchResult.ok) {
          (opts.onError || function () {})(batchResult.message);
          return;
        }
      }
      var total = files.length;
      for (var i = 0; i < total; i++) {
        (function (idx) {
          var meta = { index: idx, total: total };
          var wrappedOnData = function (result, fileName) {
            onData(result, fileName, meta);
          };
          ioDropzoneHandleFile(files[idx], wrappedOnData, opts);
        })(i);
      }
    } else {
      ioDropzoneHandleFile(files[0], onData, opts);
    }
  });
}

// shared/img-file-size.js

function checkImageFileSize(byteLength) {
  var bytes = Number(byteLength) || 0;
  var MB = 1024 * 1024;

  if (bytes <= 30 * MB) {
    return {
      ok: true,
      level: 'ok',
      message: '檔案大小正常'
    };
  } else if (bytes <= 80 * MB) {
    return {
      ok: true,
      level: 'warn',
      message: '檔案較大（' + (bytes / MB).toFixed(1) + 'MB），處理可能需要數秒'
    };
  } else {
    return {
      ok: false,
      level: 'reject',
      message: '檔案超過 80MB 上限（' + (bytes / MB).toFixed(1) + 'MB），已拒絕載入'
    };
  }
}

function checkBatchSize(totalByteLength, fileCount) {
  var bytes = Number(totalByteLength) || 0;
  var count = Number(fileCount) || 0;
  var MB = 1024 * 1024;

  if (bytes <= 200 * MB) {
    return {
      ok: true,
      level: 'ok',
      message: '批次大小正常（共 ' + count + ' 檔，' + (bytes / MB).toFixed(1) + 'MB）'
    };
  } else if (bytes <= 500 * MB) {
    return {
      ok: true,
      level: 'warn',
      message: '批次較大（共 ' + count + ' 檔，' + (bytes / MB).toFixed(1) + 'MB），批次處理可能需要較長時間'
    };
  } else {
    return {
      ok: false,
      level: 'reject',
      message: '批次總量超過 500MB 上限（' + (bytes / MB).toFixed(1) + 'MB），已拒絕整批載入'
    };
  }
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    checkImageFileSize: checkImageFileSize,
    checkBatchSize: checkBatchSize
  };
}

// shared/img-decode.js

// Tiny 2x1 real JPEG (EXIF Orientation=6, distinct width/height so a swap
// is observable) used to self-test whether this browser's
// createImageBitmap({imageOrientation:'none'}) actually returns the raw,
// un-rotated pixels. Verified against real browsers (2026-08): Chromium 141,
// Firefox 142 and WebKit 26 all ACCEPT the option without error but SILENTLY
// IGNORE it and still auto-apply EXIF rotation (bitmap comes back rotated,
// same as calling createImageBitmap() with no options at all). Because
// feature-detecting the option's mere existence would be wrong on every
// current engine, this probe measures actual behavior instead.

      var rad = (deg % 360) * Math.PI / 180;
      var sin = Math.abs(Math.sin(rad));
      var cos = Math.abs(Math.cos(rad));
      var newW = Math.round(sourceCanvas.width * cos + sourceCanvas.height * sin);
      var newH = Math.round(sourceCanvas.width * sin + sourceCanvas.height * cos);

      var rotC = document.createElement('canvas');
      rotC.width = newW;
      rotC.height = newH;
      var rotCtx = rotC.getContext('2d');

      rotCtx.translate(newW / 2, newH / 2);
      rotCtx.rotate(rad);
      rotCtx.drawImage(sourceCanvas, -sourceCanvas.width / 2, -sourceCanvas.height / 2);

      return rotC;
    }

    function updateHandlesPosition() {
      if (!mainCanvas || state.isWarped || state.isBeforeView) {
        handles.forEach(function (h) { if (h) h.style.display = 'none'; });
        if (polyGuide) polyGuide.setAttribute('points', '');
        return;
      }

      var rect = mainCanvas.getBoundingClientRect();
      var containerRect = canvasContainer.getBoundingClientRect();
      var offsetX = rect.left - containerRect.left;
      var offsetY = rect.top - containerRect.top;

      var points = [];
      state.corners.forEach(function (pt, idx) {
        var hx = offsetX + pt.x * rect.width;
        var hy = offsetY + pt.y * rect.height;

        if (handles[idx]) {
          handles[idx].style.left = hx + 'px';
          handles[idx].style.top = hy + 'px';
          handles[idx].style.display = 'block';
        }
        points.push(hx + ',' + hy);
      });

      if (polyGuide) {
        polyGuide.setAttribute('points', points.join(' '));
      }
    }

    // 二次裁切框只在 Tier 3 校正完成（isWarped）且非 Before 檢視時顯示，
    // 僅操作 state.cropRect（正規化座標），不動 corners / rawImageCanvas / rotatedCanvas
    function updateCropHandlesPosition() {
      var visible = state.isWarped && !state.isBeforeView && !!state.warpedCanvas;

      if (!visible || !mainCanvas) {
        cropHandles.forEach(function (h) { if (h) h.style.display = 'none'; });
        if (cropRectEl) cropRectEl.style.display = 'none';
        return;
      }

      var rect = mainCanvas.getBoundingClientRect();
      var containerRect = canvasContainer.getBoundingClientRect();
      var offsetX = rect.left - containerRect.left;
      var offsetY = rect.top - containerRect.top;

      var cr = state.cropRect;
      var x0 = offsetX + cr.x0 * rect.width;
      var y0 = offsetY + cr.y0 * rect.height;
      var x1 = offsetX + cr.x1 * rect.width;
      var y1 = offsetY + cr.y1 * rect.height;

      var pts = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
      cropHandles.forEach(function (h, idx) {
        if (!h) return;
        h.style.left = pts[idx][0] + 'px';
        h.style.top = pts[idx][1] + 'px';
        h.style.display = 'block';
      });

      if (cropRectEl) {
        cropRectEl.setAttribute('x', x0);
        cropRectEl.setAttribute('y', y0);
        cropRectEl.setAttribute('width', Math.max(0, x1 - x0));
        cropRectEl.setAttribute('height', Math.max(0, y1 - y0));
        cropRectEl.style.display = 'block';
      }
    }

    function applyFiltersToCanvas(srcCanvas) {
      var outC = document.createElement('canvas');
      outC.width = srcCanvas.width;
      outC.height = srcCanvas.height;
      var ctx = outC.getContext('2d');
      ctx.drawImage(srcCanvas, 0, 0);

      var b = state.filters.brightness;
      var c = state.filters.contrast;
      var gray = state.filters.grayscale;

      if (b === 0 && c === 0 && !gray) {
        return outC;
      }

      var imgData = ctx.getImageData(0, 0, outC.width, outC.height);
      var data = imgData.data;
      var factor = (c !== 0) ? ((259 * (c + 255)) / (255 * (259 - c))) : 1;

      for (var i = 0; i < data.length; i += 4) {
        var r = data[i];
        var g = data[i + 1];
        var bVal = data[i + 2];

        // Grayscale
        if (gray) {
          var gAvg = 0.299 * r + 0.587 * g + 0.114 * bVal;
          r = g = bVal = gAvg;
        }

        // Contrast
        if (c !== 0) {
          r = factor * (r - 128) + 128;
          g = factor * (g - 128) + 128;
          bVal = factor * (bVal - 128) + 128;
        }

        // Brightness
        if (b !== 0) {
          r += b;
          g += b;
          bVal += b;
        }

        data[i] = Math.min(255, Math.max(0, r));
        data[i + 1] = Math.min(255, Math.max(0, g));
        data[i + 2] = Math.min(255, Math.max(0, bVal));
      }

      ctx.putImageData(imgData, 0, 0);
      return outC;
    }

    function renderDisplay() {
      if (!mainCanvas || !mainCtx) return;

      if (state.isBeforeView && state.rotatedCanvas) {
        mainCanvas.width = state.rotatedCanvas.width;
        mainCanvas.height = state.rotatedCanvas.height;
        mainCtx.drawImage(state.rotatedCanvas, 0, 0);
        updateHandlesPosition();
        updateCropHandlesPosition();
        setLivePreviewVisible(false);
        if (statusHint) statusHint.textContent = '【目前為 Before 原圖檢視模式（旋轉後、校正前）】';
        return;
      }

      if (state.isWarped && state.warpedCanvas) {
        var filtered = applyFiltersToCanvas(state.warpedCanvas);
        mainCanvas.width = filtered.width;
        mainCanvas.height = filtered.height;
        mainCtx.drawImage(filtered, 0, 0);
        updateHandlesPosition();
        updateCropHandlesPosition();
        setLivePreviewVisible(false);
        if (statusHint) statusHint.textContent = '已套用透視校正與濾鏡。可拖曳裁切框後按「套用裁切」，或直接下載/輸出 PDF。';
        return;
      }

      if (state.rotatedCanvas) {
        mainCanvas.width = state.rotatedCanvas.width;
        mainCanvas.height = state.rotatedCanvas.height;
        mainCtx.drawImage(state.rotatedCanvas, 0, 0);
        updateHandlesPosition();
        updateCropHandlesPosition();
        setLivePreviewVisible(true);
        applyTier1Preview();
        if (statusHint) statusHint.textContent = '拖曳畫面中四個藍色角點以對齊文件四角';
      }
    }

    function performPerspectiveWarp(sourceCanvas, normCorners) {
      var w = sourceCanvas.width;
      var h = sourceCanvas.height;

      // img-perspective.js contract: solveHomography()/invertHomography() take
      // [[x,y],[x,y],[x,y],[x,y]] arrays, not {x,y} objects (srcQuad[i][0]/[1]).
      var srcPts = normCorners.map(function (p) {
        return [p.x * w, p.y * h];
      });

      // Compute destination dimensions based on max width & height of edges
      var topLen = Math.hypot(srcPts[1][0] - srcPts[0][0], srcPts[1][1] - srcPts[0][1]);
      var botLen = Math.hypot(srcPts[2][0] - srcPts[3][0], srcPts[2][1] - srcPts[3][1]);
      var leftLen = Math.hypot(srcPts[3][0] - srcPts[0][0], srcPts[3][1] - srcPts[0][1]);
      var rightLen = Math.hypot(srcPts[2][0] - srcPts[1][0], srcPts[2][1] - srcPts[1][1]);

      var dstW = Math.max(10, Math.round(Math.max(topLen, botLen)));
      var dstH = Math.max(10, Math.round(Math.max(leftLen, rightLen)));

      var dstPts = [
        [0, 0],
        [dstW, 0],
        [dstW, dstH],
        [0, dstH]
      ];

      var H = solveHomography(srcPts, dstPts);
      var Hinv = invertHomography(H);

      var srcCtx = sourceCanvas.getContext('2d');
      var srcImgData = srcCtx.getImageData(0, 0, w, h);

      var dstImgData = warpImageData(srcImgData, Hinv, dstW, dstH);

      var outCanvas = document.createElement('canvas');
      outCanvas.width = dstW;
      outCanvas.height = dstH;
      var outCtx = outCanvas.getContext('2d');
      outCtx.putImageData(dstImgData, 0, 0);

      return outCanvas;
    }

    // ---- Tier 1 / Tier 2 即時透視預覽（IMG_CONTRACT.md 第 6 節）----
    // Tier 1（拖曳中每個 pointermove）：只算 homography，換成 CSS matrix3d 套在
    // #live-preview-img（承載原圖的元素）上，不呼叫 warpImageData()。
    // Tier 2（拖曳停止 debounce 150ms 後）：對長邊 800px 縮小 canvas 真正跑一次
    // warpImageData()，取代 Tier 1 的 CSS 近似結果。

    function homographyToMatrix3d(H) {
      // 3x3 row-major homography [h0..h8] 嵌入 CSS matrix3d 的 4x4 column-major矩陣
      // （z 軸不變，w 分量取代第三列做透視除法）。
      return 'matrix3d(' +
        H[0] + ',' + H[3] + ',0,' + H[6] + ',' +
        H[1] + ',' + H[4] + ',0,' + H[7] + ',' +
        '0,0,1,0,' +
        H[2] + ',' + H[5] + ',0,' + H[8] +
        ')';
    }

    function updateLivePreviewSource() {
      if (!livePreviewImg || !state.rotatedCanvas) return;
      livePreviewImg.style.transform = 'none';
      livePreviewImg.src = state.rotatedCanvas.toDataURL('image/png');
    }

    function setLivePreviewVisible(visible) {
      if (!livePreviewPanel) return;
      livePreviewPanel.classList.toggle('visible', !!visible);
    }

    function applyTier1Preview() {
      if (!livePreviewImg) return;
      var w = livePreviewImg.clientWidth || livePreviewImg.naturalWidth;
      var h = livePreviewImg.clientHeight || livePreviewImg.naturalHeight;
      if (!w || !h) return;

      var srcQuad = [[0, 0], [w, 0], [w, h], [0, h]];
      var dstQuad = state.corners.map(function (p) {
        return [p.x * w, p.y * h];
      });

      try {
        var H = solveHomography(srcQuad, dstQuad);
        livePreviewImg.style.transform = homographyToMatrix3d(H);
      } catch (err) {
        // 拖曳過程中角點暫時退化/共線時保留上一幀畫面，不中斷拖曳
      }
    }

    var scheduleTier2Preview = debounce(function () {
      if (!state.rotatedCanvas || !livePreviewImg) return;
      try {
        var smallSrc = resizeCanvas(state.rotatedCanvas, { maxLongEdge: 800 });
        var warped = performPerspectiveWarp(smallSrc, state.corners);
        livePreviewImg.style.transform = 'none';
        livePreviewImg.src = warped.toDataURL('image/png');
      } catch (err) {
        // 角點退化/共線：保留目前畫面，不覆蓋成壞圖
      }
    }, 150);

    function loadDocumentFile(file) {
      var gate = checkImageFileSize(file.size);
      if (!gate.ok) {
        showToast(gate.message, 3000);
        return;
      } else if (gate.level === 'warn') {
        showToast(gate.message, 2500);
      }

      loadImageFile(file).then(function (res) {
        state.file = file;
        state.fileName = file.name || 'document.jpg';
        state.rawImageCanvas = res.canvas;
        state.rotationDeg = 0;
        state.rotatedCanvas = res.canvas;
        state.warpedCanvas = null;
        state.isWarped = false;
        state.isBeforeView = false;
        state.cropRect = { x0: 0, y0: 0, x1: 1, y1: 1 };
        state.filters = { brightness: 0, contrast: 0, grayscale: false };

        if (filterBrightness) filterBrightness.value = 0;
        if (valBrightness) valBrightness.textContent = '0';
        if (filterContrast) filterContrast.value = 0;
        if (valContrast) valContrast.textContent = '0';
        if (filterGrayscale) filterGrayscale.checked = false;

        resetCorners();

        if (editorSection) editorSection.style.display = 'block';
        if (dropZone) dropZone.style.display = 'none';

        updateLivePreviewSource();
        renderDisplay();
        showToast('文件照片載入成功！');
      }).catch(function (err) {
        showToast('載入失敗：' + (err.message || '未知錯誤'));
      });
    }

    if (btnSelectFile && fileInput) {
      btnSelectFile.addEventListener('click', function () {
        fileInput.click();
      });
      fileInput.addEventListener('change', function () {
        if (fileInput.files && fileInput.files[0]) {
          loadDocumentFile(fileInput.files[0]);
          fileInput.value = '';
        }
      });
    }

    if (dropZone) {
      setupDropZone(dropZone, function () {}, {
        accept: ['.jpg', '.jpeg', '.png', '.webp'],
        gate: function (file) { return checkImageFileSize(file.size); },
        onError: function (msg) { showToast(msg); }
      });
      dropZone.addEventListener('drop', function (e) {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          loadDocumentFile(e.dataTransfer.files[0]);
        }
      });
    }

    // Corner dragging interaction
    handles.forEach(function (handle, idx) {
      if (!handle) return;
      handle.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        state.activeCorner = idx;
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener('pointermove', function (e) {
        if (state.activeCorner !== idx || !mainCanvas) return;
        var rect = mainCanvas.getBoundingClientRect();
        var clientX = e.clientX;
        var clientY = e.clientY;

        var normX = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
        var normY = Math.min(Math.max((clientY - rect.top) / rect.height, 0), 1);

        state.corners[idx] = { x: normX, y: normY };
        updateHandlesPosition();
        applyTier1Preview();
        scheduleTier2Preview();
      });

      handle.addEventListener('pointerup', function (e) {
        if (state.activeCorner === idx) {
          state.activeCorner = -1;
          handle.releasePointerCapture(e.pointerId);
          updateHandlesPosition();
          scheduleTier2Preview();
        }
      });
    });

    // Crop-box dragging interaction（僅調整 state.cropRect，不動角點與原始畫布）
    cropHandles.forEach(function (handle, idx) {
      if (!handle) return;
      handle.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        activeCropHandle = idx;
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener('pointermove', function (e) {
        if (activeCropHandle !== idx || !mainCanvas) return;
        var rect = mainCanvas.getBoundingClientRect();
        var normX = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
        var normY = Math.min(Math.max((e.clientY - rect.top) / rect.height, 0), 1);
        var minGap = 0.03;
        var keys = cropHandleKeys[idx];

        if (keys[0] === 'x0') {
          state.cropRect.x0 = Math.min(normX, state.cropRect.x1 - minGap);
        } else {
          state.cropRect.x1 = Math.max(normX, state.cropRect.x0 + minGap);
        }
        if (keys[1] === 'y0') {
          state.cropRect.y0 = Math.min(normY, state.cropRect.y1 - minGap);
        } else {
          state.cropRect.y1 = Math.max(normY, state.cropRect.y0 + minGap);
        }

        updateCropHandlesPosition();
      });

      handle.addEventListener('pointerup', function (e) {
        if (activeCropHandle === idx) {
          activeCropHandle = -1;
          handle.releasePointerCapture(e.pointerId);
          updateCropHandlesPosition();
        }
      });
    });

    window.addEventListener('resize', function () {
      updateHandlesPosition();
      updateCropHandlesPosition();
    });

    if (btnRotLeft) {
      btnRotLeft.addEventListener('click', function () {
        if (!state.rawImageCanvas) return;
        state.rotationDeg = (state.rotationDeg + 270) % 360;
        state.rotatedCanvas = createRotatedCanvas(state.rawImageCanvas, state.rotationDeg);
        state.isWarped = false;
        state.warpedCanvas = null;
        state.cropRect = { x0: 0, y0: 0, x1: 1, y1: 1 };
        resetCorners();
        updateLivePreviewSource();
        renderDisplay();
        showToast('已向左旋轉 90°');
      });
    }

    if (btnRotRight) {
      btnRotRight.addEventListener('click', function () {
        if (!state.rawImageCanvas) return;
        state.rotationDeg = (state.rotationDeg + 90) % 360;
        state.rotatedCanvas = createRotatedCanvas(state.rawImageCanvas, state.rotationDeg);
        state.isWarped = false;
        state.warpedCanvas = null;
        state.cropRect = { x0: 0, y0: 0, x1: 1, y1: 1 };
        resetCorners();
        updateLivePreviewSource();
        renderDisplay();
        showToast('已向右旋轉 90°');
      });
    }

    if (btnApplyWarp) {
      btnApplyWarp.addEventListener('click', function () {
        if (!state.rotatedCanvas) return;
        try {
          state.warpedCanvas = performPerspectiveWarp(state.rotatedCanvas, state.corners);
          state.isWarped = true;
          state.isBeforeView = false;
          state.cropRect = { x0: 0, y0: 0, x1: 1, y1: 1 };
          renderDisplay();
          showToast('透視校正完成！');
        } catch (err) {
          showToast('校正失敗（角點退化或共線）：' + (err.message || '未知錯誤'));
        }
      });
    }

    if (btnApplyCrop) {
      btnApplyCrop.addEventListener('click', function () {
        if (!state.isWarped || !state.warpedCanvas) return;
        var cr = state.cropRect;
        var w = state.warpedCanvas.width;
        var h = state.warpedCanvas.height;
        var sx = Math.round(cr.x0 * w);
        var sy = Math.round(cr.y0 * h);
        var sw = Math.max(1, Math.round((cr.x1 - cr.x0) * w));
        var sh = Math.max(1, Math.round((cr.y1 - cr.y0) * h));

        // 全範圍（未調整裁切框）時不需要重繪，直接跳過以保持輸出與未使用裁切功能時完全一致
        if (sx === 0 && sy === 0 && sw === w && sh === h) {
          showToast('裁切框維持全範圍，未套用裁切');
          return;
        }

        var croppedCanvas = document.createElement('canvas');
        croppedCanvas.width = sw;
        croppedCanvas.height = sh;
        croppedCanvas.getContext('2d').drawImage(state.warpedCanvas, sx, sy, sw, sh, 0, 0, sw, sh);

        // 裁切只取代 state.warpedCanvas（Tier 3 校正輸出），不動角點資料或
        // state.rawImageCanvas / state.rotatedCanvas
        state.warpedCanvas = croppedCanvas;
        state.cropRect = { x0: 0, y0: 0, x1: 1, y1: 1 };
        renderDisplay();
        showToast('已套用裁切');
      });
    }

    if (btnResetCrop) {
      btnResetCrop.addEventListener('click', function () {
        state.cropRect = { x0: 0, y0: 0, x1: 1, y1: 1 };
        updateCropHandlesPosition();
        showToast('已重設裁切範圍');
      });
    }

    if (btnToggleView) {
      btnToggleView.addEventListener('click', function () {
        state.isBeforeView = !state.isBeforeView;
        btnToggleView.textContent = state.isBeforeView ? '👁️ 切換回校正 (After)' : '👁️ 檢視原圖 (Before)';
        renderDisplay();
      });
    }

    if (btnRestore) {
      btnRestore.addEventListener('click', function () {
        if (!state.rawImageCanvas) return;
        state.rotationDeg = 0;
        state.rotatedCanvas = state.rawImageCanvas;
        state.warpedCanvas = null;
        state.isWarped = false;
        state.isBeforeView = false;
        state.cropRect = { x0: 0, y0: 0, x1: 1, y1: 1 };
        state.filters = { brightness: 0, contrast: 0, grayscale: false };

        if (filterBrightness) filterBrightness.value = 0;
        if (valBrightness) valBrightness.textContent = '0';
        if (filterContrast) filterContrast.value = 0;
        if (valContrast) valContrast.textContent = '0';
        if (filterGrayscale) filterGrayscale.checked = false;

        resetCorners();
        updateLivePreviewSource();
        renderDisplay();
        showToast('已還原重置');
      });
    }

    // Filters event listeners
    if (filterBrightness) {
      filterBrightness.addEventListener('input', function () {
        state.filters.brightness = Number(filterBrightness.value);
        if (valBrightness) valBrightness.textContent = filterBrightness.value;
        renderDisplay();
      });
    }

    if (filterContrast) {
      filterContrast.addEventListener('input', function () {
        state.filters.contrast = Number(filterContrast.value);
        if (valContrast) valContrast.textContent = filterContrast.value;
        renderDisplay();
      });
    }

    if (filterGrayscale) {
      filterGrayscale.addEventListener('change', function () {
        state.filters.grayscale = filterGrayscale.checked;
        renderDisplay();
      });
    }

    function getFinalExportCanvas() {
      if (state.warpedCanvas) {
        return applyFiltersToCanvas(state.warpedCanvas);
      } else if (state.rotatedCanvas) {
        return applyFiltersToCanvas(state.rotatedCanvas);
      }
      return mainCanvas;
    }

    function getExportBaseName() {
      var dot = state.fileName.lastIndexOf('.');
      return (dot !== -1) ? state.fileName.substring(0, dot) : state.fileName;
    }

    if (btnDlJpg) {
      btnDlJpg.addEventListener('click', function () {
        var canvas = getFinalExportCanvas();
        if (!canvas) return;
        canvasToBlob(canvas, 'image/jpeg', 0.95).then(function (blob) {
          downloadFile(getExportBaseName() + '_perspective.jpg', blob, 'image/jpeg');
          showToast('已下載校正後 JPG');
        });
      });
    }

    if (btnDlPng) {
      btnDlPng.addEventListener('click', function () {
        var canvas = getFinalExportCanvas();
        if (!canvas) return;
        canvasToBlob(canvas, 'image/png', 0.95).then(function (blob) {
          downloadFile(getExportBaseName() + '_perspective.png', blob, 'image/png');
          showToast('已下載校正後 PNG');
        });
      });
    }

    if (btnPrintPdf) {
      btnPrintPdf.addEventListener('click', function () {
        var canvas = getFinalExportCanvas();
        if (!canvas || !printImg) return;
        canvasToBlob(canvas, 'image/png', 0.95).then(function (blob) {
          var url = URL.createObjectURL(blob);
          printImg.src = url;
          if (printArea) printArea.style.display = 'block';
          window.print();
          setTimeout(function () {
            if (printArea) printArea.style.display = 'none';
            URL.revokeObjectURL(url);
          }, 1000);
        });
      });
    }

    if (btnCopySummary) {
      btnCopySummary.addEventListener('click', function () {
        var text = '【文件照片透視校正報告】\n' +
                   '檔案名稱：' + state.fileName + '\n' +
                   '旋轉角度：' + state.rotationDeg + '°\n' +
                   '透視校正狀態：' + (state.isWarped ? '已完成校正' : '尚未校正') + '\n' +
                   '影像濾鏡：亮度 ' + state.filters.brightness + ', 對比 ' + state.filters.contrast + ', 灰階 ' + (state.filters.grayscale ? '開啟' : '關閉') + '\n';
        copyToClipboard(text).then(function () {
          showToast('已複製處理摘要');
        });
      });
    }

    function buildCleanHtmlCopy() {
      var doc = document.documentElement.cloneNode(true);

      var toast = doc.querySelector('#__shared_toast');
      if (toast) toast.remove();

      var navBack = doc.querySelector('.nav-back');
      if (navBack) navBack.remove();

      var offlineBtn = doc.querySelector('#btn-download-offline');
      if (offlineBtn) offlineBtn.remove();

      var edSection = doc.querySelector('#editor-section');
      if (edSection) edSection.style.display = 'none';

      var dZone = doc.querySelector('#drop-zone');
      if (dZone) dZone.style.display = 'block';

      var c = doc.querySelector('#main-canvas');
      if (c) { c.width = 0; c.height = 0; }

      return '<!DOCTYPE html>\n' + doc.outerHTML;
    }

    window.buildCleanHtmlCopy = buildCleanHtmlCopy;

    if (btnDownloadOffline) {
      btnDownloadOffline.addEventListener('click', function () {
        var cleanHtml = buildCleanHtmlCopy();
        downloadFile('document-perspective-corrector-offline.html', cleanHtml, 'text/html;charset=utf-8');
        showToast('已下載離線版工具');
      });
    }
  })();
  </script>
</body>
</html>
