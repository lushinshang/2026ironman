<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字數與段落統計器</title>
<style>
  :root{
    --bg:#f9f7f4;
    --text:#1a1a1a;
    --muted:#6b6459;
    --accent:#9a5b3c;
    --card:#ffffff;
    --border:#e6e1d8;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:16px;
    line-height:1.6;
  }
  header{
    max-width:1120px;
    margin:0 auto;
    padding:32px 24px 8px;
  }
  h1{
    font-size:clamp(1.5rem,3.2vw,2rem);
    margin:0 0 4px;
  }
  header p{
    color:var(--muted);
    font-size:14px;
    margin:0;
  }
  main{
    max-width:1120px;
    margin:0 auto;
    padding:16px 24px 60px;
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:24px;
    align-items:start;
  }
  .input-panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:8px;
  }
  textarea{
    width:100%;
    min-height:420px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
    font-size:15px;
    font-family:inherit;
    line-height:1.7;
    color:var(--text);
    background:#fffdfa;
  }
  textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .stats-panel{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
  }
  .limit-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .limit-row input[type="number"]{
    width:100px;
    padding:6px 8px;
    border:1px solid var(--border);
    border-radius:6px;
    font-size:14px;
    font-family:inherit;
  }
  .progress-track{
    width:100%;
    height:10px;
    background:#eee7db;
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .15s ease, background-color .15s ease;
  }
  .progress-fill.over{
    background:var(--danger);
  }
  .progress-percent{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
    text-align:right;
  }
  .stat-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .stat-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:6px 0;
    border-bottom:1px solid var(--border);
  }
  .stat-row:last-child{border-bottom:none;}
  .stat-label{
    font-size:14px;
    color:var(--muted);
  }
  .stat-value{
    font-size:22px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .stat-value.over{color:var(--danger);}
  .btn-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  button{
    font-family:inherit;
    font-size:14px;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    cursor:pointer;
  }
  button:hover{border-color:var(--accent); color:var(--accent);}
  button.primary{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  button.primary:hover{opacity:.9; color:#fff;}
  .btn-download{
    grid-column:1 / -1;
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .btn-download:hover{opacity:.9; color:#fff;}
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#1a1a1a;
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  @media (max-width:760px){
    main{grid-template-columns:1fr;}
    textarea{min-height:260px;}
    .btn-row{grid-template-columns:1fr 1fr;}
  }
  .nav-back{
    max-width:1120px;
    margin:0 auto;
    padding:16px 24px 0;
    font-size:14px;
  }
  .nav-back a{
    color:var(--accent);
    text-decoration:none;
  }
  .nav-back a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="nav-back"><a href="../index.html">← 返回 Vibe Coding 100 題清單</a></div>

<header>
  <h1>字數與段落統計器</h1>
  <p>貼上文字即時統計中英文字數與段落數，所有計算在瀏覽器本機完成，不上傳任何內容。</p>
</header>

<main>
  <section class="input-panel">
    <label for="text-input">輸入文字</label>
    <textarea id="text-input" placeholder="在這裡貼上或輸入文字…" aria-label="輸入文字"></textarea>
  </section>

  <section class="stats-panel">
    <div class="card">
      <div class="limit-row">
        <label for="limit-input" style="margin:0;">字數上限</label>
        <input type="number" id="limit-input" min="0" placeholder="不限制">
        <span style="font-size:13px;color:var(--muted);">字</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-percent" id="progress-percent">未設定上限</div>
    </div>

    <div class="card stat-list" id="stat-list" aria-live="polite">
      <div class="stat-row">
        <span class="stat-label">中文字數</span>
        <span class="stat-value" id="stat-zh">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">英文單字數</span>
        <span class="stat-value" id="stat-en">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">總字數（含標點）</span>
        <span class="stat-value" id="stat-total">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">段落數</span>
        <span class="stat-value" id="stat-para">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">標點符號數</span>
        <span class="stat-value" id="stat-punct">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">空白字元數</span>
        <span class="stat-value" id="stat-space">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">換行（段落分隔）次數</span>
        <span class="stat-value" id="stat-newline">0</span>
      </div>
    </div>

    <div class="card">
      <div class="btn-row">
        <button id="btn-clear">清空</button>
        <button id="btn-copy">複製摘要</button>
        <button id="btn-export-md">匯出 Markdown</button>
        <button id="btn-export-csv">匯出 CSV</button>
        <button id="btn-download-html" class="btn-download">下載本工具（離線使用）</button>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var CJK_RE = /[㐀-䶿一-鿿豈-﫿]/g;
  var EN_WORD_RE = /[A-Za-z]+(?:'[A-Za-z]+)?/g;
  var PUNCT_RE = /[，。！？；：「」『』（）【】《》〈〉、～…—,.!?;:()\[\]{}"'`\-_/\\]/g;
  var WHITESPACE_NO_NEWLINE_RE = /[^\S\n]/g;

  function countMatches(str, re){
    var m = str.match(re);
    return m ? m.length : 0;
  }

  function countParagraphs(str){
    if (!str.trim()) return 0;
    var blocks = str.split(/\n\s*\n/).map(function(b){ return b.trim(); }).filter(Boolean);
    return blocks.length;
  }

  function computeStats(raw){
    var text = raw || "";
    var zhCount = countMatches(text, CJK_RE);
    var enCount = countMatches(text, EN_WORD_RE);
    var punctCount = countMatches(text, PUNCT_RE);
    var spaceCount = countMatches(text, WHITESPACE_NO_NEWLINE_RE);
    var newlineCount = countMatches(text, /\n/g);
    var totalVisible = countMatches(text, /\S/g);

    return {
      zh: zhCount,
      en: enCount,
      total: totalVisible,
      para: countParagraphs(text),
      punct: punctCount,
      space: spaceCount,
      newline: newlineCount
    };
  }

  var textInput = document.getElementById("text-input");
  var limitInput = document.getElementById("limit-input");
  var progressFill = document.getElementById("progress-fill");
  var progressPercent = document.getElementById("progress-percent");

  var elZh = document.getElementById("stat-zh");
  var elEn = document.getElementById("stat-en");
  var elTotal = document.getElementById("stat-total");
  var elPara = document.getElementById("stat-para");
  var elPunct = document.getElementById("stat-punct");
  var elSpace = document.getElementById("stat-space");
  var elNewline = document.getElementById("stat-newline");

  var toast = document.getElementById("toast");
  var toastTimer = null;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 1800);
  }

  var lastStats = computeStats("");

  function render(){
    var stats = computeStats(textInput.value);
    lastStats = stats;

    elZh.textContent = stats.zh;
    elEn.textContent = stats.en;
    elTotal.textContent = stats.total;
    elPara.textContent = stats.para;
    elPunct.textContent = stats.punct;
    elSpace.textContent = stats.space;
    elNewline.textContent = stats.newline;

    var limit = parseInt(limitInput.value, 10);
    var hasLimit = !isNaN(limit) && limit > 0;
    var isOver = hasLimit && stats.total > limit;

    if (hasLimit){
      var pct = Math.min(100, Math.round((stats.total / limit) * 100));
      progressFill.style.width = pct + "%";
      progressPercent.textContent = stats.total + " / " + limit + "（" + Math.round((stats.total / limit) * 100) + "%）";
    } else {
      progressFill.style.width = "0%";
      progressPercent.textContent = "未設定上限";
    }

    progressFill.classList.toggle("over", isOver);
    elTotal.classList.toggle("over", isOver);
  }

  var debounceTimer = null;
  function scheduleRender(){
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 150);
  }

  textInput.addEventListener("input", scheduleRender);
  limitInput.addEventListener("input", render);

  document.getElementById("btn-clear").addEventListener("click", function(){
    textInput.value = "";
    limitInput.value = "";
    render();
    textInput.focus();
  });

  document.getElementById("btn-copy").addEventListener("click", function(){
    var summary = "中文字數：" + lastStats.zh +
      "／英文單字數：" + lastStats.en +
      "／總字數：" + lastStats.total +
      "／段落數：" + lastStats.para;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(summary).then(function(){
        showToast("已複製統計摘要");
      }).catch(function(){
        showToast("複製失敗，請手動選取");
      });
    } else {
      showToast("此瀏覽器不支援自動複製");
    }
  });

  function buildReportFields(){
    var limit = parseInt(limitInput.value, 10);
    var hasLimit = !isNaN(limit) && limit > 0;
    var isOver = hasLimit && lastStats.total > limit;
    return {
      zh: lastStats.zh,
      en: lastStats.en,
      total: lastStats.total,
      para: lastStats.para,
      punct: lastStats.punct,
      over: hasLimit ? (isOver ? "是" : "否") : "未設定上限"
    };
  }

  function downloadFile(filename, content, mime){
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById("btn-export-md").addEventListener("click", function(){
    var f = buildReportFields();
    var md = "# 字數統計報告\n\n" +
      "| 項目 | 數值 |\n|---|---|\n" +
      "| 中文字數 | " + f.zh + " |\n" +
      "| 英文單字數 | " + f.en + " |\n" +
      "| 總字數（含標點） | " + f.total + " |\n" +
      "| 段落數 | " + f.para + " |\n" +
      "| 標點符號數 | " + f.punct + " |\n" +
      "| 是否超標 | " + f.over + " |\n";
    downloadFile("字數統計報告.md", md, "text/markdown;charset=utf-8");
  });

  document.getElementById("btn-export-csv").addEventListener("click", function(){
    var f = buildReportFields();
    var csv = "項目,數值\n" +
      "中文字數," + f.zh + "\n" +
      "英文單字數," + f.en + "\n" +
      "總字數（含標點）," + f.total + "\n" +
      "段落數," + f.para + "\n" +
      "標點符號數," + f.punct + "\n" +
      "是否超標," + f.over + "\n";
    downloadFile("字數統計報告.csv", "﻿" + csv, "text/csv;charset=utf-8");
  });

  function buildCleanHtmlCopy(){
    var clone = document.documentElement.cloneNode(true);

    var cloneNavBack = clone.querySelector(".nav-back");
    if (cloneNavBack) cloneNavBack.remove();

    ["stat-zh", "stat-en", "stat-total", "stat-para", "stat-punct", "stat-space", "stat-newline"].forEach(function(id){
      var el = clone.querySelector("#" + id);
      if (el){
        el.textContent = "0";
        el.classList.remove("over");
      }
    });

    var cloneProgressFill = clone.querySelector("#progress-fill");
    if (cloneProgressFill){
      cloneProgressFill.removeAttribute("style");
      cloneProgressFill.classList.remove("over");
    }

    var cloneProgressPercent = clone.querySelector("#progress-percent");
    if (cloneProgressPercent) cloneProgressPercent.textContent = "未設定上限";

    var cloneToast = clone.querySelector("#toast");
    if (cloneToast){
      cloneToast.textContent = "";
      cloneToast.classList.remove("show");
    }

    return "<!doctype html>\n" + clone.outerHTML;
  }

  document.getElementById("btn-download-html").addEventListener("click", function(){
    downloadFile("字數統計器.html", buildCleanHtmlCopy(), "text/html;charset=utf-8");
    showToast("已下載，可離線使用");
  });

  render();
})();
</script>

</body>
</html>
