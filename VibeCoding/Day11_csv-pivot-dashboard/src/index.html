<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSV Pivot Dashboard</title>
<style>
/* shared/base.css — 共用樣式基底，逐字複製，勿手動修改（改請去 shared/base.css 源頭並重新複製） */
:root {
  --color-bg: #f7f7f8;
  --color-surface: #ffffff;
  --color-border: #d9d9de;
  --color-text: #1f2328;
  --color-text-muted: #6b7280;
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-danger: #dc2626;
  --color-toast-bg: #1f2328;
  --color-toast-text: #ffffff;
  --radius: 8px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: var(--font-sans);
  color: var(--color-text);
  background: var(--color-bg);
  line-height: 1.6;
}

.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 24px 16px;
}

h1, h2, h3 {
  line-height: 1.3;
}

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 16px;
}

textarea,
input[type="text"],
input[type="number"],
select {
  width: 100%;
  font-family: inherit;
  font-size: 1rem;
  padding: 8px 10px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  color: var(--color-text);
}

button {
  font-family: inherit;
  font-size: 0.95rem;
  padding: 8px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text);
  cursor: pointer;
}

button:hover {
  background: var(--color-bg);
}

button.primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #ffffff;
}

button.primary:hover {
  background: var(--color-primary-hover);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.dropzone {
  border: 2px dashed var(--color-border);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  color: var(--color-text-muted);
}

.dropzone.dragover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.nav-back {
  display: inline-block;
  margin-bottom: 16px;
  color: var(--color-text-muted);
  text-decoration: none;
}

.nav-back:hover {
  text-decoration: underline;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 32px;
  transform: translateX(-50%);
  background: var(--color-toast-bg);
  color: var(--color-toast-text);
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 1000;
}

.toast.show {
  opacity: 1;
}

/* Day11 專屬樣式 */
.section-gap { margin-top: 16px; }
.hidden { display: none !important; }
.msg { padding: 8px 12px; border-radius: var(--radius); font-size: 0.9rem; }
.msg.warn { background: #fff7e6; color: #92610b; border: 1px solid #f2d18a; }
.msg.error { background: #fdecec; color: #a12622; border: 1px solid #f3b4b1; }
.file-meta { font-size: 0.9rem; color: var(--color-text-muted); margin: 8px 0; }
.file-hint { font-size: 0.85rem; color: var(--color-text-muted); }
.control-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-items: end; }
.control-field label { display: block; font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 4px; }
.filter-row { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; margin-bottom: 8px; }
.button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 8px; }
.kpi-card { border: 1px solid var(--color-border); border-radius: var(--radius); padding: 10px 12px; background: var(--color-bg); }
.kpi-card .kpi-label { font-size: 0.78rem; color: var(--color-text-muted); }
.kpi-card .kpi-value { font-size: 1.25rem; font-weight: 600; }
.kpi-note { font-size: 0.78rem; color: var(--color-text-muted); margin-top: 4px; }
.chart-placeholder { border: 1px dashed var(--color-border); border-radius: var(--radius); padding: 24px; text-align: center; color: var(--color-text-muted); font-size: 0.9rem; }
.chart-empty { border: 1px dashed var(--color-border); border-radius: var(--radius); padding: 24px; text-align: center; color: var(--color-text-muted); font-size: 0.9rem; }
.chart-note { font-size: 0.8rem; color: var(--color-text-muted); margin-top: 6px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 0.85rem; }
.chart-legend-item { display: flex; align-items: center; gap: 6px; }
.chart-legend-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.chart-tab-btn.active { background: var(--color-primary); border-color: var(--color-primary); color: #ffffff; }
.table-wrap { overflow-x: auto; }
table.pivot { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.pivot th, table.pivot td { border: 1px solid var(--color-border); padding: 6px 10px; text-align: right; white-space: nowrap; }
table.pivot th:first-child, table.pivot td:first-child,
table.pivot th.dim-col, table.pivot td.dim-col { text-align: left; }
table.pivot thead th { background: var(--color-bg); position: sticky; top: 0; }
table.pivot td.is-empty-key { color: var(--color-text-muted); font-style: italic; }
table.pivot td.has-nonnumeric { background: #fff7e6; }
.pivot-note { font-size: 0.8rem; color: var(--color-text-muted); margin-top: 6px; }
.bundled-licenses { margin-top: 24px; font-size: 0.78rem; color: var(--color-text-muted); border-top: 1px solid var(--color-border); padding-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <a class="nav-back" href="../index.html">← 返回作品集</a>

  <div class="page-header">
    <h1>CSV Pivot Dashboard</h1>
    <p>上傳 CSV，選擇 Group By 與 Measure 就能得到樞紐分析結果（表格 + KPI + Bar/Line/Pie 圖表），全程在瀏覽器本機完成，不上傳任何內容。</p>
  </div>

  <div id="dropzone" class="dropzone">拖曳 .csv 檔案到此，或使用下方按鈕選取檔案</div>
  <div class="button-row">
    <button type="button" class="small" id="btn-pick-file">選取 CSV 檔案</button>
    <input type="file" id="file-input" accept=".csv" style="display:none;">
  </div>
  <div id="size-msg"></div>
  <div id="file-meta" class="file-meta"></div>
  <div id="encoding-fallback" class="msg warn hidden"></div>

  <div class="card section-gap">
    <h3>Group By / Measure</h3>
    <div class="control-grid">
      <div class="control-field">
        <label for="dim1-select">Group By ①（Dimension）</label>
        <select id="dim1-select" disabled></select>
      </div>
      <div class="control-field">
        <label for="dim2-select">Group By ②</label>
        <select id="dim2-select" disabled></select>
      </div>
      <div class="control-field">
        <label for="date-granularity-select">日期粒度（作用於 Group By ①）</label>
        <select id="date-granularity-select" disabled>
          <option value="none">（不適用）</option>
          <option value="year">年</option>
          <option value="quarter">季</option>
          <option value="month">月</option>
        </select>
      </div>
      <div class="control-field">
        <label for="measure-select">Measure</label>
        <select id="measure-select" disabled></select>
      </div>
      <div class="control-field">
        <label for="aggregate-select">Aggregate</label>
        <select id="aggregate-select" disabled>
          <option value="SUM">SUM</option>
          <option value="COUNT">COUNT</option>
          <option value="AVG">AVG</option>
          <option value="MIN">MIN</option>
          <option value="MAX">MAX</option>
        </select>
      </div>
    </div>
    <div id="aggregate-note" class="file-hint"></div>
  </div>

  <div class="card section-gap">
    <h3>Filter（最多 3 條，AND）</h3>
    <div id="filter-rows"></div>

    <h3>Sort / 顯示</h3>
    <div class="control-grid">
      <div class="control-field">
        <label for="sort-field-select">Sort 依據</label>
        <select id="sort-field-select">
          <option value="measure">Measure 彙總值</option>
          <option value="count">筆數</option>
        </select>
      </div>
      <div class="control-field">
        <label for="sort-dir-select">方向</label>
        <select id="sort-dir-select">
          <option value="desc">降冪</option>
          <option value="asc">升冪</option>
        </select>
      </div>
      <div class="control-field">
        <label for="topn-mode-select">顯示</label>
        <select id="topn-mode-select">
          <option value="all">全部</option>
          <option value="top">Top N</option>
          <option value="bottom">Bottom N</option>
        </select>
      </div>
      <div class="control-field">
        <label for="topn-value-input">N</label>
        <input type="number" id="topn-value-input" min="1" step="1" value="10">
      </div>
    </div>
  </div>

  <div class="card section-gap">
    <h3>KPI</h3>
    <div id="kpi-note" class="kpi-note">Filter 後全體，不受 Top N 影響</div>
    <div id="kpi-area" class="kpi-grid"></div>
  </div>

  <div class="card section-gap">
    <h3>圖表</h3>
    <div class="button-row" id="chart-tabs">
      <button type="button" class="chart-tab-btn active" data-chart-type="bar">Bar</button>
      <button type="button" class="chart-tab-btn" data-chart-type="line">Line</button>
      <button type="button" class="chart-tab-btn" data-chart-type="pie">Pie</button>
    </div>
    <div id="chart-area" class="chart-placeholder">尚未上傳資料。</div>
  </div>

  <div class="card section-gap">
    <h3>Pivot Table</h3>
    <div id="pivot-table-area" class="table-wrap"></div>
    <div id="pivot-note" class="pivot-note"></div>
  </div>

  <div class="card section-gap">
    <div class="button-row">
      <button type="button" id="btn-copy-table" disabled>複製表格</button>
      <button type="button" id="btn-download-csv" disabled>下載彙總 CSV</button>
      <button type="button" id="btn-export-dashboard" disabled>匯出 Dashboard HTML（含資料）</button>
      <button type="button" id="btn-download-offline">下載本工具離線版（不含資料）</button>
    </div>
  </div>

  <!--{{LICENSES}}-->
</div>

<!--{{SHARED:util-escape}}-->
<!--{{SHARED:ui-toast}}-->
<!--{{SHARED:ui-debounce}}-->
<!--{{SHARED:io-download}}-->
<!--{{SHARED:io-clipboard}}-->
<!--{{SHARED:io-dropzone}}-->
<!--{{ASSET:papaparse}}-->
<!--{{SHARED:csv-parse}}-->
<!--{{SHARED:csv-decode}}-->
<!--{{SHARED:csv-write}}-->

<script>
(function () {
  'use strict';

  var MAX_FILTER_ROWS = 3;
  var MAX_TABLE_ROWS = 500;
  var MAX_CHART_GROUPS = 200;
  var FILTER_OPERATORS = ['包含', '不包含', '等於', '不等於', '大於', '小於', '非空'];

  var state = {
    table: null,
    fileName: '',
    arrayBuffer: null,
    columnTypes: null,
    distinctCounts: null,     // columnIndex -> distinct count（只算 text 欄）
    hasDateSample: {},        // columnIndex -> boolean（cache）
    measureCache: null,       // { columnIndex, values: Float64Array, valid: Uint8Array }
    filterCache: null,        // { signature, passIndex: Int32Array }
    chartType: 'bar'          // 'bar' | 'line' | 'pie'
  };

  // ---------- 小工具 ----------

  function baseName(name) {
    var dot = name.lastIndexOf('.');
    return dot > 0 ? name.slice(0, dot) : name;
  }

  function fmtNumber(v, decimals) {
    if (v === null || typeof v === 'undefined' || Number.isNaN(v)) return '—';
    var d = typeof decimals === 'number' ? decimals : (Number.isInteger(v) ? 0 : 2);
    return new Intl.NumberFormat('zh-TW', { minimumFractionDigits: 0, maximumFractionDigits: d }).format(v);
  }

  function optionEl(value, text) {
    var o = document.createElement('option');
    o.value = value;
    o.textContent = text;
    return o;
  }

  // ---------- 型別推薦（task 1 / C1） ----------

  function computeDistinctCounts(table) {
    var counts = {};
    table.headers.forEach(function (_, colIdx) {
      var set = new Set();
      table.rows.forEach(function (row) {
        set.add(cellAt(row, colIdx));
      });
      counts[colIdx] = set.size;
    });
    return counts;
  }

  function isDimensionRecommended(colIdx) {
    var kind = state.columnTypes[colIdx].kind;
    if (kind === 'date') return true;
    if (kind === 'text') {
      var rowCount = state.table.rows.length;
      var threshold = Math.min(100, rowCount * 0.5);
      return state.distinctCounts[colIdx] <= threshold;
    }
    return false;
  }

  function isMeasureRecommended(colIdx) {
    return state.columnTypes[colIdx].kind === 'number';
  }

  function buildRoleSelect(selectEl, recommendFn, includeNone) {
    selectEl.innerHTML = '';
    if (includeNone) selectEl.appendChild(optionEl('__none__', '（無）'));

    var headers = state.table.headers;
    var indexes = headers.map(function (_, i) { return i; });
    var recommended = indexes.filter(recommendFn);
    var rest = indexes.filter(function (i) { return !recommendFn(i); });

    recommended.concat(rest).forEach(function (i) {
      var label = headers[i] + (recommendFn(i) ? '（建議）' : '');
      selectEl.appendChild(optionEl(String(i), label));
    });
    return recommended;
  }

  function setupRoleSelects() {
    var dim1Recommended = buildRoleSelect(document.getElementById('dim1-select'), isDimensionRecommended, false);
    buildRoleSelect(document.getElementById('dim2-select'), isDimensionRecommended, true);
    var measureRecommended = buildRoleSelect(document.getElementById('measure-select'), isMeasureRecommended, false);

    document.getElementById('dim1-select').value = dim1Recommended.length ? String(dim1Recommended[0]) : '0';
    document.getElementById('dim2-select').value = '__none__';

    var aggSelect = document.getElementById('aggregate-select');
    if (measureRecommended.length) {
      document.getElementById('measure-select').value = String(measureRecommended[0]);
      aggSelect.value = 'SUM';
    } else {
      document.getElementById('measure-select').value = '0';
      aggSelect.value = 'COUNT';
    }

    ['dim1-select', 'dim2-select', 'measure-select', 'aggregate-select', 'date-granularity-select'].forEach(function (id) {
      document.getElementById(id).disabled = false;
    });

    updateDateGranularityAvailability();
    updateAggregateNote();
  }

  function columnHasAnyDate(colIdx) {
    if (Object.prototype.hasOwnProperty.call(state.hasDateSample, colIdx)) {
      return state.hasDateSample[colIdx];
    }
    var found = false;
    for (var i = 0; i < state.table.rows.length; i++) {
      if (dateParts(cellAt(state.table.rows[i], colIdx)) !== null) { found = true; break; }
    }
    state.hasDateSample[colIdx] = found;
    return found;
  }

  function updateDateGranularityAvailability() {
    var dim1Val = document.getElementById('dim1-select').value;
    var granSelect = document.getElementById('date-granularity-select');
    var colIdx = Number(dim1Val);
    var enabled = !Number.isNaN(colIdx) && columnHasAnyDate(colIdx);
    granSelect.disabled = !enabled;
    if (!enabled) granSelect.value = 'none';
  }

  function updateAggregateNote() {
    var noteEl = document.getElementById('aggregate-note');
    noteEl.textContent = document.getElementById('aggregate-select').value === 'COUNT'
      ? 'COUNT 不使用 Measure 欄'
      : '';
  }

  // ---------- Filter UI ----------

  function renderFilterRows() {
    var container = document.getElementById('filter-rows');
    container.innerHTML = '';
    for (var i = 0; i < MAX_FILTER_ROWS; i++) {
      var row = document.createElement('div');
      row.className = 'filter-row';

      var fieldSelect = document.createElement('select');
      fieldSelect.id = 'filter-field-' + i;
      fieldSelect.appendChild(optionEl('__none__', '（未使用）'));
      state.table.headers.forEach(function (h, idx) {
        fieldSelect.appendChild(optionEl(String(idx), h));
      });

      var opSelect = document.createElement('select');
      opSelect.id = 'filter-op-' + i;
      FILTER_OPERATORS.forEach(function (op) {
        opSelect.appendChild(optionEl(op, op));
      });

      var valInput = document.createElement('input');
      valInput.type = 'text';
      valInput.id = 'filter-val-' + i;
      valInput.placeholder = '篩選值';

      row.appendChild(fieldSelect);
      row.appendChild(opSelect);
      row.appendChild(valInput);
      container.appendChild(row);

      fieldSelect.addEventListener('change', recomputeAndRender);
      opSelect.addEventListener('change', recomputeAndRender);
      valInput.addEventListener('input', debounce(recomputeAndRender, 150));
    }
  }

  function readFilterConditions() {
    var conditions = [];
    for (var i = 0; i < MAX_FILTER_ROWS; i++) {
      var fieldVal = document.getElementById('filter-field-' + i).value;
      if (fieldVal === '__none__') continue;
      var op = document.getElementById('filter-op-' + i).value;
      var val = document.getElementById('filter-val-' + i).value;
      if (op !== '非空' && val === '') continue;
      conditions.push({ field: Number(fieldVal), op: op, value: val });
    }
    return conditions;
  }

  function rowPassesFilter(row, conditions) {
    for (var i = 0; i < conditions.length; i++) {
      var c = conditions[i];
      var cell = cellAt(row, c.field);
      var ok;
      switch (c.op) {
        case '包含': ok = cell.indexOf(c.value) !== -1; break;
        case '不包含': ok = cell.indexOf(c.value) === -1; break;
        case '等於': ok = cell === c.value; break;
        case '不等於': ok = cell !== c.value; break;
        case '非空': ok = cell !== ''; break;
        case '大於':
        case '小於': {
          var cv = toNumber(cell);
          var fv = toNumber(c.value);
          if (Number.isNaN(cv) || Number.isNaN(fv)) { ok = false; break; }
          ok = c.op === '大於' ? cv > fv : cv < fv;
          break;
        }
        default: ok = false;
      }
      if (!ok) return false;
    }
    return true;
  }

  function computePassIndex() {
    var conditions = readFilterConditions();
    var signature = JSON.stringify(conditions);
    if (state.filterCache && state.filterCache.signature === signature && state.filterCache.table === state.table) {
      return state.filterCache.passIndex;
    }
    var rows = state.table.rows;
    var pass = [];
    for (var i = 0; i < rows.length; i++) {
      if (rowPassesFilter(rows[i], conditions)) pass.push(i);
    }
    var passIndex = new Int32Array(pass);
    state.filterCache = { signature: signature, table: state.table, passIndex: passIndex };
    return passIndex;
  }

  // ---------- Measure 數值快取（D2 效能防線 1） ----------

  function ensureMeasureCache(measureColIdx) {
    if (state.measureCache && state.measureCache.columnIndex === measureColIdx && state.measureCache.table === state.table) {
      return state.measureCache;
    }
    var rows = state.table.rows;
    var n = rows.length;
    var values = new Float64Array(n);
    var valid = new Uint8Array(n);
    for (var i = 0; i < n; i++) {
      var num = toNumber(cellAt(rows[i], measureColIdx));
      if (Number.isNaN(num)) {
        values[i] = 0;
        valid[i] = 0;
      } else {
        values[i] = num;
        valid[i] = 1;
      }
    }
    state.measureCache = { columnIndex: measureColIdx, table: state.table, values: values, valid: valid };
    return state.measureCache;
  }

  // ---------- 日期分組標籤（C5，僅呼叫 dateParts()） ----------

  function dateGroupLabel(cellValue, granularity) {
    var parts = dateParts(cellValue);
    if (parts === null) return { key: '\0NODATE', label: '(無法辨識日期)' };
    if (granularity === 'year') {
      return { key: 'Y' + parts.y, label: String(parts.y) };
    }
    if (parts.m === null) {
      return { key: '\0ONLYYEAR', label: '(僅有年份)' };
    }
    if (granularity === 'quarter') {
      var q = Math.ceil(parts.m / 3);
      return { key: 'Q' + parts.y + '-' + q, label: parts.y + '-Q' + q };
    }
    var mm = parts.m < 10 ? '0' + parts.m : String(parts.m);
    return { key: 'M' + parts.y + '-' + mm, label: parts.y + '-' + mm };
  }

  function rawDimLabel(cellValue) {
    if (cellValue === '') {
      return { key: '\0EMPTY', label: '(空值)', emptyClass: true };
    }
    return { key: cellValue, label: cellValue, emptyClass: false };
  }

  // ---------- 管線（C6）：Filter -> Group By + Aggregate -> Sort -> Top N / Bottom N ----------

  function readPipelineConfig() {
    var dim1Idx = Number(document.getElementById('dim1-select').value);
    var dim2Raw = document.getElementById('dim2-select').value;
    var dim2Idx = dim2Raw === '__none__' ? null : Number(dim2Raw);
    var granularity = document.getElementById('date-granularity-select').disabled
      ? 'none'
      : document.getElementById('date-granularity-select').value;
    var measureIdx = Number(document.getElementById('measure-select').value);
    var aggregate = document.getElementById('aggregate-select').value;
    var sortField = document.getElementById('sort-field-select').value;
    var sortDir = document.getElementById('sort-dir-select').value;
    var topnMode = document.getElementById('topn-mode-select').value;
    var topnValue = Math.max(1, parseInt(document.getElementById('topn-value-input').value, 10) || 10);

    return {
      dim1Idx: dim1Idx, dim2Idx: dim2Idx, granularity: granularity,
      measureIdx: measureIdx, aggregate: aggregate,
      sortField: sortField, sortDir: sortDir,
      topnMode: topnMode, topnValue: topnValue
    };
  }

  // 單趟分組（D2 效能防線 3）：一次掃描 passIndex，sum/count/min/max/nonNumeric 一起累加
  function groupAndAggregate(passIndex, cfg) {
    var table = state.table;
    var measureCache = ensureMeasureCache(cfg.measureIdx);
    var useDate = cfg.granularity !== 'none';
    var groups = new Map();

    for (var k = 0; k < passIndex.length; k++) {
      var rowIdx = passIndex[k];
      var row = table.rows[rowIdx];

      var d1raw = cellAt(row, cfg.dim1Idx);
      var d1 = useDate ? dateGroupLabel(d1raw, cfg.granularity) : rawDimLabel(d1raw);

      var d2 = null;
      if (cfg.dim2Idx !== null) {
        d2 = rawDimLabel(cellAt(row, cfg.dim2Idx));
      }

      var groupKey = d2 ? (d1.key + '\0' + d2.key) : d1.key;

      var acc = groups.get(groupKey);
      if (!acc) {
        acc = {
          dim1Label: d1.label, dim1Empty: !!d1.emptyClass,
          dim2Label: d2 ? d2.label : null, dim2Empty: d2 ? !!d2.emptyClass : false,
          sum: 0, count: 0, nonNumeric: 0,
          min: Infinity, max: -Infinity, validCount: 0
        };
        groups.set(groupKey, acc);
      }

      acc.count += 1;
      var isValid = measureCache.valid[rowIdx] === 1;
      if (isValid) {
        var v = measureCache.values[rowIdx];
        acc.sum += v;
        acc.validCount += 1;
        if (v < acc.min) acc.min = v;
        if (v > acc.max) acc.max = v;
      } else {
        acc.nonNumeric += 1;
      }
    }

    return groups;
  }

  function aggregateValueOf(acc, aggregate) {
    switch (aggregate) {
      case 'COUNT': return acc.count;
      case 'SUM': return acc.validCount === 0 ? null : acc.sum;
      case 'AVG': return acc.validCount === 0 ? null : acc.sum / acc.validCount;
      case 'MIN': return acc.validCount === 0 ? null : acc.min;
      case 'MAX': return acc.validCount === 0 ? null : acc.max;
      default: return null;
    }
  }

  function groupCombinedLabel(g) {
    return g.dim2Label !== null ? (g.dim1Label + '\0' + g.dim2Label) : g.dim1Label;
  }

  function sortGroups(list, cfg) {
    var field = cfg.sortField;
    var dir = cfg.sortDir;

    function sortValue(g) {
      if (field === 'count') return g.count;
      return g.aggValue; // measure
    }

    list.sort(function (a, b) {
      var av = sortValue(a);
      var bv = sortValue(b);
      var aNull = av === null || typeof av === 'undefined';
      var bNull = bv === null || typeof bv === 'undefined';
      var cmp;
      if (aNull && bNull) {
        cmp = 0;
      } else if (aNull) {
        return 1;
      } else if (bNull) {
        return -1;
      } else {
        cmp = av - bv;
        if (dir === 'desc') cmp = -cmp;
      }
      if (cmp !== 0) return cmp;
      return groupCombinedLabel(a).localeCompare(groupCombinedLabel(b), 'zh-Hant');
    });
    return list;
  }

  function applyTopN(list, cfg) {
    if (cfg.topnMode === 'top') return list.slice(0, cfg.topnValue);
    if (cfg.topnMode === 'bottom') {
      var n = Math.min(cfg.topnValue, list.length);
      return list.slice(list.length - n);
    }
    return list;
  }

  function computeGrandKpi(groupList, passIndexLength) {
    var totalSum = 0, totalCount = 0, totalNonNumeric = 0, totalValid = 0;
    var totalMin = Infinity, totalMax = -Infinity;
    groupList.forEach(function (g) {
      totalCount += g.count;
      totalNonNumeric += g.nonNumeric;
      totalValid += g.validCount;
      totalSum += g.sum;
      if (g.validCount > 0) {
        if (g.min < totalMin) totalMin = g.min;
        if (g.max > totalMax) totalMax = g.max;
      }
    });
    return {
      groupCount: groupList.length,
      rowCount: passIndexLength,
      totalSum: totalSum, totalCount: totalCount,
      totalNonNumeric: totalNonNumeric, totalValid: totalValid,
      totalMin: totalMin, totalMax: totalMax
    };
  }

  function grandAggregateValue(kpi, aggregate) {
    switch (aggregate) {
      case 'COUNT': return kpi.totalCount;
      case 'SUM': return kpi.totalValid === 0 ? null : kpi.totalSum;
      case 'AVG': return kpi.totalValid === 0 ? null : kpi.totalSum / kpi.totalValid;
      case 'MIN': return kpi.totalValid === 0 ? null : kpi.totalMin;
      case 'MAX': return kpi.totalValid === 0 ? null : kpi.totalMax;
      default: return null;
    }
  }

  // ---------- 渲染 ----------

  function aggregateLabel(cfg) {
    var measureHeader = state.table.headers[cfg.measureIdx];
    return measureHeader + ' ' + cfg.aggregate;
  }

  function renderKpi(kpi, cfg) {
    var grand = grandAggregateValue(kpi, cfg.aggregate);
    var cards = [
      { label: '總計（' + cfg.aggregate + '）', value: fmtNumber(grand) },
      { label: '群組數', value: fmtNumber(kpi.groupCount) },
      { label: '資料列數', value: fmtNumber(kpi.rowCount) },
      { label: '無法計算', value: kpi.totalNonNumeric + ' 筆（已排除）' }
    ];
    var html = cards.map(function (c) {
      return '<div class="kpi-card"><div class="kpi-label">' + escapeHtml(c.label) + '</div>' +
        '<div class="kpi-value">' + escapeHtml(String(c.value)) + '</div></div>';
    }).join('');
    document.getElementById('kpi-area').innerHTML = html;
  }

  function groupLabelFor(g, cfg) {
    return cfg.dim2Idx !== null ? (g.dim1Label + ' / ' + g.dim2Label) : g.dim1Label;
  }

  function renderChart(groupCount, displayList, cfg) {
    var el = document.getElementById('chart-area');
    if (groupCount === 0) {
      el.innerHTML = '<div class="chart-empty">沒有可繪製的資料。可能是 Filter 條件把所有列都排除了。</div>';
      return;
    }
    if (groupCount > MAX_CHART_GROUPS) {
      el.innerHTML = '<div class="chart-empty">群組數 ' + groupCount + ' 組，超過 ' + MAX_CHART_GROUPS +
        '，圖表不繪製。請加 Filter 或改用 Top N。</div>';
      return;
    }

    var series = displayList
      .filter(function (g) { return typeof g.aggValue === 'number' && Number.isFinite(g.aggValue); })
      .map(function (g) { return { label: groupLabelFor(g, cfg), value: g.aggValue }; });

    var renderFn = state.chartType === 'line' ? renderLineChart
      : state.chartType === 'pie' ? renderPieChart
      : renderBarChart;

    el.innerHTML = renderFn(series, {});
  }

  function renderPivotTable(displayList, cfg) {
    var dim1Header = state.table.headers[cfg.dim1Idx];
    var dim2Header = cfg.dim2Idx !== null ? state.table.headers[cfg.dim2Idx] : null;

    var headCells = ['<th class="dim-col">' + escapeHtml(dim1Header) + '</th>'];
    if (dim2Header !== null) headCells.push('<th class="dim-col">' + escapeHtml(dim2Header) + '</th>');
    headCells.push('<th>' + escapeHtml(aggregateLabel(cfg)) + '</th>');
    headCells.push('<th>筆數</th>');
    headCells.push('<th>無法計算</th>');

    var shown = displayList.slice(0, MAX_TABLE_ROWS);
    var bodyParts = [];
    for (var i = 0; i < shown.length; i++) {
      var g = shown[i];
      bodyParts.push('<tr>');
      bodyParts.push('<td class="dim-col' + (g.dim1Empty ? ' is-empty-key' : '') + '">' + escapeHtml(g.dim1Label) + '</td>');
      if (dim2Header !== null) {
        bodyParts.push('<td class="dim-col' + (g.dim2Empty ? ' is-empty-key' : '') + '">' + escapeHtml(g.dim2Label) + '</td>');
      }
      bodyParts.push('<td>' + escapeHtml(fmtNumber(g.aggValue)) + '</td>');
      bodyParts.push('<td>' + g.count + '</td>');
      bodyParts.push('<td class="' + (g.nonNumeric > 0 ? 'has-nonnumeric' : '') + '">' + g.nonNumeric + '</td>');
      bodyParts.push('</tr>');
    }

    var html = '<table class="pivot"><thead><tr>' + headCells.join('') + '</tr></thead><tbody>' +
      bodyParts.join('') + '</tbody></table>';
    document.getElementById('pivot-table-area').innerHTML = html;

    var noteEl = document.getElementById('pivot-note');
    noteEl.textContent = displayList.length > MAX_TABLE_ROWS
      ? ('共 ' + displayList.length + ' 組，僅顯示前 ' + MAX_TABLE_ROWS + ' 列，完整結果請下載彙總 CSV')
      : ('共 ' + displayList.length + ' 組');
  }

  // ---------- 主重算流程 ----------

  var lastResult = null; // { displayList, cfg } 供複製/下載使用

  function recomputeAndRender() {
    if (!state.table) return;

    var cfg = readPipelineConfig();

    // 1. Filter
    var passIndex = computePassIndex();

    // 2. Group By + Aggregate
    var groupsMap = groupAndAggregate(passIndex, cfg);
    var groupList = [];
    groupsMap.forEach(function (acc) {
      acc.aggValue = aggregateValueOf(acc, cfg.aggregate);
      groupList.push(acc);
    });

    var kpi = computeGrandKpi(groupList, passIndex.length);
    renderKpi(kpi, cfg);

    // 3. Sort
    var sorted = sortGroups(groupList.slice(), cfg);

    // 4. Top N / Bottom N
    var displayList = applyTopN(sorted, cfg);

    // 5. 渲染
    renderPivotTable(displayList, cfg);
    renderChart(groupList.length, displayList, cfg);

    lastResult = { displayList: displayList, cfg: cfg };
    document.getElementById('btn-copy-table').disabled = false;
    document.getElementById('btn-download-csv').disabled = false;
    document.getElementById('btn-export-dashboard').disabled = false;
  }

  // ---------- 檔案讀取 ----------

  function updateFileMeta(decoded) {
    var t = state.table;
    var confidenceText = decoded.confidence === 'bom' ? 'BOM 明示'
      : decoded.confidence === 'strict' ? '嚴格解碼'
      : decoded.confidence === 'manual' ? '使用者手動選擇（' + decoded.encoding.toUpperCase() + '）'
      : '猜測（fallback）';
    document.getElementById('file-meta').textContent =
      state.fileName + '／' + t.meta.encoding + (t.meta.hadBom ? '（BOM）' : '') +
      '／偵測：' + confidenceText + '／分隔符：' + (t.meta.delimiter === '\t' ? 'Tab' : t.meta.delimiter) +
      '／' + t.rows.length + ' 列／' + t.headers.length + ' 欄';
  }

  // 編碼偵測為 fallback（猜的）或使用者手動切換後，都顯示切換橫幅，
  // 讓使用者可在 UTF-8／Big5 間來回切換以救回猜錯的情形（CSV_CONTRACT.md 第 7.2 節）。
  function renderEncodingFallback(decoded) {
    var el = document.getElementById('encoding-fallback');
    if (decoded.confidence !== 'fallback' && decoded.confidence !== 'manual') {
      el.classList.add('hidden');
      el.innerHTML = '';
      return;
    }
    var label = decoded.confidence === 'fallback'
      ? '偵測為 Big5，若顯示為亂碼請手動切換編碼：'
      : '已手動切換為 ' + decoded.encoding.toUpperCase() + '，如仍為亂碼可再切換：';
    el.classList.remove('hidden');
    el.innerHTML = escapeHtml(label) +
      '<select id="encoding-select" style="width:auto; display:inline-block; margin-left:8px;">' +
      '<option value="big5">Big5</option><option value="utf-8">UTF-8</option></select>';
    el.querySelector('#encoding-select').value = decoded.encoding === 'big5' ? 'big5' : 'utf-8';
    el.querySelector('#encoding-select').addEventListener('change', function (e) {
      loadTableFromArrayBuffer(state.arrayBuffer, state.fileName, e.target.value);
    });
  }

  function loadTableFromArrayBuffer(arrayBuffer, fileName, forcedEncoding) {
    state.arrayBuffer = arrayBuffer;
    state.fileName = fileName;

    var decoded;
    if (forcedEncoding) {
      var text = new TextDecoder(forcedEncoding).decode(arrayBuffer);
      decoded = { text: text, encoding: forcedEncoding, hadBom: false, confidence: 'manual' };
    } else {
      decoded = decodeCsvBytes(arrayBuffer);
    }

    var table = parseCsv(decoded.text, { encoding: decoded.encoding, hadBom: decoded.hadBom });
    state.table = table;
    state.columnTypes = inferColumnTypes(table);
    state.distinctCounts = computeDistinctCounts(table);
    state.hasDateSample = {};
    state.measureCache = null;
    state.filterCache = null;

    updateFileMeta(decoded);
    renderEncodingFallback(decoded);
    setupRoleSelects();
    renderFilterRows();
    recomputeAndRender();
  }

  function onData(arrayBuffer, fileName) {
    loadTableFromArrayBuffer(arrayBuffer, fileName, null);
  }

  function onError(message) {
    document.getElementById('size-msg').innerHTML = '<div class="msg error">' + escapeHtml(message) + '</div>';
  }

  function onGate(file) {
    var result = checkCsvFileSize(file.size);
    if (result.level === 'warn') {
      document.getElementById('size-msg').innerHTML = '<div class="msg warn">' + escapeHtml(result.message) + '</div>';
    } else if (result.level === 'ok') {
      document.getElementById('size-msg').innerHTML = '';
    }
    return result;
  }

  var dropOpts = { mode: 'bytes', accept: ['.csv'], gate: onGate, onError: onError };

  var dropzoneEl = document.getElementById('dropzone');
  var fileInputEl = document.getElementById('file-input');
  setupDropZone(dropzoneEl, onData, dropOpts);
  setupFilePicker(fileInputEl, onData, dropOpts);

  document.getElementById('btn-pick-file').addEventListener('click', function () {
    fileInputEl.click();
  });

  // 下拉 change 直接重算，不接 debounce
  ['dim1-select', 'dim2-select', 'date-granularity-select', 'measure-select', 'aggregate-select',
    'sort-field-select', 'sort-dir-select', 'topn-mode-select'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () {
      if (id === 'dim1-select') updateDateGranularityAvailability();
      if (id === 'aggregate-select') updateAggregateNote();
      recomputeAndRender();
    });
  });

  document.getElementById('topn-value-input').addEventListener('input', debounce(recomputeAndRender, 150));

  // ---------- 圖表分頁切換 ----------

  document.querySelectorAll('.chart-tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.chart-tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      state.chartType = btn.getAttribute('data-chart-type');
      recomputeAndRender();
    });
  });

  // ---------- 複製表格 / 下載彙總 CSV ----------

  function buildResultTable() {
    if (!lastResult) return null;
    var cfg = lastResult.cfg;
    var dim2Header = cfg.dim2Idx !== null ? state.table.headers[cfg.dim2Idx] : null;
    var headers = [state.table.headers[cfg.dim1Idx]];
    if (dim2Header !== null) headers.push(dim2Header);
    headers.push(aggregateLabel(cfg));
    headers.push('筆數');
    headers.push('無法計算');

    var rows = lastResult.displayList.map(function (g, idx) {
      var cells = [g.dim1Label];
      if (dim2Header !== null) cells.push(g.dim2Label);
      cells.push(g.aggValue === null ? '—' : String(g.aggValue));
      cells.push(String(g.count));
      cells.push(String(g.nonNumeric));
      return { line: idx + 2, cells: cells };
    });

    return { headers: headers, rows: rows, meta: { headerCount: headers.length } };
  }

  document.getElementById('btn-copy-table').addEventListener('click', function () {
    var t = buildResultTable();
    if (!t) { showToast('尚無資料'); return; }
    var lines = [t.headers.map(function (c) { return csvCell(c, '\t'); }).join('\t')];
    t.rows.forEach(function (r) {
      lines.push(r.cells.map(function (c) { return csvCell(c, '\t'); }).join('\t'));
    });
    copyToClipboard(lines.join('\n')).then(function (ok) {
      showToast(ok ? '已複製表格' : '複製失敗');
    });
  });

  document.getElementById('btn-download-csv').addEventListener('click', function () {
    var t = buildResultTable();
    if (!t) { showToast('尚無資料'); return; }
    var csv = toCsv(t, { bom: true });
    var name = (state.fileName ? baseName(state.fileName) : 'csv-pivot-dashboard') + '_summary.csv';
    downloadFile(name, csv, 'text/csv;charset=utf-8');
    showToast('已下載彙總 CSV');
  });

  // ---------- task 9：匯出 Dashboard HTML（A1 靜態快照，零 <script>，不夾帶原始資料集） ----------

  var DASHBOARD_CSS =
    ':root{--color-bg:#f7f7f8;--color-surface:#fff;--color-border:#d9d9de;--color-text:#1f2328;' +
    '--color-text-muted:#6b7280;--radius:8px;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",' +

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  // 只用「畫面上已經算好、已經 escapeHtml 過」的 innerHTML 組出靜態頁面，不碰原始 Table，零 <script>

  // ---------- task 10：buildCleanHtmlCopy()（CONTRACT.md 第 6 節硬性要求，不含任何使用者資料） ----------

  function buildCleanHtmlCopy() {
    var clone = document.documentElement.cloneNode(true);

    // 檔案輸入與檔名顯示
    var fileInputClone = clone.querySelector('#file-input');
    if (fileInputClone) { fileInputClone.value = ''; fileInputClone.removeAttribute('value'); }
    var sizeMsgClone = clone.querySelector('#size-msg');
    if (sizeMsgClone) sizeMsgClone.innerHTML = '';

    // 檔案資訊列
    var fileMetaClone = clone.querySelector('#file-meta');
    if (fileMetaClone) fileMetaClone.textContent = '';
    var encFallbackClone = clone.querySelector('#encoding-fallback');
    if (encFallbackClone) { encFallbackClone.innerHTML = ''; encFallbackClone.classList.add('hidden'); }

    // KPI 區
    var kpiClone = clone.querySelector('#kpi-area');
    if (kpiClone) kpiClone.innerHTML = '';

    // Pivot Table 的 tbody（連同 thead 一起清，thead 欄名也是使用者資料）
    var tableAreaClone = clone.querySelector('#pivot-table-area');
    if (tableAreaClone) tableAreaClone.innerHTML = '';
    var pivotNoteClone = clone.querySelector('#pivot-note');
    if (pivotNoteClone) pivotNoteClone.textContent = '';

    // 圖表容器 innerHTML
    var chartAreaClone = clone.querySelector('#chart-area');
    if (chartAreaClone) {
      chartAreaClone.innerHTML = '尚未上傳資料。';
      chartAreaClone.className = 'chart-placeholder';
    }

    // Filter 三列的 value 屬性與 DOM 值，以及 Filter 欄位下拉裡從 headers 動態產生的 <option>
    for (var i = 0; i < MAX_FILTER_ROWS; i++) {
      var valEl = clone.querySelector('#filter-val-' + i);
      if (valEl) { valEl.value = ''; valEl.removeAttribute('value'); }
      var fieldEl = clone.querySelector('#filter-field-' + i);
      if (fieldEl) fieldEl.innerHTML = '<option value="__none__">（未使用）</option>';
      var opEl = clone.querySelector('#filter-op-' + i);
      if (opEl) opEl.value = FILTER_OPERATORS[0];
    }

    // Top N 數字
    var topnClone = clone.querySelector('#topn-value-input');
    if (topnClone) { topnClone.value = '10'; topnClone.setAttribute('value', '10'); }
    var topnModeClone = clone.querySelector('#topn-mode-select');
    if (topnModeClone) topnModeClone.value = 'all';

    // Dimension／Measure 下拉裡從 CSV headers 動態產生的所有 <option>（欄名本身就是使用者資料）
    var dim1Clone = clone.querySelector('#dim1-select');
    if (dim1Clone) { dim1Clone.innerHTML = ''; dim1Clone.disabled = true; }
    var dim2Clone = clone.querySelector('#dim2-select');
    if (dim2Clone) { dim2Clone.innerHTML = '<option value="__none__">（無）</option>'; dim2Clone.disabled = true; }
    var measureClone = clone.querySelector('#measure-select');
    if (measureClone) { measureClone.innerHTML = ''; measureClone.disabled = true; }
    var granClone = clone.querySelector('#date-granularity-select');
    if (granClone) { granClone.disabled = true; granClone.value = 'none'; }
    var aggClone = clone.querySelector('#aggregate-select');
    if (aggClone) { aggClone.disabled = true; aggClone.value = 'SUM'; }
    var aggNoteClone = clone.querySelector('#aggregate-note');
    if (aggNoteClone) aggNoteClone.textContent = '';
    // Sort 下拉（sort-field-select）本實作只有固定的「Measure 彙總值」／「筆數」兩個選項，
    // 不是從 CSV headers 動態產生的，這裡不需要也不應該清空（清空會破壞離線版可用性）

    // 下載／複製按鈕還原為停用（要重新上傳資料才能用）
    ['btn-copy-table', 'btn-download-csv', 'btn-export-dashboard'].forEach(function (id) {
      var b = clone.querySelector('#' + id);
      if (b) b.setAttribute('disabled', 'disabled');
    });

    // showToast() 注入的 #__shared_toast（可能含使用者內容）
    var toastClone = clone.querySelector('#__shared_toast');
    if (toastClone && toastClone.parentNode) toastClone.parentNode.removeChild(toastClone);

    // .nav-back 與所有指向本站的外連
    Array.prototype.forEach.call(clone.querySelectorAll('.nav-back'), function (a) {
      if (a.parentNode) a.parentNode.removeChild(a);
    });

    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  document.getElementById('btn-download-offline').addEventListener('click', function () {
    var html = buildCleanHtmlCopy();
    downloadFile('csv-pivot-dashboard-offline.html', html, 'text/html;charset=utf-8');
    showToast('已下載本工具離線版');
  });

  // ---------- 效能量測輔助（僅供開發驗收使用，不影響一般操作） ----------
  window.__pivotPerfHook = function (changeFn) {
    var start = performance.now();
    changeFn();
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          resolve(performance.now() - start);
        });
      });
    });
  };
})();
</script>
</body>
</html>
