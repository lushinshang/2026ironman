function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// shared/ui-toast.js
function showToast(msg, ms) {
  if (ms === undefined) ms = 2000;
  var el = document.getElementById('__shared_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '__shared_toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  if (el.__hideTimer) {
    clearTimeout(el.__hideTimer);
  }
  el.__hideTimer = setTimeout(function () {
    el.classList.remove('show');
  }, ms);
}

</script>

// shared/ui-debounce.js
function debounce(fn, ms) {
  if (ms === undefined) ms = 150;
  var timer = null;
  return function () {
    var args = arguments;
    var ctx = this;
    if (timer) {
      clearTimeout(timer);
    }
    timer = setTimeout(function () {
      fn.apply(ctx, args);
    }, ms);
  };
}

</script>

// shared/io-download.js
function downloadFile(filename, content, mime) {
  if (mime === undefined) mime = 'text/plain;charset=utf-8';
  var blob = new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () {
    URL.revokeObjectURL(url);
  }, 0);
}

</script>

// shared/io-clipboard.js
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () {
      return true;
    }).catch(function () {
      return false;
    });
  }
  return new Promise(function (resolve) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    var ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(textarea);
    resolve(ok);
  });
}

function pasteImageFromClipboard() {
  if (!navigator.clipboard || !navigator.clipboard.read) {
    return Promise.resolve(null);
  }
  return navigator.clipboard.read().then(function (items) {
    if (!items || items.length === 0) return null;
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      if (item && item.types) {
        for (var t = 0; t < item.types.length; t++) {
          if (item.types[t].indexOf('image/') === 0) {
            return item.getType(item.types[t]);
          }
        }
      }
    }
    return null;
  }).catch(function () {
    return null;
  });
}

// shared/io-dropzone.js
function ioDropzoneHandleFile(file, onData, opts) {
  opts = opts || {};
  // 預設只收 .txt / .md（契約第 3 節）。不要改成 [] ——那會變成靜默全收。
  var accept = opts.accept || ['.txt', '.md'];
  var onError = opts.onError || function () {};

  function isAccepted(fileName) {
    if (accept.length === 0) return true;
    var lower = fileName.toLowerCase();
    for (var i = 0; i < accept.length; i++) {
      if (lower.indexOf(accept[i].toLowerCase(), lower.length - accept[i].length) !== -1) {
        return true;
      }
    }
    return false;
  }

  if (!isAccepted(file.name)) {
    onError('不支援的檔案類型：' + file.name);
    return;
  }

  if (opts.gate) {
    var gateResult = opts.gate(file);
    if (!gateResult.ok) {
      onError(gateResult.message);
      return;
    }
  }

  var reader = new FileReader();
  reader.onload = function () {
    onData(reader.result, file.name);
  };
  reader.onerror = function () {
    onError('讀取檔案失敗：' + file.name);
  };
  if (opts.mode === 'bytes') {
    reader.readAsArrayBuffer(file);
  } else {
    reader.readAsText(file);
  }
}

function setupDropZone(dropEl, onData, opts) {
  opts = opts || {};

  dropEl.addEventListener('dragover', function (e) {
    e.preventDefault();
    dropEl.classList.add('dragover');
  });

  dropEl.addEventListener('dragleave', function () {
    dropEl.classList.remove('dragover');
  });

  dropEl.addEventListener('drop', function (e) {
    e.preventDefault();
    dropEl.classList.remove('dragover');
    var files = e.dataTransfer.files;
    if (!files || files.length === 0) return;

    if (opts.multiple === true) {
      if (opts.gateBatch) {
        var batchResult = opts.gateBatch(files);
        if (!batchResult.ok) {
          (opts.onError || function () {})(batchResult.message);
          return;
        }
      }
      var total = files.length;
      for (var i = 0; i < total; i++) {
        (function (idx) {
          var meta = { index: idx, total: total };
          var wrappedOnData = function (result, fileName) {
            onData(result, fileName, meta);
          };
          ioDropzoneHandleFile(files[idx], wrappedOnData, opts);
        })(i);
      }
    } else {
      ioDropzoneHandleFile(files[0], onData, opts);
    }
  });
}

function setupFilePicker(inputEl, onData, opts) {
  opts = opts || {};

  inputEl.addEventListener('change', function () {
    var files = inputEl.files;
    if (!files || files.length === 0) return;

    if (opts.multiple === true) {
      if (opts.gateBatch) {
        var batchResult = opts.gateBatch(files);
        if (!batchResult.ok) {
          (opts.onError || function () {})(batchResult.message);
          return;
        }
      }
      var total = files.length;
      for (var i = 0; i < total; i++) {
        (function (idx) {
          var meta = { index: idx, total: total };
          var wrappedOnData = function (result, fileName) {
            onData(result, fileName, meta);
          };
          ioDropzoneHandleFile(files[idx], wrappedOnData, opts);
        })(i);
      }
    } else {
      ioDropzoneHandleFile(files[0], onData, opts);
    }
  });
}

// shared/img-file-size.js

function checkImageFileSize(byteLength) {
  var bytes = Number(byteLength) || 0;
  var MB = 1024 * 1024;

  if (bytes <= 30 * MB) {
    return {
      ok: true,
      level: 'ok',
      message: '檔案大小正常'
    };
  } else if (bytes <= 80 * MB) {
    return {
      ok: true,
      level: 'warn',
      message: '檔案較大（' + (bytes / MB).toFixed(1) + 'MB），處理可能需要數秒'
    };
  } else {
    return {
      ok: false,
      level: 'reject',
      message: '檔案超過 80MB 上限（' + (bytes / MB).toFixed(1) + 'MB），已拒絕載入'
    };
  }
}

function checkBatchSize(totalByteLength, fileCount) {
  var bytes = Number(totalByteLength) || 0;
  var count = Number(fileCount) || 0;
  var MB = 1024 * 1024;

  if (bytes <= 200 * MB) {
    return {
      ok: true,
      level: 'ok',
      message: '批次大小正常（共 ' + count + ' 檔，' + (bytes / MB).toFixed(1) + 'MB）'
    };
  } else if (bytes <= 500 * MB) {
    return {
      ok: true,
      level: 'warn',
      message: '批次較大（共 ' + count + ' 檔，' + (bytes / MB).toFixed(1) + 'MB），批次處理可能需要較長時間'
    };
  } else {
    return {
      ok: false,
      level: 'reject',
      message: '批次總量超過 500MB 上限（' + (bytes / MB).toFixed(1) + 'MB），已拒絕整批載入'
    };
  }
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    checkImageFileSize: checkImageFileSize,
    checkBatchSize: checkBatchSize
  };
}

            ctx.drawImage(source, 0, 0);
            break;
          case 3: // 180 rotate
            ctx.translate(rotatedW, rotatedH);
            ctx.rotate(Math.PI);
            ctx.drawImage(source, 0, 0);
            break;
          case 4: // Vertical flip
            ctx.translate(0, rotatedH);
            ctx.scale(1, -1);
            ctx.drawImage(source, 0, 0);
            break;
          case 5: // Transpose
            ctx.rotate(0.5 * Math.PI);
            ctx.scale(1, -1);
            ctx.drawImage(source, 0, 0);
            break;
          case 6: // 90 CW rotate
            ctx.translate(rotatedW, 0);
            ctx.rotate(0.5 * Math.PI);
            ctx.drawImage(source, 0, 0);
            break;
          case 7: // Transverse
            ctx.translate(rotatedW, rotatedH);
            ctx.rotate(0.5 * Math.PI);
            ctx.scale(1, -1);
            ctx.drawImage(source, 0, 0);
            break;
          case 8: // 270 CW (90 CCW) rotate
            ctx.translate(0, rotatedH);
            ctx.rotate(-0.5 * Math.PI);
            ctx.drawImage(source, 0, 0);
            break;
          default: // 1 or others (Normal)
            ctx.drawImage(source, 0, 0);
            break;
        }

        ctx.restore();

        if (cleanup) {
          cleanup();
        }

        resolve({
          canvas: canvas,
          width: targetW,
          height: targetH,
          mimeType: mimeType,
          orientationApplied: orientation

      // orientation when decoding JPEG into an <img> (CSS image-orientation

      // painted pixels are ALREADY orientation-corrected. Passing the real

      function loadViaImgElement() {

            // (auto-rotates anyway) - decoding via createImageBitmap here
            // would double-apply orientation just like the old <img> bug.
            // Fall back to the <img> path, which is known-correct for
            // browser-auto-rotated sources (ctxOrientation forced to 1).
            loadViaImgElement();
            return;
          }
          createImageBitmap(blob, { imageOrientation: 'none' }).then(function (bitmap) {
            drawSource(bitmap, orientation, function () {

              }
            });

            // Failed to decode this specific file - fall back to <img>.
            loadViaImgElement();
          });

          loadViaImgElement();
        });

        loadViaImgElement();
      }
    };

    reader.readAsArrayBuffer(file);
  });

    loadImageFile: loadImageFile

// shared/img-canvas.js

function resizeCanvas(sourceCanvas, opts) {
  opts = opts || {};
  if (!sourceCanvas) {
    throw new Error('sourceCanvas is required');
  }

  var srcW = sourceCanvas.width;
  var srcH = sourceCanvas.height;
  var maxLongEdge = opts.maxLongEdge;
  var allowUpscale = opts.allowUpscale === true;

  var targetW = srcW;
  var targetH = srcH;

  if (maxLongEdge && maxLongEdge > 0) {
    var longEdge = Math.max(srcW, srcH);
    if (longEdge > maxLongEdge || (longEdge < maxLongEdge && allowUpscale)) {
      var scale = maxLongEdge / longEdge;
      targetW = Math.max(1, Math.round(srcW * scale));
      targetH = Math.max(1, Math.round(srcH * scale));
    }
  }

  var outCanvas = document.createElement('canvas');
  outCanvas.width = targetW;
  outCanvas.height = targetH;
  var ctx = outCanvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(sourceCanvas, 0, 0, targetW, targetH);

  return outCanvas;
}

function canvasToBlob(canvas, mimeType, quality) {
  mimeType = mimeType || 'image/jpeg';
  if (quality === undefined) {
    quality = 0.92;
  }

  return new Promise(function (resolve, reject) {
    if (!canvas || typeof canvas.toBlob !== 'function') {
      return reject(new Error('Invalid canvas'));
    }
    canvas.toBlob(function (blob) {
      if (!blob) {
        return reject(new Error('canvas.toBlob returned null'));
      }
      resolve(blob);
    }, mimeType, quality);
  });
}

function compressToTargetSize(canvas, opts) {
  opts = opts || {};
  var targetBytes = opts.targetBytes;
  var mimeType = opts.mimeType || 'image/jpeg';
  var maxIterations = opts.maxIterations || 8;

  if (!canvas) {
    return Promise.reject(new Error('Canvas is required'));
  }
  if (!targetBytes || targetBytes <= 0) {
    return Promise.reject(new Error('targetBytes must be positive'));
  }
  if (mimeType === 'image/png') {
    return Promise.reject(new Error('PNG 不支援目標容量壓縮'));
  }

  return new Promise(function (resolve, reject) {
    var currentCanvas = canvas;
    var dimensionRounds = 0;
    var maxDimensionRounds = 3;
    var totalIterations = 0;
    var bestBlob = null;
    var bestQuality = 0.5;

    function runRound() {
      var low = 0.1;
      var high = 0.95;
      var roundBestBlob = null;
      var roundBestQuality = low;
      var roundIter = 0;

      function binaryStep() {
        if (roundIter >= maxIterations || (high - low) < 0.02) {
          if (roundBestBlob && roundBestBlob.size <= targetBytes) {
            return resolve({
              blob: roundBestBlob,
              quality: roundBestQuality,
              achieved: true,
              iterations: totalIterations
            });
          }

          // If not achieved in this round, check if we can reduce dimensions
          if (dimensionRounds < maxDimensionRounds) {
            dimensionRounds++;
            var curLongEdge = Math.max(currentCanvas.width, currentCanvas.height);
            var newLongEdge = Math.max(32, Math.round(curLongEdge * 0.7));
            currentCanvas = resizeCanvas(currentCanvas, { maxLongEdge: newLongEdge, allowUpscale: false });
            return runRound();
          } else {
            // Failed after all rounds, return closest blob
            return resolve({
              blob: bestBlob || roundBestBlob,
              quality: bestQuality || roundBestQuality,
              achieved: false,
              iterations: totalIterations
            });
          }
        }

        var mid = (low + high) / 2;
        roundIter++;
        totalIterations++;

        canvasToBlob(currentCanvas, mimeType, mid).then(function (blob) {
          if (!bestBlob || Math.abs(blob.size - targetBytes) < Math.abs(bestBlob.size - targetBytes) || blob.size <= targetBytes) {
            bestBlob = blob;
            bestQuality = mid;
          }

          if (blob.size <= targetBytes) {
            roundBestBlob = blob;
            roundBestQuality = mid;
            // Can try higher quality
            low = mid;
          } else {
            // Oversized, need lower quality
            high = mid;
          }
          binaryStep();
        }).catch(reject);
      }

      binaryStep();
    }

    runRound();
  });
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    resizeCanvas: resizeCanvas,
    canvasToBlob: canvasToBlob,
    compressToTargetSize: compressToTargetSize
  };
}

  <script>
  (function () {
    var state = {
      photos: [], // Array<{ id, dataUrl, fileName, caption }>
      title: '工作成果照片附件',
      date: '',
      location: '',
      pageSize: 4
    };

    var dropZone = document.getElementById('drop-zone');
    var fileInput = document.getElementById('file-input');
    var btnSelectFiles = document.getElementById('btn-select-files');
    var docTitle = document.getElementById('doc-title');
    var docDate = document.getElementById('doc-date');
    var docLocation = document.getElementById('doc-location');
    var cfgPageSize = document.getElementById('cfg-page-size');

    var photoListSection = document.getElementById('photo-list-section');
    var photoCount = document.getElementById('photo-count');
    var photosContainer = document.getElementById('photos-container');
    var a4PreviewSection = document.getElementById('a4-preview-section');
    var pageCount = document.getElementById('page-count');
    var a4PagesContainer = document.getElementById('a4-pages-container');

    var btnPrint = document.getElementById('btn-print');
    var btnExportHtml = document.getElementById('btn-export-html');
    var btnCopySummary = document.getElementById('btn-copy-summary');
    var btnClear = document.getElementById('btn-clear');
    var btnDownloadOffline = document.getElementById('btn-download-offline');

    // Default today date
    var today = new Date();
    var dateStr = today.getFullYear() + ' 年 ' + (today.getMonth() + 1) + ' 月 ' + today.getDate() + ' 日';
    if (docDate) docDate.value = dateStr;
    state.date = dateStr;

    function renderPhotoList() {
      if (photoCount) photoCount.textContent = state.photos.length;
      if (!photosContainer) return;

      if (state.photos.length === 0) {
        if (photoListSection) photoListSection.style.display = 'none';
        if (a4PreviewSection) a4PreviewSection.style.display = 'none';
        photosContainer.innerHTML = '';
        if (a4PagesContainer) a4PagesContainer.innerHTML = '';
        return;
      }

      if (photoListSection) photoListSection.style.display = 'block';
      if (a4PreviewSection) a4PreviewSection.style.display = 'block';

      var html = '';
      state.photos.forEach(function (photo, idx) {
        html += '<div class="photo-item-card" data-idx="' + idx + '">' +
          '<span style="font-weight: 700; color: #2563eb; width: 24px;">#' + (idx + 1) + '</span>' +
          '<img src="' + photo.dataUrl + '" class="photo-thumb" alt="縮圖">' +
          '<div class="photo-info">' +
            '<div style="font-size: 0.85rem; font-weight: 600; color: #334155;">' + escapeHtml(photo.fileName) + '</div>' +
            '<input type="text" class="caption-input" data-idx="' + idx + '" placeholder="請輸入圖說說明..." value="' + escapeHtml(photo.caption || '') + '">' +
          '</div>' +
          '<div class="photo-actions">' +
            '<button type="button" class="btn btn-sm secondary btn-move-up" data-idx="' + idx + '" ' + (idx === 0 ? 'disabled' : '') + '>▲ 上移</button>' +
            '<button type="button" class="btn btn-sm secondary btn-move-down" data-idx="' + idx + '" ' + (idx === state.photos.length - 1 ? 'disabled' : '') + '>▼ 下移</button>' +
          '</div>' +
        '</div>';
      });

      photosContainer.innerHTML = html;
      renderA4Preview();
    }

    function renderA4Preview() {
      if (!a4PagesContainer) return;

      var pageSize = Number(state.pageSize) || 4;
      var totalPhotos = state.photos.length;
      var pages = [];

      for (var i = 0; i < totalPhotos; i += pageSize) {
        pages.push(state.photos.slice(i, i + pageSize));
      }

      if (pageCount) pageCount.textContent = pages.length;

      var gridCls = 'grid-4';
      if (pageSize === 2) gridCls = 'grid-2';
      else if (pageSize === 6) gridCls = 'grid-6';

      var html = '';
      var globalIdx = 1;

      pages.forEach(function (pagePhotos, pIdx) {
        var metaLocation = state.location ? ('地點 / 專案：' + escapeHtml(state.location)) : '';
        var metaDate = state.date ? ('日期：' + escapeHtml(state.date)) : '';

        html += '<div class="a4-page">' +
          '<div class="a4-header">' +
            '<div class="a4-title">' + escapeHtml(state.title || '工作成果照片附件') + '</div>' +
            '<div class="a4-meta">' +
              '<span>' + metaDate + '</span>' +
              '<span>' + metaLocation + '</span>' +
              '<span>頁次：' + (pIdx + 1) + ' / ' + pages.length + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="a4-grid ' + gridCls + '">';

        pagePhotos.forEach(function (photo) {
          var captionText = photo.caption ? escapeHtml(photo.caption) : '';
          html += '<div class="a4-cell">' +
            '<div class="cell-img-wrap">' +
              '<img src="' + photo.dataUrl + '" class="cell-img" alt="成果照片">' +
            '</div>' +
            '<div class="cell-caption">' +
              '<span class="cell-num">圖 ' + globalIdx + '.</span>' + captionText +
            '</div>' +
          '</div>';
          globalIdx++;
        });

        html += '</div></div>';
      });

      a4PagesContainer.innerHTML = html;
    }

    function guessImageMimeType(fileName) {
      var lower = fileName.toLowerCase();
      if (lower.lastIndexOf('.png') === lower.length - 4) return 'image/png';
      if (lower.lastIndexOf('.webp') === lower.length - 5) return 'image/webp';
      return 'image/jpeg';
    }

    // 進入逐檔迴圈前，用完整 FileList 一次算出整批總量，交給 checkBatchSize() 判斷。
    // !ok 時 io-dropzone.js 會整批擋下，完全不進入逐檔迴圈（見 shared/IMG_CONTRACT.md 第 9a-1 節）。
    function imageBatchGate(files) {
      var totalBytes = 0;
      for (var i = 0; i < files.length; i++) {
        totalBytes += files[i].size;
      }
      var batchResult = checkBatchSize(totalBytes, files.length);
      if (batchResult.ok && batchResult.level === 'warn') showToast(batchResult.message, 2500);
      return batchResult;
    }

    function imageFileGate(file) {
      var singleResult = checkImageFileSize(file.size);
      if (!singleResult.ok) {
        return { ok: false, level: singleResult.level, message: file.name + '：' + singleResult.message };
      }
      return singleResult;
    }

    // 同一批（drop 或 change 觸發的）匯入用短延遲聚合：每張圖處理完就丟進 pendingResults，
    // 一段安靜期沒有新的完成事件才一次 flush，依 meta.index 排序後依原始選取順序加入
    // state.photos（不依賴非同步讀取完成的先後順序）。
    var pendingResults = [];
    var flushTimer = null;

    function flushPendingResults() {
      flushTimer = null;
      if (pendingResults.length === 0) return;
      var batch = pendingResults;
      pendingResults = [];
      batch.sort(function (a, b) { return a.index - b.index; });
      batch.forEach(function (r) {
        state.photos.push({
          id: r.id,
          dataUrl: r.dataUrl,
          fileName: r.fileName,
          caption: ''
        });
      });
      renderPhotoList();
      showToast('已匯入 ' + batch.length + ' 張照片！');
    }

    function scheduleFlush() {
      if (flushTimer) clearTimeout(flushTimer);
      flushTimer = setTimeout(flushPendingResults, 120);
    }

    function onImageData(arrayBuffer, fileName, meta) {
      var blob = new Blob([arrayBuffer], { type: guessImageMimeType(fileName) });
      loadImageFile(blob).then(function (res) {
        var scaledCanvas = resizeCanvas(res.canvas, { maxLongEdge: 1200, allowUpscale: false });
        pendingResults.push({
          index: meta.index,
          id: 'photo_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
          dataUrl: scaledCanvas.toDataURL('image/jpeg', 0.88),
          fileName: fileName,
          caption: ''
        });
        scheduleFlush();
      }).catch(function (err) {
        showToast(fileName + '：照片處理發生錯誤：' + (err.message || '未知錯誤'), 2500);
      });
    }

    if (btnSelectFiles && fileInput) {
      btnSelectFiles.addEventListener('click', function () {
        fileInput.click();
      });
      setupFilePicker(fileInput, onImageData, {
        accept: ['.jpg', '.jpeg', '.png', '.webp'],
        multiple: true,
        mode: 'bytes',
        gate: imageFileGate,
        gateBatch: imageBatchGate,
        onError: function (msg) { showToast(msg, 2500); }
      });
    }

    if (dropZone) {
      setupDropZone(dropZone, onImageData, {
        accept: ['.jpg', '.jpeg', '.png', '.webp'],
        multiple: true,
        mode: 'bytes',
        gate: imageFileGate,
        gateBatch: imageBatchGate,
        onError: function (msg) { showToast(msg, 2500); }
      });
    }

    // Live update metadata
    if (docTitle) {
      docTitle.addEventListener('input', function () {
        state.title = docTitle.value;
        renderA4Preview();
      });
    }
    if (docDate) {
      docDate.addEventListener('input', function () {
        state.date = docDate.value;
        renderA4Preview();
      });
    }
    if (docLocation) {
      docLocation.addEventListener('input', function () {
        state.location = docLocation.value;
        renderA4Preview();
      });
    }
    if (cfgPageSize) {
      cfgPageSize.addEventListener('change', function () {
        state.pageSize = Number(cfgPageSize.value) || 4;
        renderA4Preview();
      });
    }

    // Photo list event delegation (caption live input & move up/down)
    if (photosContainer) {
      photosContainer.addEventListener('input', function (e) {
        var target = e.target;
        if (target && target.classList.contains('caption-input')) {
          var idx = Number(target.getAttribute('data-idx'));
          if (state.photos[idx]) {
            state.photos[idx].caption = target.value;
            renderA4Preview();
          }
        }
      });

      photosContainer.addEventListener('click', function (e) {
        var target = e.target;
        if (target && target.classList.contains('btn-move-up')) {
          var idx = Number(target.getAttribute('data-idx'));
          if (idx > 0) {
            var item = state.photos.splice(idx, 1)[0];
            state.photos.splice(idx - 1, 0, item);
            renderPhotoList();
          }
        } else if (target && target.classList.contains('btn-move-down')) {
          var idxDown = Number(target.getAttribute('data-idx'));
          if (idxDown < state.photos.length - 1) {
            var itemDown = state.photos.splice(idxDown, 1)[0];
            state.photos.splice(idxDown + 1, 0, itemDown);
            renderPhotoList();
          }
        }
      });
    }

    if (btnPrint) {
      btnPrint.addEventListener('click', function () {
        window.print();
      });
    }

    function buildStandaloneReportHtml() {

      return '<!DOCTYPE html>\n' +
        '<html lang="zh-TW">\n<head>\n' +

        '<title>' + escapeHtml(state.title || '工作成果照片附件') + '</title>\n' +
        '<style>\n' +

        '.a4-header { border-bottom: 2px solid #1f2328; padding-bottom: 8px; margin-bottom: 12px; }\n' +
        '.a4-title { font-size: 1.3rem; font-weight: 700; margin: 0 0 4px 0; text-align: center; }\n' +
        '.a4-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: #4b5563; }\n' +
        '.a4-grid { flex: 1; display: grid; gap: 12px; }\n' +
        '.grid-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }\n' +
        '.grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }\n' +
        '.grid-6 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }\n' +
        '.a4-cell { border: 1px solid #e2e8f0; border-radius: 4px; padding: 8px; display: flex; flex-direction: column; background: #fafafa; overflow: hidden; }\n' +
        '.cell-img-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 0; }\n' +
        '.cell-img { max-width: 100%; max-height: 100%; object-fit: contain; }\n' +
        '.cell-caption { margin-top: 6px; font-size: 0.85rem; text-align: center; font-weight: 500; color: #1f2328; white-space: pre-wrap; word-break: break-word; }\n' +
        '.cell-num { font-size: 0.8rem; color: #2563eb; font-weight: 700; margin-right: 4px; }\n' +
        '@page { size: A4 portrait; margin: 10mm; }\n' +
        '@media print { body { background: #fff !important; margin: 0; padding: 0; } .no-print { display: none !important; } .print-page-break { page-break-after: always; break-inside: avoid; } .a4-page { box-shadow: none; border: none; margin: 0; padding: 5mm; width: 100%; min-height: 277mm; } }\n' +
        '</style>\n</head>\n<body>\n' +
        previewHtml +
        '\n</body>\n</html>';
    }

    if (btnExportHtml) {
      btnExportHtml.addEventListener('click', function () {
        var htmlContent = buildStandaloneReportHtml();
        downloadFile('photo_evidence_sheet.html', htmlContent, 'text/html;charset=utf-8');
        showToast('已匯出列印版 HTML 附件');
      });
    }

    if (btnCopySummary) {
      btnCopySummary.addEventListener('click', function () {
        var text = '【工作成果照片附件摘要】\n' +
                   '標題：' + state.title + '\n' +
                   '日期：' + state.date + '\n' +
                   '地點：' + state.location + '\n' +
                   '照片總數：' + state.photos.length + ' 張\n' +
                   '排版配置：每頁 ' + state.pageSize + ' 張，共 ' + Math.ceil(state.photos.length / state.pageSize) + ' 頁\n';
        copyToClipboard(text).then(function () {
          showToast('已複製成果摘要');
        });
      });
    }

    if (btnClear) {
      btnClear.addEventListener('click', function () {
        state.photos = [];
        renderPhotoList();
        showToast('已清空所有照片');
      });
    }

    function buildCleanHtmlCopy() {
      var doc = document.documentElement.cloneNode(true);

      var toast = doc.querySelector('#__shared_toast');
      if (toast) toast.remove();

      var navBack = doc.querySelector('.nav-back');
      if (navBack) navBack.remove();

      var offlineBtn = doc.querySelector('#btn-download-offline');
      if (offlineBtn) offlineBtn.remove();

      var listSec = doc.querySelector('#photo-list-section');
      if (listSec) listSec.style.display = 'none';

      var pContainer = doc.querySelector('#photos-container');
      if (pContainer) pContainer.innerHTML = '';

      var a4Sec = doc.querySelector('#a4-preview-section');
      if (a4Sec) a4Sec.style.display = 'none';

      var a4Container = doc.querySelector('#a4-pages-container');
      if (a4Container) a4Container.innerHTML = '';

      var pCount = doc.querySelector('#photo-count');
      if (pCount) pCount.textContent = '0';

      var pgCount = doc.querySelector('#page-count');
      if (pgCount) pgCount.textContent = '0';

      var inTitle = doc.querySelector('#doc-title');
      if (inTitle) inTitle.value = '工作成果照片附件';

      var inDate = doc.querySelector('#doc-date');
      if (inDate) inDate.value = '';

      var inLoc = doc.querySelector('#doc-location');
      if (inLoc) inLoc.value = '';

      return '<!DOCTYPE html>\n' + doc.outerHTML;
    }

    window.buildCleanHtmlCopy = buildCleanHtmlCopy;

    if (btnDownloadOffline) {
      btnDownloadOffline.addEventListener('click', function () {
        var cleanHtml = buildCleanHtmlCopy();
        downloadFile('photo-evidence-sheet-offline.html', cleanHtml, 'text/html;charset=utf-8');
        showToast('已下載離線版工具');
      });
    }
  })();
  </script>
</body>
</html>
