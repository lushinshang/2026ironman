<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>異動重點摘要產生器</title>
<style>
  :root{
    --bg:#f9f7f4;
    --text:#1a1a1a;
    --muted:#6b6459;
    --accent:#9a5b3c;
    --card:#ffffff;
    --border:#e6e1d8;
    --danger:#c0392b;
    --add-bg:#eaf5e6;
    --add-border:#b7dba9;
    --del-bg:#fbe9e7;
    --del-border:#e6b3ac;
    --mod-bg:#fdf3e0;
    --mod-border:#e8c99a;
    --err-bg:#fbe9e7;
    --err-border:#e6b3ac;
    --ok-bg:#eaf5e6;
    --ok-border:#b7dba9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:16px;
    line-height:1.6;
  }
  header{
    max-width:1120px;
    margin:0 auto;
    padding:32px 24px 8px;
  }
  h1{
    font-size:clamp(1.5rem,3.2vw,2rem);
    margin:0 0 4px;
  }
  header p{
    color:var(--muted);
    font-size:14px;
    margin:0;
  }
  main{
    max-width:1120px;
    margin:0 auto;
    padding:16px 24px 60px;
    display:grid;
    grid-template-columns:1fr;
    gap:24px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
  }
  .card h2{
    font-size:15px;
    margin:0 0 10px;
    color:var(--text);
  }
  .nav-back{
    max-width:1120px;
    margin:0 auto;
    padding:16px 24px 0;
    font-size:14px;
  }
  .nav-back a{
    color:var(--accent);
    text-decoration:none;
  }
  .nav-back a:hover{text-decoration:underline;}
  .hidden{display:none !important;}
  #input-card.dragover{
    border-color:var(--accent);
    background:#fbf3ec;
  }
  textarea.input-area{
    width:100%;
    min-height:220px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
    font-size:14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    line-height:1.7;
    color:var(--text);
    background:#fffdfa;
  }
  #summary-text{min-height:160px;}
  .file-hint{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }
  .file-name{
    font-size:13px;
    color:var(--accent);
    margin-top:4px;
    min-height:18px;
  }
  .btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
  }
  button{
    font-family:inherit;
    font-size:14px;
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    cursor:pointer;
  }
  button:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  button.primary{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  button.primary:hover:not(:disabled){opacity:.9; color:#fff;}
  .parse-msg{
    margin-top:10px;
    font-size:13px;
    padding:10px 12px;
    border-radius:8px;
    display:none;
  }
  .parse-msg.show{display:block;}
  .parse-msg.ok{background:var(--ok-bg); border:1px solid var(--ok-border); color:#3d7a2a;}
  .parse-msg.err{background:var(--err-bg); border:1px solid var(--err-border); color:var(--danger);}
  .parse-msg.warn{background:var(--mod-bg); border:1px solid var(--mod-border); color:#a06a1e;}
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    font-size:13px;
    color:var(--muted);
  }
  .legend-item{display:flex; align-items:center; gap:6px;}
  .legend-swatch{
    width:14px;
    height:14px;
    border-radius:4px;
    border:1px solid var(--border);
    display:inline-block;
  }
  .legend-swatch.added{background:var(--add-bg); border-color:var(--add-border);}
  .legend-swatch.removed{background:var(--del-bg); border-color:var(--del-border);}
  .legend-swatch.modified{background:var(--mod-bg); border-color:var(--mod-border);}
  .stats{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:12px;
    font-size:14px;
  }
  .stats .stat-item b{font-size:16px;}
  .stats .stat-item.added b{color:#3d7a2a;}
  .stats .stat-item.removed b{color:var(--danger);}
  .stats .stat-item.modified b{color:#a06a1e;}
  .change-list{
    border:1px solid var(--border);
    border-radius:8px;
    max-height:420px;
    overflow-y:auto;
  }
  .change-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 14px;
    font-size:14px;
  }
  .change-item + .change-item{border-top:1px solid var(--border);}
  .change-item input[type=checkbox]{margin-top:4px; width:16px; height:16px; flex-shrink:0;}
  .change-item.suspicious{background:#faf6ee;}
  .suspicious-badge{
    display:inline-block;
    padding:2px 8px;
    border-radius:12px;
    font-size:12px;
    margin-right:8px;
    white-space:nowrap;
    vertical-align:middle;
    background:#f1ece1;
    border:1px solid var(--border);
    color:var(--muted);
  }
  .type-badge{
    display:inline-block;
    padding:2px 8px;
    border-radius:12px;
    font-size:12px;
    margin-right:8px;
    white-space:nowrap;
    vertical-align:middle;
  }
  .type-badge.added{background:var(--add-bg); border:1px solid var(--add-border); color:#3d7a2a;}
  .type-badge.removed{background:var(--del-bg); border:1px solid var(--del-border); color:var(--danger);}
  .type-badge.modified{background:var(--mod-bg); border:1px solid var(--mod-border); color:#a06a1e;}
  .change-content{flex:1; word-break:break-word;}
  .empty-hint{padding:14px; font-size:13px; color:var(--muted);}
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#1a1a1a;
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="nav-back"><a href="../index.html">← 返回 Vibe Coding 100 題清單</a></div>

<header>
  <h1>異動重點摘要產生器</h1>
  <p>貼上或拖曳 Day7 文字差異比對器下載的差異報告 MD，勾選真正重要的異動，自動組成可直接複製的摘要文字。所有解析與組成都在瀏覽器本機完成，不上傳任何內容。</p>
</header>

<main>
  <section class="card" id="input-card">
    <h2>輸入來源</h2>
    <textarea class="input-area" id="input-text" placeholder="貼上 Day7 下載的差異報告 MD 內容，或把 .md 檔案拖曳到這裡"></textarea>
    <div class="file-hint">支援直接拖曳單一 .md 差異報告檔案，自動讀取內容帶入輸入區</div>
    <div class="file-name" id="file-name"></div>
    <div class="btn-row">
      <button type="button" id="btn-parse" class="primary">解析異動清單</button>
    </div>
    <div class="parse-msg" id="parse-msg"></div>
  </section>

  <section class="card hidden" id="result-section">
    <div class="stats" id="stats"></div>
    <div class="legend">
      <span class="legend-item"><span class="legend-swatch added"></span>新增</span>
      <span class="legend-item"><span class="legend-swatch removed"></span>刪除</span>
      <span class="legend-item"><span class="legend-swatch modified"></span>修改</span>
    </div>
    <div class="btn-row">
      <button type="button" id="btn-select-all">全選</button>
      <button type="button" id="btn-select-none">全不選</button>
    </div>
    <div class="change-list" id="change-list" style="margin-top:12px;"></div>
  </section>

  <section class="card hidden" id="summary-section">
    <h2>摘要預覽（可直接編輯）</h2>
    <textarea class="input-area" id="summary-text"></textarea>
    <div class="btn-row">
      <button type="button" id="btn-copy">複製摘要</button>
      <button type="button" id="btn-download" class="primary">下載摘要 MD</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var state = {
    items: []
  };

  var inputCard = document.getElementById('input-card');
  var inputText = document.getElementById('input-text');
  var fileNameEl = document.getElementById('file-name');
  var parseMsgEl = document.getElementById('parse-msg');
  var resultSection = document.getElementById('result-section');
  var summarySection = document.getElementById('summary-section');
  var statsEl = document.getElementById('stats');
  var changeListEl = document.getElementById('change-list');
  var summaryTextEl = document.getElementById('summary-text');
  var toastEl = document.getElementById('toast');

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  function setParseMsg(kind, text){
    parseMsgEl.className = 'parse-msg show ' + kind;
    parseMsgEl.textContent = text;
  }

  // --- 解析器：正則比對 Day7 差異報告 MD 的三種條列行 ---
  var RE_MODIFIED = /^-\s*\*\*修改\*\*[:：]\s*`(.*)`\s*→\s*`(.*)`\s*$/;
  var RE_ADDED = /^-\s*\*\*新增\*\*[:：]\s*`(.*)`\s*$/;
  var RE_REMOVED = /^-\s*\*\*刪除\*\*[:：]\s*`(.*)`\s*$/;
  var RE_BULLET_LOOKS_LIKE_ITEM = /^-\s*\*\*/;

  // --- 雜訊判斷：old/new 內容過長、含重複案號或頁碼殘留、old/new 幾乎不相關 ---
  var SUSPICIOUS_LENGTH_LIMIT = 150;
  var SUSPICIOUS_OVERLAP_MIN = 0.15;
  var RE_PAGE_NUMBER = /\d{1,4}\s/g;
  var RE_CASE_TOKEN = /[0-9A-Za-z]{6,}/g;
  var RE_SPACED_CJK_RUN = /([一-龥][ 　]){4,}[一-龥]/;

  function charOverlapRatio(a, b){
    if (!a || !b) return 1;
    var freq = {};
    for (var i = 0; i < a.length; i++){
      var c = a[i];
      freq[c] = (freq[c] || 0) + 1;
    }
    var common = 0;
    for (var j = 0; j < b.length; j++){
      var c2 = b[j];
      if (freq[c2] > 0){
        common++;
        freq[c2]--;
      }
    }
    var denom = Math.max(a.length, b.length);
    return denom ? common / denom : 1;
  }

  function detectSuspicious(type, oldSentence, newSentence){
    var oldText = oldSentence || '';
    var newText = newSentence || '';

    // 規則一：單條 old 或 new 內容過長
    if (oldText.length > SUSPICIOUS_LENGTH_LIMIT || newText.length > SUSPICIOUS_LENGTH_LIMIT){
      return true;
    }

    // 規則二：含重複案號／頁碼殘留特徵
    var combined = oldText + ' ' + newText;
    var pageNumberMatches = combined.match(RE_PAGE_NUMBER) || [];
    if (pageNumberMatches.length >= 3){
      return true;
    }
    var caseTokens = combined.match(RE_CASE_TOKEN) || [];
    for (var k = 0; k < caseTokens.length; k++){
      var token = caseTokens[k];
      if (/[0-9]/.test(token) && /[A-Za-z]/.test(token)){
        return true;
      }
    }

    // 規則三：old/new 內容重疊度過低（僅在兩側皆有內容的「修改」項目適用）
    if (type === 'modified' && oldText && newText){
      if (charOverlapRatio(oldText, newText) < SUSPICIOUS_OVERLAP_MIN){
        return true;
      }
    }

    // 規則四：連續單一中文字之間反覆插入空白（PDF 抽字錯位殘留）
    if (RE_SPACED_CJK_RUN.test(combined)){
      return true;
    }

    return false;
  }

  function parseReport(text){
    var lines = String(text).split(/\r\n|\r|\n/);
    var items = [];
    var unparsedCount = 0;
    var nextId = 1;

    lines.forEach(function(rawLine){
      var line = rawLine.trim();
      if (!line) return;

      var m, suspicious;
      if ((m = RE_MODIFIED.exec(line))){
        suspicious = detectSuspicious('modified', m[1], m[2]);
        items.push({ id: nextId++, type: 'modified', oldSentence: m[1], newSentence: m[2], checked: !suspicious, suspicious: suspicious });
      } else if ((m = RE_ADDED.exec(line))){
        suspicious = detectSuspicious('added', '', m[1]);
        items.push({ id: nextId++, type: 'added', oldSentence: '', newSentence: m[1], checked: !suspicious, suspicious: suspicious });
      } else if ((m = RE_REMOVED.exec(line))){
        suspicious = detectSuspicious('removed', m[1], '');
        items.push({ id: nextId++, type: 'removed', oldSentence: m[1], newSentence: '', checked: !suspicious, suspicious: suspicious });
      } else if (RE_BULLET_LOOKS_LIKE_ITEM.test(line)){
        // 看起來像異動條列行，但格式不完全符合，計數但不中斷
        unparsedCount++;
      }
      // 其餘（標題、統計摘要列等）略過，不計入格式不符
    });

    return { items: items, unparsedCount: unparsedCount };
  }

  function typeLabel(type){
    if (type === 'added') return '新增';
    if (type === 'removed') return '刪除';
    return '修改';
  }

  function renderChangeList(){
    changeListEl.innerHTML = '';
    if (!state.items.length){
      changeListEl.innerHTML = '<div class="empty-hint">（尚無異動項目）</div>';
      return;
    }
    state.items.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'change-item' + (item.suspicious ? ' suspicious' : '');

      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = item.checked;
      checkbox.setAttribute('data-id', item.id);
      checkbox.addEventListener('change', function(){
        item.checked = checkbox.checked;
        updateStats();
        regenerateSummary();
      });

      var content = document.createElement('div');
      content.className = 'change-content';
      var desc = item.type === 'modified'
        ? escapeHtml(item.oldSentence) + ' → ' + escapeHtml(item.newSentence)
        : (item.type === 'added' ? escapeHtml(item.newSentence) : escapeHtml(item.oldSentence));
      var suspiciousBadge = item.suspicious ? '<span class="suspicious-badge">可能為雜訊</span>' : '';
      content.innerHTML = '<span class="type-badge ' + item.type + '">' + typeLabel(item.type) + '</span>' + suspiciousBadge + desc;

      row.appendChild(checkbox);
      row.appendChild(content);
      changeListEl.appendChild(row);
    });
  }

  function updateStats(){
    var total = state.items.length;
    var checkedItems = state.items.filter(function(i){ return i.checked; });
    var checkedCount = checkedItems.length;
    var counts = { added: 0, removed: 0, modified: 0 };
    checkedItems.forEach(function(i){ counts[i.type]++; });
    var suspiciousCount = state.items.filter(function(i){ return i.suspicious; }).length;

    statsEl.innerHTML =
      '<span class="stat-item">已勾選 <b>' + checkedCount + '</b> ／ 全部 <b>' + total + '</b> 條</span>' +
      '<span class="stat-item added">新增 <b>' + counts.added + '</b></span>' +
      '<span class="stat-item removed">刪除 <b>' + counts.removed + '</b></span>' +
      '<span class="stat-item modified">修改 <b>' + counts.modified + '</b></span>' +
      '<span class="stat-item">可疑雜訊：<b>' + suspiciousCount + '</b> 條（已預設不勾選）</span>';
  }

  function buildSummary(){
    var checkedItems = state.items.filter(function(i){ return i.checked; });
    if (!checkedItems.length){
      return '（無勾選項目）';
    }
    var lines = ['本次公告異動重點：'];
    checkedItems.forEach(function(item, idx){
      var desc = item.type === 'modified'
        ? item.oldSentence + ' → ' + item.newSentence
        : (item.type === 'added' ? item.newSentence : item.oldSentence);
      lines.push((idx + 1) + '. ' + desc);
    });
    return lines.join('\n');
  }

  function regenerateSummary(){
    summaryTextEl.value = buildSummary();
  }

  // --- 輸入區：解析按鈕 ---
  document.getElementById('btn-parse').addEventListener('click', function(){
    var text = inputText.value;

    if (!text || !text.trim()){
      resultSection.classList.add('hidden');
      summarySection.classList.add('hidden');
      setParseMsg('err', '請先貼上或拖曳差異報告內容再解析。');
      return;
    }

    var result = parseReport(text);
    state.items = result.items;

    if (!result.items.length){
      resultSection.classList.add('hidden');
      summarySection.classList.add('hidden');
      setParseMsg('err', '未偵測到可辨識的異動內容，請確認格式是否符合「- **修改／新增／刪除**：...」條列格式。');
      return;
    }

    renderChangeList();
    updateStats();
    regenerateSummary();
    resultSection.classList.remove('hidden');
    summarySection.classList.remove('hidden');

    if (result.unparsedCount > 0){
      setParseMsg('warn', '已解析 ' + result.items.length + ' 條異動；格式不符，略過 ' + result.unparsedCount + ' 行。');
    } else {
      setParseMsg('ok', '已解析 ' + result.items.length + ' 條異動。');
    }
  });

  // --- 全選／全不選 ---
  document.getElementById('btn-select-all').addEventListener('click', function(){
    state.items.forEach(function(i){ i.checked = true; });
    renderChangeList();
    updateStats();
    regenerateSummary();
  });
  document.getElementById('btn-select-none').addEventListener('click', function(){
    state.items.forEach(function(i){ i.checked = false; });
    renderChangeList();
    updateStats();
    regenerateSummary();
  });

  // --- 拖曳 .md 檔案讀取（file:// 相容，僅用 FileReader） ---
  inputCard.addEventListener('dragover', function(e){
    e.preventDefault();
    inputCard.classList.add('dragover');
  });
  inputCard.addEventListener('dragleave', function(){
    inputCard.classList.remove('dragover');
  });
  inputCard.addEventListener('drop', function(e){
    e.preventDefault();
    inputCard.classList.remove('dragover');
    var files = e.dataTransfer && e.dataTransfer.files;
    if (!files || !files.length) return;
    var file = files[0];
    var lowerName = file.name.toLowerCase();
    if (!lowerName.endsWith('.md')){
      fileNameEl.textContent = '僅支援 .md 檔案：' + file.name;
      return;
    }
    var reader = new FileReader();
    reader.onload = function(evt){
      inputText.value = evt.target.result;
      fileNameEl.textContent = '已載入：' + file.name;
    };
    reader.onerror = function(){
      fileNameEl.textContent = '讀取失敗：' + file.name;
    };
    reader.readAsText(file, 'utf-8');
  });

  // --- 複製與下載 ---
  document.getElementById('btn-copy').addEventListener('click', function(){
    var content = summaryTextEl.value;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(content).then(function(){
        showToast('已複製摘要');
      }).catch(function(){
        showToast('複製失敗，請手動選取');
      });
    } else {
      showToast('此瀏覽器不支援自動複製，請手動選取');
    }
  });

  document.getElementById('btn-download').addEventListener('click', function(){
    var content = summaryTextEl.value;
    var blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '異動重點摘要.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
})();
</script>
</body>
</html>
