<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 文字擷取與全文搜尋 — Day20</title>
  <style>
/* shared/base.css — 共用樣式基底 */
:root {
  --color-bg: #f7f7f8;
  --color-surface: #ffffff;
  --color-border: #d9d9de;
  --color-text: #1f2328;
  --color-text-muted: #6b7280;
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-danger: #dc2626;
  --color-toast-bg: #1f2328;
  --color-toast-text: #ffffff;
  --radius: 8px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans);
  color: var(--color-text);
  background: var(--color-bg);
  line-height: 1.6;
}

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px 16px;
}

h1, h2, h3 { line-height: 1.3; }

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 1rem;
}

button, .btn {
  font-family: inherit;
  font-size: 0.95rem;
  padding: 8px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

button:hover, .btn:hover { background: var(--color-bg); }

button.primary, .btn.primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #ffffff;
}

button.primary:hover, .btn.primary:hover { background: var(--color-primary-hover); }

button:disabled, .btn:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.dropzone {
  border: 2px dashed var(--color-border);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  color: var(--color-text-muted);
  cursor: pointer;
  background: #ffffff;
}

.dropzone.dragover {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: #eff6ff;
}

.nav-back {
  display: inline-block;
  margin-bottom: 16px;
  color: var(--color-text-muted);
  text-decoration: none;
}

.nav-back:hover { text-decoration: underline; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 32px;
  transform: translateX(-50%);
  background: var(--color-toast-bg);
  color: var(--color-toast-text);
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 1000;
}

.toast.show { opacity: 1; }

.btn-group {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin: 0.5rem 0;
}
.btn-sm {
  padding: 0.35rem 0.65rem;
  font-size: 0.85rem;
}

.search-bar {
  display: flex;
  gap: 8px;
  margin: 1rem 0;
}
.search-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  font-size: 1rem;
  font-family: inherit;
}
.search-input:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
}

.search-results {
  background: #f8fafc;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 1.5rem;
  max-height: 280px;
  overflow-y: auto;
  display: none;
}
.result-item {
  padding: 8px 12px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 4px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
  font-size: 0.9rem;
}
.result-item:hover {
  background: #eff6ff;
  border-color: #bfdbfe;
}
.result-page-tag {
  font-weight: 700;
  color: var(--color-primary);
  margin-right: 8px;
}
mark {
  background-color: #fef08a;
  color: #1e293b;
  padding: 1px 3px;
  border-radius: 2px;
  font-weight: 600;
}

.page-text-block {
  background: #ffffff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
.page-text-block.highlight-pulse {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px rgba(37,99,235,0.25);
}
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  border-bottom: 1px solid #f1f5f9;
  padding-bottom: 6px;
  font-size: 0.9rem;
}
.page-body {
  font-family: var(--font-sans);
  font-size: 0.95rem;
  white-space: pre-wrap;
  word-break: break-word;
  color: #334155;
  max-height: 400px;
  overflow-y: auto;
  padding: 6px 0;
}
.page-empty {
  color: #94a3b8;
  font-style: italic;
}

.alert-box {
  padding: 12px 16px;
  border-radius: var(--radius);
  margin-bottom: 1rem;
  font-size: 0.95rem;
}
.alert-warning {
  background: #fffbeb;
  border: 1px solid #fde68a;
  color: #92400e;
}
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-back">
      <a href="../index.html">← 回首頁</a>
    </nav>

    <header>
      <h1>PDF 文字擷取與全文搜尋</h1>
      <p class="subtitle" style="color: var(--color-text-muted);">
        極速解析多頁 PDF 文字層，支援關鍵字全文搜尋、即時頁面定位跳轉與 TXT / Markdown 多格式匯出。純本機端執行，隱私無虞。
      </p>
    </header>

    <div class="dropzone" id="drop-zone">
      <div style="font-size: 2rem; margin-bottom: 0.5rem;">🔍</div>
      <div style="margin-bottom: 0.75rem;">拖放 PDF 檔案至此，或點擊選取檔案</div>
      <input type="file" id="file-input" accept="application/pdf,.pdf" style="display: none;">
      <button type="button" class="btn secondary" id="btn-select-file">選擇 PDF 檔案</button>
    </div>

    <div id="editor-section" style="display: none;">
      <div id="no-text-alert" class="alert-box alert-warning" style="display: none;">
        ⚠️ <strong>提示</strong>：本文件未偵測到可擷取的文字層（可能為純手寫、拍照或純掃描圖片檔），若需文字請先使用 OCR 工具處理。
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
          <div>
            <h3 style="margin: 0 0 4px 0; font-size: 1.1rem;" id="doc-filename">document.pdf</h3>
            <div style="font-size: 0.85rem; color: #64748b;">
              總頁數：<strong id="doc-page-count" style="color: #2563eb;">0</strong> 頁｜總字數：<span id="doc-char-count">0</span> 字
            </div>
          </div>

          <div class="btn-group">
            <button type="button" class="btn primary btn-sm" id="btn-export-txt">⬇️ 下載 TXT</button>
            <button type="button" class="btn secondary btn-sm" id="btn-export-md">⬇️ 下載 Markdown</button>
            <button type="button" class="btn secondary btn-sm" id="btn-copy-all">📋 複製全部文字</button>
            <button type="button" class="btn secondary btn-sm" id="btn-reset">重新上傳</button>
          </div>
        </div>

        <div class="search-bar">
          <input type="text" id="search-input" class="search-input" placeholder="輸入關鍵字搜尋全書文字（不分大小寫）...">
        </div>

        <div class="search-results" id="search-results"></div>
      </div>

      <div id="pages-container"></div>
    </div>

    <div class="btn-group" style="margin-top: 2rem; border-top: 1px solid #e2e8f0; padding-top: 1.5rem;">
      <button type="button" class="btn secondary" id="btn-download-offline">💾 下載本工具離線版</button>
    </div>

    <!--{{LICENSES}}-->
  </div>

  <!--{{ASSET:pdfjs}}-->
  <!--{{ASSET:pdfjs_worker}}-->
  <!--{{SHARED:util-escape}}-->
  <!--{{SHARED:ui-toast}}-->
  <!--{{SHARED:ui-debounce}}-->
  <!--{{SHARED:io-download}}-->
  <!--{{SHARED:io-clipboard}}-->
  <!--{{SHARED:io-dropzone}}-->
  <!--{{SHARED:pdf-file-size}}-->
  <!--{{SHARED:pdf-decode}}-->

  <script>
  (function () {
    var state = {
      file: null,
      fileName: '',
      pdfDoc: null,
      totalPages: 0,
      totalChars: 0,
      hasTextLayer: false,
      pages: [] // Array<{ pageNum: number, text: string }>
    };

    var dropZone = document.getElementById('drop-zone');
    var fileInput = document.getElementById('file-input');
    var btnSelectFile = document.getElementById('btn-select-file');
    var editorSection = document.getElementById('editor-section');
    var noTextAlert = document.getElementById('no-text-alert');
    var docFilename = document.getElementById('doc-filename');
    var docPageCount = document.getElementById('doc-page-count');
    var docCharCount = document.getElementById('doc-char-count');
    var searchInput = document.getElementById('search-input');
    var searchResults = document.getElementById('search-results');
    var pagesContainer = document.getElementById('pages-container');
    var btnExportTxt = document.getElementById('btn-export-txt');
    var btnExportMd = document.getElementById('btn-export-md');
    var btnCopyAll = document.getElementById('btn-copy-all');
    var btnReset = document.getElementById('btn-reset');
    var btnDownloadOffline = document.getElementById('btn-download-offline');

    function getBaseName(fileName) {
      var dot = fileName.lastIndexOf('.');
      return (dot !== -1) ? fileName.substring(0, dot) : fileName;
    }

    function renderPages() {
      if (!pagesContainer) return;
      pagesContainer.innerHTML = '';

      state.pages.forEach(function (p) {
        var block = document.createElement('div');
        block.className = 'page-text-block';
        block.id = 'page-text-block-' + p.pageNum;

        var header = document.createElement('div');
        header.className = 'page-header';
        header.innerHTML = '<strong>第 ' + p.pageNum + ' 頁</strong><span style="color: #64748b; font-size: 0.8rem;">' +
                           (p.text ? p.text.length + ' 字' : '無文字') + '</span>';

        var body = document.createElement('div');
        body.className = 'page-body';
        body.id = 'page-body-' + p.pageNum;
        if (p.text && p.text.trim().length > 0) {
          body.textContent = p.text;
        } else {
          body.className += ' page-empty';
          body.textContent = '（本頁無可擷取文字）';
        }

        block.appendChild(header);
        block.appendChild(body);
        pagesContainer.appendChild(block);
      });
    }

    function performSearch(query) {
      if (!searchResults) return;
      query = (query || '').trim();

      if (!query) {
        searchResults.style.display = 'none';
        searchResults.innerHTML = '';
        return;
      }

      var lowerQ = query.toLowerCase();
      var matches = [];

      state.pages.forEach(function (p) {
        if (!p.text) return;
        var lowerText = p.text.toLowerCase();
        var pos = 0;
        while ((pos = lowerText.indexOf(lowerQ, pos)) !== -1) {
          var start = Math.max(0, pos - 30);
          var end = Math.min(p.text.length, pos + query.length + 30);
          var snippetBefore = p.text.substring(start, pos);
          var matchedPart = p.text.substring(pos, pos + query.length);
          var snippetAfter = p.text.substring(pos + query.length, end);

          matches.push({
            pageNum: p.pageNum,
            before: snippetBefore,
            matched: matchedPart,
            after: snippetAfter
          });

          pos += query.length;
        }
      });

      searchResults.style.display = 'block';
      searchResults.innerHTML = '';

      if (matches.length === 0) {
        searchResults.innerHTML = '<div style="color: #64748b; padding: 4px;">查無符合「' + escapeHtml(query) + '」的搜尋結果</div>';
        return;
      }

      var countHeader = document.createElement('div');
      countHeader.style.fontSize = '0.85rem';
      countHeader.style.color = '#64748b';
      countHeader.style.marginBottom = '8px';
      countHeader.textContent = '共找到 ' + matches.length + ' 處符合項目（點擊跳轉至該頁）：';
      searchResults.appendChild(countHeader);

      matches.forEach(function (m) {
        var item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = '<span class="result-page-tag">第 ' + m.pageNum + ' 頁</span>...' +
                         escapeHtml(m.before) + '<mark>' + escapeHtml(m.matched) + '</mark>' + escapeHtml(m.after) + '...';

        item.addEventListener('click', function () {
          var targetBlock = document.getElementById('page-text-block-' + m.pageNum);
          if (targetBlock) {
            targetBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetBlock.classList.remove('highlight-pulse');
            // Force DOM reflow to retrigger animation
            void targetBlock.offsetWidth;
            targetBlock.classList.add('highlight-pulse');
            setTimeout(function () {
              targetBlock.classList.remove('highlight-pulse');
            }, 2500);
          }
        });

        searchResults.appendChild(item);
      });
    }

    var debouncedSearch = debounce(performSearch, 150);

    if (searchInput) {
      searchInput.addEventListener('input', function () {
        debouncedSearch(searchInput.value);
      });
    }

    function loadPdf(file) {
      var gate = checkPdfFileSize(file.size);
      if (!gate.ok) {
        showToast(gate.message, 3500);
        return;
      } else if (gate.level === 'warn') {
        showToast(gate.message, 2500);
      }

      showToast('正在載入並解析 PDF 文字層...');

      loadPdfFile(file).then(function (pdfDoc) {
        state.file = file;
        state.fileName = file.name || 'document.pdf';
        state.pdfDoc = pdfDoc;
        state.totalPages = getPageCount(pdfDoc);

        return extractAllText(pdfDoc);
      }).then(function (extractedPages) {
        state.pages = extractedPages.map(function (item) {
          return {
            pageNum: item.pageIndex,
            text: item.text || ''
          };
        });

        var totalChars = 0;
        var nonBlankPages = 0;
        state.pages.forEach(function (p) {
          var t = p.text.trim();
          totalChars += t.length;
          if (t.length > 0) nonBlankPages++;
        });

        state.totalChars = totalChars;
        state.hasTextLayer = (nonBlankPages > 0);

        if (docFilename) docFilename.textContent = state.fileName;
        if (docPageCount) docPageCount.textContent = state.totalPages;
        if (docCharCount) docCharCount.textContent = state.totalChars.toLocaleString();

        if (noTextAlert) {
          noTextAlert.style.display = state.hasTextLayer ? 'none' : 'block';
        }

        if (dropZone) dropZone.style.display = 'none';
        if (editorSection) editorSection.style.display = 'block';

        renderPages();
        showToast('文字擷取完成！共 ' + state.totalPages + ' 頁，' + state.totalChars.toLocaleString() + ' 字。');
      }).catch(function (err) {
        showToast('PDF 解析失敗：' + (err.message || '無效檔案'));
      });
    }

    if (btnSelectFile && fileInput) {
      btnSelectFile.addEventListener('click', function () {
        fileInput.click();
      });
      fileInput.addEventListener('change', function () {
        if (fileInput.files && fileInput.files[0]) {
          loadPdf(fileInput.files[0]);
          fileInput.value = '';
        }
      });
    }

    if (dropZone) {
      setupDropZone(dropZone, function () {}, {
        accept: ['.pdf', 'application/pdf'],
        gate: function (file) { return checkPdfFileSize(file.size); },
        onError: function (msg) { showToast(msg); }
      });
      dropZone.addEventListener('drop', function (e) {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          loadPdf(e.dataTransfer.files[0]);
        }
      });
    }

    function buildTxtContent() {
      var lines = [];
      lines.push('【檔案名稱：' + state.fileName + '】');
      lines.push('【總頁數：' + state.totalPages + ' 頁】\n');

      state.pages.forEach(function (p) {
        lines.push('=== 第 ' + p.pageNum + ' 頁 ===');
        lines.push(p.text || '（本頁無文字）');
        lines.push('');
      });

      return lines.join('\n');
    }

    function buildMdContent() {
      var lines = [];
      lines.push('# ' + getBaseName(state.fileName) + ' 擷取文字');
      lines.push('');
      lines.push('- 原始檔案：`' + state.fileName + '`');
      lines.push('- 總頁數：' + state.totalPages + ' 頁');
      lines.push('');

      state.pages.forEach(function (p) {
        lines.push('## 第 ' + p.pageNum + ' 頁');
        lines.push('');
        lines.push(p.text || '*（本頁無文字）*');
        lines.push('');
      });

      return lines.join('\n');
    }

    if (btnExportTxt) {
      btnExportTxt.addEventListener('click', function () {
        var txt = buildTxtContent();
        downloadFile(getBaseName(state.fileName) + '_text.txt', txt, 'text/plain;charset=utf-8');
        showToast('已下載 TXT 檔案');
      });
    }

    if (btnExportMd) {
      btnExportMd.addEventListener('click', function () {
        var md = buildMdContent();
        downloadFile(getBaseName(state.fileName) + '_text.md', md, 'text/markdown;charset=utf-8');
        showToast('已下載 Markdown 檔案');
      });
    }

    if (btnCopyAll) {
      btnCopyAll.addEventListener('click', function () {
        var txt = buildTxtContent();
        copyToClipboard(txt).then(function () {
          showToast('已複製全書純文字至剪貼簿！');
        });
      });
    }

    if (btnReset) {
      btnReset.addEventListener('click', function () {
        state.file = null;
        state.fileName = '';
        state.pdfDoc = null;
        state.totalPages = 0;
        state.totalChars = 0;
        state.hasTextLayer = false;
        state.pages = [];

        if (searchInput) searchInput.value = '';
        if (searchResults) {
          searchResults.style.display = 'none';
          searchResults.innerHTML = '';
        }
        if (pagesContainer) pagesContainer.innerHTML = '';
        if (editorSection) editorSection.style.display = 'none';
        if (dropZone) dropZone.style.display = 'block';
        showToast('已重置');
      });
    }

    function buildCleanHtmlCopy() {
      var doc = document.documentElement.cloneNode(true);

      var toast = doc.querySelector('#__shared_toast');
      if (toast) toast.remove();

      var navBack = doc.querySelector('.nav-back');
      if (navBack) navBack.remove();

      var offlineBtn = doc.querySelector('#btn-download-offline');
      if (offlineBtn) offlineBtn.remove();

      var edSection = doc.querySelector('#editor-section');
      if (edSection) edSection.style.display = 'none';

      var dZone = doc.querySelector('#drop-zone');
      if (dZone) dZone.style.display = 'block';

      var pContainer = doc.querySelector('#pages-container');
      if (pContainer) pContainer.innerHTML = '';

      var sResults = doc.querySelector('#search-results');
      if (sResults) {
        sResults.style.display = 'none';
        sResults.innerHTML = '';
      }

      var sInput = doc.querySelector('#search-input');
      if (sInput) sInput.value = '';

      var pCount = doc.querySelector('#doc-page-count');
      if (pCount) pCount.textContent = '0';

      var cCount = doc.querySelector('#doc-char-count');
      if (cCount) cCount.textContent = '0';

      var fName = doc.querySelector('#doc-filename');
      if (fName) fName.textContent = 'document.pdf';

      var alertBox = doc.querySelector('#no-text-alert');
      if (alertBox) alertBox.style.display = 'none';

      return '<!DOCTYPE html>\n' + doc.outerHTML;
    }

    window.buildCleanHtmlCopy = buildCleanHtmlCopy;

    if (btnDownloadOffline) {
      btnDownloadOffline.addEventListener('click', function () {
        var cleanHtml = buildCleanHtmlCopy();
        downloadFile('pdf-text-search-offline.html', cleanHtml, 'text/html;charset=utf-8');
        showToast('已下載離線版工具');
      });
    }
  })();
  </script>
</body>
</html>
