<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Privacy Sanitizer — Day16</title>
  <style>
/* shared/base.css — 共用樣式基底 */
:root {
  --color-bg: #f7f7f8;
  --color-surface: #ffffff;
  --color-border: #d9d9de;
  --color-text: #1f2328;
  --color-text-muted: #6b7280;
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-danger: #dc2626;
  --color-toast-bg: #1f2328;
  --color-toast-text: #ffffff;
  --radius: 8px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans);
  color: var(--color-text);
  background: var(--color-bg);
  line-height: 1.6;
}

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px 16px;
}

h1, h2, h3 { line-height: 1.3; }

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 16px;
}

button, .btn {
  font-family: inherit;
  font-size: 0.95rem;
  padding: 8px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

button:hover, .btn:hover { background: var(--color-bg); }

button.primary, .btn.primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #ffffff;
}

button.primary:hover, .btn.primary:hover { background: var(--color-primary-hover); }

button:disabled, .btn:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.dropzone {
  border: 2px dashed var(--color-border);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  color: var(--color-text-muted);
  cursor: pointer;
  background: #ffffff;
}

.dropzone.dragover {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: #eff6ff;
}

.nav-back {
  display: inline-block;
  margin-bottom: 16px;
  color: var(--color-text-muted);
  text-decoration: none;
}

.nav-back:hover { text-decoration: underline; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 32px;
  transform: translateX(-50%);
  background: var(--color-toast-bg);
  color: var(--color-toast-text);
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 1000;
}

.toast.show { opacity: 1; }

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: center;
  background: #f8fafc;
  padding: 0.75rem;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
  margin-bottom: 1rem;
}
.tool-btn {
  padding: 0.4rem 0.8rem;
  font-size: 0.85rem;
  border: 1px solid #cbd5e1;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
}
.tool-btn.active {
  background: var(--color-primary);
  color: #fff;
  border-color: var(--color-primary);
}
.canvas-wrapper {
  position: relative;
  display: inline-block;
  max-width: 100%;
  overflow: auto;
  border: 1px solid var(--color-border);
  border-radius: 6px;
  background: #e2e8f0;
  user-select: none;
}
#work-canvas {
  display: block;
  max-width: 100%;
  height: auto;
  cursor: crosshair;
}
.selection-box {
  position: absolute;
  border: 2px dashed #2563eb;
  background: rgba(37, 99, 235, 0.15);
  pointer-events: none;
  display: none;
}
.btn-group {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin: 1rem 0;
}
.btn-sm {
  padding: 0.35rem 0.65rem;
  font-size: 0.8rem;
}
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-back">
      <a href="../index.html">← 回首頁</a>
    </nav>

    <header>
      <h1>截圖敏感資訊遮蔽 (Screenshot Sanitizer)</h1>
      <p class="subtitle" style="color: var(--color-text-muted);">
        框選敏感個資、帳號、密碼或 QR Code，直接抹寫底層像素（黑箱／馬賽克／模糊），並清除所有 EXIF Metadata。
      </p>
    </header>

    <div class="dropzone" id="drop-zone">
      <div style="font-size: 2rem; margin-bottom: 0.5rem;">✂️</div>
      <div style="margin-bottom: 0.75rem;">拖放 JPG / PNG / WebP 截圖至此，或點擊選取檔案</div>
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" style="display: none;">
      <div style="display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap;">
        <button type="button" class="btn secondary" id="btn-select-file">選擇圖片檔案</button>
        <button type="button" class="btn primary" id="btn-paste">📋 從剪貼簿貼上</button>
      </div>
    </div>

    <div id="editor-section" style="display: none; margin-top: 1.5rem;">
      <div class="toolbar">
        <div style="display: flex; gap: 0.25rem;">
          <button type="button" class="tool-btn active" data-tool="box" id="tool-box">⬛ 黑箱遮蔽</button>
          <button type="button" class="tool-btn" data-tool="pixelate" id="tool-pixelate">🧱 馬賽克 (Pixelate)</button>
          <button type="button" class="tool-btn" data-tool="blur" id="tool-blur">🌫️ 高斯模糊 (Blur)</button>
        </div>

        <div style="height: 24px; width: 1px; background: #cbd5e1; margin: 0 0.5rem;"></div>

        <div style="display: flex; gap: 0.25rem;">
          <button type="button" class="btn btn-sm secondary" id="btn-undo" disabled>↩ 復原 (Undo)</button>
          <button type="button" class="btn btn-sm secondary" id="btn-redo" disabled>↪ 重做 (Redo)</button>
        </div>

        <div style="height: 24px; width: 1px; background: #cbd5e1; margin: 0 0.5rem;"></div>

        <button type="button" class="btn btn-sm secondary" id="btn-toggle-view">👁️ 檢視原圖 (Before)</button>

        <div style="flex: 1;"></div>

        <button type="button" class="btn btn-sm primary" id="btn-export">💾 匯出安全截圖</button>
        <button type="button" class="btn btn-sm secondary" id="btn-copy-status">📋 複製摘要</button>
        <button type="button" class="btn btn-sm secondary" id="btn-reset">重置</button>
      </div>

      <div style="margin-bottom: 0.5rem; font-size: 0.85rem; color: #64748b;" id="editor-status-text">
        請在下方圖片上按住滑鼠左鍵並拖曳框選要遮蔽的區域。
      </div>

      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="work-canvas"></canvas>
        <div class="selection-box" id="selection-box"></div>
      </div>
    </div>

    <div class="btn-group" style="margin-top: 2rem; border-top: 1px solid #e2e8f0; padding-top: 1.5rem;">
      <button type="button" class="btn secondary" id="btn-download-offline">💾 下載本工具離線版</button>
    </div>

    <!--{{LICENSES}}-->
  </div>

  <!--{{SHARED:util-escape}}-->
  <!--{{SHARED:ui-toast}}-->
  <!--{{SHARED:ui-debounce}}-->
  <!--{{SHARED:io-download}}-->
  <!--{{SHARED:io-clipboard}}-->
  <!--{{SHARED:io-dropzone}}-->
  <!--{{SHARED:img-file-size}}-->
  <!--{{SHARED:img-exif}}-->
  <!--{{SHARED:img-decode}}-->
  <!--{{SHARED:img-canvas}}-->

  <script>
  (function () {
    var state = {
      file: null,
      fileName: 'screenshot.png',
      cleanCanvas: null, // Readonly baseline canvas
      maskOps: [], // Array<{ type: 'box'|'pixelate'|'blur', x, y, w, h }>
      redoStack: [],
      currentTool: 'box', // 'box' | 'pixelate' | 'blur'
      isBeforeView: false,
      isDragging: false,
      startX: 0,
      startY: 0
    };

    var dropZone = document.getElementById('drop-zone');
    var fileInput = document.getElementById('file-input');
    var btnSelectFile = document.getElementById('btn-select-file');
    var btnPaste = document.getElementById('btn-paste');
    var editorSection = document.getElementById('editor-section');
    var canvasWrapper = document.getElementById('canvas-wrapper');
    var workCanvas = document.getElementById('work-canvas');
    var selectionBox = document.getElementById('selection-box');
    var workCtx = workCanvas ? workCanvas.getContext('2d') : null;

    var toolBox = document.getElementById('tool-box');
    var toolPixelate = document.getElementById('tool-pixelate');
    var toolBlur = document.getElementById('tool-blur');
    var btnUndo = document.getElementById('btn-undo');
    var btnRedo = document.getElementById('btn-redo');
    var btnToggleView = document.getElementById('btn-toggle-view');
    var btnExport = document.getElementById('btn-export');
    var btnCopyStatus = document.getElementById('btn-copy-status');
    var btnReset = document.getElementById('btn-reset');
    var btnDownloadOffline = document.getElementById('btn-download-offline');
    var editorStatusText = document.getElementById('editor-status-text');

    function applyPixelate(ctx, x, y, w, h, blockSize) {
      if (w <= 0 || h <= 0) return;
      blockSize = blockSize || 10;
      var imgData = ctx.getImageData(x, y, w, h);
      var data = imgData.data;

      for (var by = 0; by < h; by += blockSize) {
        for (var bx = 0; bx < w; bx += blockSize) {
          var curW = Math.min(blockSize, w - bx);
          var curH = Math.min(blockSize, h - by);
          var sumR = 0, sumG = 0, sumB = 0, count = 0;

          for (var py = 0; py < curH; py++) {
            for (var px = 0; px < curW; px++) {
              var idx = ((by + py) * w + (bx + px)) * 4;
              sumR += data[idx];
              sumG += data[idx + 1];
              sumB += data[idx + 2];
              count++;
            }
          }

          var avgR = Math.round(sumR / count);
          var avgG = Math.round(sumG / count);
          var avgB = Math.round(sumB / count);

          for (var rpy = 0; rpy < curH; rpy++) {
            for (var rpx = 0; rpx < curW; rpx++) {
              var ridx = ((by + rpy) * w + (bx + rpx)) * 4;
              data[ridx] = avgR;
              data[ridx + 1] = avgG;
              data[ridx + 2] = avgB;
              data[ridx + 3] = 255;
            }
          }
        }
      }

      ctx.putImageData(imgData, x, y);
    }

    function applyBlur(ctx, x, y, w, h, radius) {
      if (w <= 0 || h <= 0) return;
      radius = radius || 4;
      var imgData = ctx.getImageData(x, y, w, h);
      var srcData = imgData.data;
      var outBuffer = new Uint8ClampedArray(srcData.length);

      for (var py = 0; py < h; py++) {
        for (var px = 0; px < w; px++) {
          var sumR = 0, sumG = 0, sumB = 0, count = 0;
          for (var dy = -radius; dy <= radius; dy++) {
            var sy = Math.min(Math.max(py + dy, 0), h - 1);
            for (var dx = -radius; dx <= radius; dx++) {
              var sx = Math.min(Math.max(px + dx, 0), w - 1);
              var sidx = (sy * w + sx) * 4;
              sumR += srcData[sidx];
              sumG += srcData[sidx + 1];
              sumB += srcData[sidx + 2];
              count++;
            }
          }
          var outIdx = (py * w + px) * 4;
          outBuffer[outIdx] = Math.round(sumR / count);
          outBuffer[outIdx + 1] = Math.round(sumG / count);
          outBuffer[outIdx + 2] = Math.round(sumB / count);
          outBuffer[outIdx + 3] = srcData[outIdx + 3];
        }
      }

      imgData.data.set(outBuffer);
      ctx.putImageData(imgData, x, y);
    }

    function redrawFromOps() {
      if (!state.cleanCanvas || !workCanvas || !workCtx) return;

      workCtx.clearRect(0, 0, workCanvas.width, workCanvas.height);

      if (state.isBeforeView) {
        workCtx.drawImage(state.cleanCanvas, 0, 0);
        if (btnUndo) btnUndo.disabled = true;
        if (btnRedo) btnRedo.disabled = true;
        if (btnExport) btnExport.disabled = true;
        if (editorStatusText) editorStatusText.textContent = '【目前為 Before 原圖檢視模式】（已暫時鎖定匯出，切回 After 即可匯出遮蔽結果）';
        return;
      }

      workCtx.drawImage(state.cleanCanvas, 0, 0);

      state.maskOps.forEach(function (op) {
        var rx = Math.round(op.x);
        var ry = Math.round(op.y);
        var rw = Math.round(op.w);
        var rh = Math.round(op.h);

        if (op.type === 'box') {
          workCtx.fillStyle = '#000000';
          workCtx.fillRect(rx, ry, rw, rh);
        } else if (op.type === 'pixelate') {
          applyPixelate(workCtx, rx, ry, rw, rh, 10);
        } else if (op.type === 'blur') {
          applyBlur(workCtx, rx, ry, rw, rh, 4);
        }
      });

      if (btnUndo) btnUndo.disabled = (state.maskOps.length === 0);
      if (btnRedo) btnRedo.disabled = (state.redoStack.length === 0);
      if (btnExport) btnExport.disabled = false;
      if (editorStatusText) editorStatusText.textContent = '已套用 ' + state.maskOps.length + ' 個遮蔽區域。拖曳滑鼠可新增遮蔽。';
    }

    function loadCleanImage(fileOrBlob, fileName) {
      var gate = checkImageFileSize(fileOrBlob.size);
      if (!gate.ok) {
        showToast(gate.message, 3000);
        return;
      } else if (gate.level === 'warn') {
        showToast(gate.message, 2500);
      }

      loadImageFile(fileOrBlob).then(function (res) {
        state.file = fileOrBlob;
        state.fileName = fileName || 'screenshot.png';
        state.cleanCanvas = res.canvas;
        state.maskOps = [];
        state.redoStack = [];
        state.isBeforeView = false;

        workCanvas.width = res.canvas.width;
        workCanvas.height = res.canvas.height;

        if (editorSection) editorSection.style.display = 'block';
        if (dropZone) dropZone.style.display = 'none';

        redrawFromOps();
        showToast('圖片載入成功！');
      }).catch(function (err) {
        showToast('載入圖片失敗：' + (err.message || '未知錯誤'));
      });
    }

    if (btnSelectFile && fileInput) {
      btnSelectFile.addEventListener('click', function () {
        fileInput.click();
      });
      fileInput.addEventListener('change', function () {
        if (fileInput.files && fileInput.files[0]) {
          loadCleanImage(fileInput.files[0], fileInput.files[0].name);
          fileInput.value = '';
        }
      });
    }

    if (dropZone) {
      setupDropZone(dropZone, function (result, fileName) {}, {
        accept: ['.jpg', '.jpeg', '.png', '.webp'],
        gate: function (file) { return checkImageFileSize(file.size); },
        onError: function (msg) { showToast(msg); }
      });

      dropZone.addEventListener('drop', function (e) {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          loadCleanImage(e.dataTransfer.files[0], e.dataTransfer.files[0].name);
        }
      });
    }

    if (btnPaste) {
      btnPaste.addEventListener('click', function () {
        pasteImageFromClipboard().then(function (blob) {
          if (!blob) {
            showToast('剪貼簿沒有圖片內容');
            return;
          }
          loadCleanImage(blob, 'pasted_screenshot.png');
        });
      });
    }

    function setTool(toolName) {
      state.currentTool = toolName;
      [toolBox, toolPixelate, toolBlur].forEach(function (btn) {
        if (btn) {
          if (btn.getAttribute('data-tool') === toolName) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        }
      });
    }

    if (toolBox) toolBox.addEventListener('click', function () { setTool('box'); });
    if (toolPixelate) toolPixelate.addEventListener('click', function () { setTool('pixelate'); });
    if (toolBlur) toolBlur.addEventListener('click', function () { setTool('blur'); });

    if (btnUndo) {
      btnUndo.addEventListener('click', function () {
        if (state.maskOps.length > 0) {
          state.redoStack.push(state.maskOps.pop());
          redrawFromOps();
          showToast('已復原上一個遮蔽');
        }
      });
    }

    if (btnRedo) {
      btnRedo.addEventListener('click', function () {
        if (state.redoStack.length > 0) {
          state.maskOps.push(state.redoStack.pop());
          redrawFromOps();
          showToast('已重做遮蔽');
        }
      });
    }

    if (btnToggleView) {
      btnToggleView.addEventListener('click', function () {
        state.isBeforeView = !state.isBeforeView;
        btnToggleView.textContent = state.isBeforeView ? '👁️ 切換回遮蔽 (After)' : '👁️ 檢視原圖 (Before)';
        redrawFromOps();
      });
    }

    if (workCanvas) {
      workCanvas.addEventListener('mousedown', function (e) {
        if (!state.cleanCanvas || state.isBeforeView) return;
        state.isDragging = true;
        var rect = workCanvas.getBoundingClientRect();
        state.startX = e.clientX - rect.left;
        state.startY = e.clientY - rect.top;

        if (selectionBox) {
          selectionBox.style.left = state.startX + 'px';
          selectionBox.style.top = state.startY + 'px';
          selectionBox.style.width = '0px';
          selectionBox.style.height = '0px';
          selectionBox.style.display = 'block';
        }
      });

      window.addEventListener('mousemove', function (e) {
        if (!state.isDragging || !workCanvas) return;
        var rect = workCanvas.getBoundingClientRect();
        var curX = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
        var curY = Math.min(Math.max(e.clientY - rect.top, 0), rect.height);

        var boxX = Math.min(state.startX, curX);
        var boxY = Math.min(state.startY, curY);
        var boxW = Math.abs(curX - state.startX);
        var boxH = Math.abs(curY - state.startY);

        if (selectionBox) {
          selectionBox.style.left = boxX + 'px';
          selectionBox.style.top = boxY + 'px';
          selectionBox.style.width = boxW + 'px';
          selectionBox.style.height = boxH + 'px';
        }
      });

      window.addEventListener('mouseup', function (e) {
        if (!state.isDragging || !workCanvas) return;
        state.isDragging = false;
        if (selectionBox) selectionBox.style.display = 'none';

        var rect = workCanvas.getBoundingClientRect();
        var curX = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
        var curY = Math.min(Math.max(e.clientY - rect.top, 0), rect.height);

        var cssX = Math.min(state.startX, curX);
        var cssY = Math.min(state.startY, curY);
        var cssW = Math.abs(curX - state.startX);
        var cssH = Math.abs(curY - state.startY);

        if (cssW < 4 || cssH < 4) return; // Ignore tiny accidental clicks

        var scaleX = workCanvas.width / rect.width;
        var scaleY = workCanvas.height / rect.height;

        var actualX = cssX * scaleX;
        var actualY = cssY * scaleY;
        var actualW = cssW * scaleX;
        var actualH = cssH * scaleY;

        state.maskOps.push({
          type: state.currentTool,
          x: actualX,
          y: actualY,
          w: actualW,
          h: actualH
        });
        state.redoStack = [];

        redrawFromOps();
      });
    }

    if (btnExport) {
      btnExport.addEventListener('click', function () {
        if (!workCanvas || !state.cleanCanvas || state.isBeforeView) return;

        var mime = (state.file && state.file.type) ? state.file.type : 'image/png';
        if (mime !== 'image/jpeg' && mime !== 'image/webp') mime = 'image/png';

        canvasToBlob(workCanvas, mime, 0.95).then(function (blob) {
          var reader = new FileReader();
          reader.onload = function () {
            var rawBuf = reader.result;
            var cleanBuf = stripMetadataSegments(rawBuf);
            var cleanBlob = new Blob([cleanBuf], { type: mime });

            var dot = state.fileName.lastIndexOf('.');
            var base = (dot !== -1) ? state.fileName.substring(0, dot) : state.fileName;
            var ext = (dot !== -1) ? state.fileName.substring(dot) : ((mime === 'image/jpeg') ? '.jpg' : '.png');
            var outName = base + '_sanitized' + ext;

            downloadFile(outName, cleanBlob, mime);
            showToast('已匯出遮蔽後安全圖片（已清除 Metadata）');
          };
          reader.readAsArrayBuffer(blob);
        });
      });
    }

    if (btnCopyStatus) {
      btnCopyStatus.addEventListener('click', function () {
        var boxCount = state.maskOps.filter(function (o) { return o.type === 'box'; }).length;
        var pixCount = state.maskOps.filter(function (o) { return o.type === 'pixelate'; }).length;
        var blurCount = state.maskOps.filter(function (o) { return o.type === 'blur'; }).length;

        var text = '【截圖敏感資訊遮蔽報告】\n' +
                   '檔案名稱：' + state.fileName + '\n' +
                   '總遮蔽區域：' + state.maskOps.length + ' 處\n' +
                   '- 黑箱遮蔽：' + boxCount + ' 處\n' +
                   '- 馬賽克：' + pixCount + ' 處\n' +
                   '- 模糊處理：' + blurCount + ' 處\n' +
                   '狀態：已寫入底層像素並抹除 EXIF/XMP Metadata\n';

        copyToClipboard(text).then(function () {
          showToast('已複製處理摘要');
        });
      });
    }

    if (btnReset) {
      btnReset.addEventListener('click', function () {
        state.file = null;
        state.cleanCanvas = null;
        state.maskOps = [];
        state.redoStack = [];
        state.isBeforeView = false;
        if (workCtx && workCanvas) {
          workCtx.clearRect(0, 0, workCanvas.width, workCanvas.height);
          workCanvas.width = 0;
          workCanvas.height = 0;
        }
        if (editorSection) editorSection.style.display = 'none';
        if (dropZone) dropZone.style.display = 'block';
        showToast('已重置工作台');
      });
    }

    function buildCleanHtmlCopy() {
      var doc = document.documentElement.cloneNode(true);

      var toast = doc.querySelector('#__shared_toast');
      if (toast) toast.remove();

      var navBack = doc.querySelector('.nav-back');
      if (navBack) navBack.remove();

      var offlineBtn = doc.querySelector('#btn-download-offline');
      if (offlineBtn) offlineBtn.remove();

      var edSection = doc.querySelector('#editor-section');
      if (edSection) edSection.style.display = 'none';

      var dZone = doc.querySelector('#drop-zone');
      if (dZone) dZone.style.display = 'block';

      var c = doc.querySelector('#work-canvas');
      if (c) {
        c.width = 0;
        c.height = 0;
      }

      return '<!DOCTYPE html>\n' + doc.outerHTML;
    }

    window.buildCleanHtmlCopy = buildCleanHtmlCopy;

    if (btnDownloadOffline) {
      btnDownloadOffline.addEventListener('click', function () {
        var cleanHtml = buildCleanHtmlCopy();
        downloadFile('screenshot-sanitizer-offline.html', cleanHtml, 'text/html;charset=utf-8');
        showToast('已下載離線版工具');
      });
    }
  })();
  </script>
</body>
</html>
