// shared/util-escape.js
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function showToast(msg, ms) {
  if (ms === undefined) ms = 2000;
  var el = document.getElementById('__shared_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '__shared_toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  if (el.__hideTimer) {
    clearTimeout(el.__hideTimer);
  }
  el.__hideTimer = setTimeout(function () {
    el.classList.remove('show');
  }, ms);
}

// shared/ui-debounce.js
function debounce(fn, ms) {
  if (ms === undefined) ms = 150;
  var timer = null;
  return function () {
    var args = arguments;
    var ctx = this;
    if (timer) {
      clearTimeout(timer);
    }
    timer = setTimeout(function () {
      fn.apply(ctx, args);
    }, ms);
  };
}

</script>

// shared/io-download.js
function downloadFile(filename, content, mime) {
  if (mime === undefined) mime = 'text/plain;charset=utf-8';
  var blob = new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () {
    URL.revokeObjectURL(url);
  }, 0);
}

// shared/io-clipboard.js
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () {
      return true;
    }).catch(function () {
      return false;
    });
  }
  return new Promise(function (resolve) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    var ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(textarea);
    resolve(ok);
  });
}

function pasteImageFromClipboard() {
  if (!navigator.clipboard || !navigator.clipboard.read) {
    return Promise.resolve(null);
  }
  return navigator.clipboard.read().then(function (items) {
    if (!items || items.length === 0) return null;
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      if (item && item.types) {
        for (var t = 0; t < item.types.length; t++) {
          if (item.types[t].indexOf('image/') === 0) {
            return item.getType(item.types[t]);
          }
        }
      }
    }
    return null;
  }).catch(function () {
    return null;
  });
}

// shared/io-dropzone.js
function ioDropzoneHandleFile(file, onData, opts) {
  opts = opts || {};
  // 預設只收 .txt / .md（契約第 3 節）。不要改成 [] ——那會變成靜默全收。
  var accept = opts.accept || ['.txt', '.md'];
  var onError = opts.onError || function () {};

  function isAccepted(fileName) {
    if (accept.length === 0) return true;
    var lower = fileName.toLowerCase();
    for (var i = 0; i < accept.length; i++) {
      if (lower.indexOf(accept[i].toLowerCase(), lower.length - accept[i].length) !== -1) {
        return true;
      }
    }
    return false;
  }

  if (!isAccepted(file.name)) {
    onError('不支援的檔案類型：' + file.name);
    return;
  }

  if (opts.gate) {
    var gateResult = opts.gate(file);
    if (!gateResult.ok) {
      onError(gateResult.message);
      return;
    }
  }

  var reader = new FileReader();
  reader.onload = function () {
    onData(reader.result, file.name);
  };
  reader.onerror = function () {
    onError('讀取檔案失敗：' + file.name);
  };
  if (opts.mode === 'bytes') {
    reader.readAsArrayBuffer(file);
  } else {
    reader.readAsText(file);
  }
}

function setupDropZone(dropEl, onData, opts) {
  opts = opts || {};

  dropEl.addEventListener('dragover', function (e) {
    e.preventDefault();
    dropEl.classList.add('dragover');
  });

  dropEl.addEventListener('dragleave', function () {
    dropEl.classList.remove('dragover');
  });

  dropEl.addEventListener('drop', function (e) {
    e.preventDefault();
    dropEl.classList.remove('dragover');
    var files = e.dataTransfer.files;
    if (!files || files.length === 0) return;

    if (opts.multiple === true) {
      if (opts.gateBatch) {
        var batchResult = opts.gateBatch(files);
        if (!batchResult.ok) {
          (opts.onError || function () {})(batchResult.message);
          return;
        }
      }
      var total = files.length;
      for (var i = 0; i < total; i++) {
        (function (idx) {
          var meta = { index: idx, total: total };
          var wrappedOnData = function (result, fileName) {
            onData(result, fileName, meta);
          };
          ioDropzoneHandleFile(files[idx], wrappedOnData, opts);
        })(i);
      }
    } else {
      ioDropzoneHandleFile(files[0], onData, opts);
    }
  });
}

function setupFilePicker(inputEl, onData, opts) {
  opts = opts || {};

  inputEl.addEventListener('change', function () {
    var files = inputEl.files;
    if (!files || files.length === 0) return;

    if (opts.multiple === true) {
      if (opts.gateBatch) {
        var batchResult = opts.gateBatch(files);
        if (!batchResult.ok) {
          (opts.onError || function () {})(batchResult.message);
          return;
        }
      }
      var total = files.length;
      for (var i = 0; i < total; i++) {
        (function (idx) {
          var meta = { index: idx, total: total };
          var wrappedOnData = function (result, fileName) {
            onData(result, fileName, meta);
          };
          ioDropzoneHandleFile(files[idx], wrappedOnData, opts);
        })(i);
      }
    } else {
      ioDropzoneHandleFile(files[0], onData, opts);
    }
  });
}

// shared/img-file-size.js

function checkImageFileSize(byteLength) {
  var bytes = Number(byteLength) || 0;
  var MB = 1024 * 1024;

  if (bytes <= 30 * MB) {
    return {
      ok: true,
      level: 'ok',
      message: '檔案大小正常'
    };
  } else if (bytes <= 80 * MB) {
    return {
      ok: true,
      level: 'warn',
      message: '檔案較大（' + (bytes / MB).toFixed(1) + 'MB），處理可能需要數秒'
    };
  } else {
    return {
      ok: false,
      level: 'reject',
      message: '檔案超過 80MB 上限（' + (bytes / MB).toFixed(1) + 'MB），已拒絕載入'
    };
  }
}

function checkBatchSize(totalByteLength, fileCount) {
  var bytes = Number(totalByteLength) || 0;
  var count = Number(fileCount) || 0;
  var MB = 1024 * 1024;

  if (bytes <= 200 * MB) {
    return {
      ok: true,
      level: 'ok',
      message: '批次大小正常（共 ' + count + ' 檔，' + (bytes / MB).toFixed(1) + 'MB）'
    };
  } else if (bytes <= 500 * MB) {
    return {
      ok: true,
      level: 'warn',
      message: '批次較大（共 ' + count + ' 檔，' + (bytes / MB).toFixed(1) + 'MB），批次處理可能需要較長時間'
    };
  } else {
    return {
      ok: false,
      level: 'reject',
      message: '批次總量超過 500MB 上限（' + (bytes / MB).toFixed(1) + 'MB），已拒絕整批載入'
    };
  }
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    checkImageFileSize: checkImageFileSize,
    checkBatchSize: checkBatchSize
  };
}

// shared/img-exif.js

// 共用的 TIFF/EXIF IFD 解析器：輸入一段從 TIFF byte-order marker 開始的 DataView
// （不論這段資料原本是嵌在 JPEG 的 APP1、PNG 的 eXIf chunk、還是 WebP 的 EXIF chunk），
// 解析出 IFD0／Exif SubIFD／GPS IFD 三張表，回傳跟 readExifTags() 同樣形狀的欄位。
// 錯誤不外拋，回傳目前已解析到的部分結果（container 格式各自的呼叫端沿用這個容錯行為）。
function _parseTiffTags(view) {
  var result = {
    orientation: null,
    dateTimeOriginal: null,
    make: null,
    model: null,
    gpsLatitude: null,
    gpsLongitude: null,
    hasGPS: false
  };

  try {
    var tiffLen = view.byteLength;
    if (tiffLen < 8) return result;

    var byteOrder = view.getUint16(0, false);
    var littleEndian = false;
    if (byteOrder === 0x4949) {
      littleEndian = true;
    } else if (byteOrder === 0x4D4D) {
      littleEndian = false;
    } else {
      return result;
    }

    if (view.getUint16(2, littleEndian) !== 0x002A) {
      return result;
    }

    var ifd0Offset = view.getUint32(4, littleEndian);
    if (ifd0Offset >= tiffLen) return result;

    function getStringValue(offsetVal, count) {
      var str = '';
      for (var i = 0; i < count; i++) {
        if (offsetVal + i >= tiffLen) break;
        var code = view.getUint8(offsetVal + i);
        if (code === 0) break; // null-terminated
        str += String.fromCharCode(code);
      }
      return str.trim();
    }

    function getRationalValue(offsetVal) {
      if (offsetVal + 8 > tiffLen) return 0;
      var num = view.getUint32(offsetVal, littleEndian);
      var den = view.getUint32(offsetVal + 4, littleEndian);
      if (den === 0) return 0;
      return num / den;
    }

    var exifSubIFDOffset = null;
    var gpsIFDOffset = null;

    // Read IFD0
    if (ifd0Offset + 2 <= tiffLen) {
      var numEntries0 = view.getUint16(ifd0Offset, littleEndian);
      var entryOffset = ifd0Offset + 2;

      for (var e = 0; e < numEntries0 && entryOffset + 12 <= tiffLen; e++, entryOffset += 12) {
        var tag = view.getUint16(entryOffset, littleEndian);
        var count = view.getUint32(entryOffset + 4, littleEndian);
        var valOrOffset = entryOffset + 8;
        var valOffset = view.getUint32(valOrOffset, littleEndian);

        if (tag === 0x0112) { // Orientation
          result.orientation = view.getUint16(valOrOffset, littleEndian);
        } else if (tag === 0x010F) { // Make
          var strOffset = (count <= 4) ? valOrOffset : valOffset;
          result.make = getStringValue(strOffset, count);
        } else if (tag === 0x0110) { // Model
          var strOffset = (count <= 4) ? valOrOffset : valOffset;
          result.model = getStringValue(strOffset, count);
        } else if (tag === 0x8769) { // ExifIFDPointer
          exifSubIFDOffset = valOffset;
        } else if (tag === 0x8825) { // GPSInfoIFDPointer
          gpsIFDOffset = valOffset;
        }
      }
    }

    // Read Exif SubIFD
    if (exifSubIFDOffset !== null && exifSubIFDOffset + 2 <= tiffLen) {
      var numSubEntries = view.getUint16(exifSubIFDOffset, littleEndian);
      var subEntryOffset = exifSubIFDOffset + 2;

      for (var se = 0; se < numSubEntries && subEntryOffset + 12 <= tiffLen; se++, subEntryOffset += 12) {
        var subTag = view.getUint16(subEntryOffset, littleEndian);
        var subCount = view.getUint32(subEntryOffset + 4, littleEndian);
        var subValOrOffset = subEntryOffset + 8;
        var subValOffset = view.getUint32(subValOrOffset, littleEndian);

        if (subTag === 0x9003) { // DateTimeOriginal
          var dateOffset = (subCount <= 4) ? subValOrOffset : subValOffset;
          result.dateTimeOriginal = getStringValue(dateOffset, subCount);
        }
      }
    }

    // Read GPS IFD
    if (gpsIFDOffset !== null && gpsIFDOffset + 2 <= tiffLen) {
      var numGpsEntries = view.getUint16(gpsIFDOffset, littleEndian);
      var gpsEntryOffset = gpsIFDOffset + 2;

      var latRef = null;
      var latDeg = null, latMin = null, latSec = null;
      var lonRef = null;
      var lonDeg = null, lonMin = null, lonSec = null;

      for (var ge = 0; ge < numGpsEntries && gpsEntryOffset + 12 <= tiffLen; ge++, gpsEntryOffset += 12) {
        var gTag = view.getUint16(gpsEntryOffset, littleEndian);
        var gCount = view.getUint32(gpsEntryOffset + 4, littleEndian);
        var gValOrOffset = gpsEntryOffset + 8;
        var gValOffset = view.getUint32(gValOrOffset, littleEndian);

        if (gTag === 0x0001) { // GPSLatitudeRef ('N' or 'S')
          latRef = String.fromCharCode(view.getUint8(gValOrOffset)).toUpperCase();
        } else if (gTag === 0x0002 && gCount === 3) { // GPSLatitude (3 rationals)
          var ratOffset = gValOffset;
          latDeg = getRationalValue(ratOffset);
          latMin = getRationalValue(ratOffset + 8);
          latSec = getRationalValue(ratOffset + 16);
        } else if (gTag === 0x0003) { // GPSLongitudeRef ('E' or 'W')
          lonRef = String.fromCharCode(view.getUint8(gValOrOffset)).toUpperCase();
        } else if (gTag === 0x0004 && gCount === 3) { // GPSLongitude (3 rationals)
          var ratOffsetLon = gValOffset;
          lonDeg = getRationalValue(ratOffsetLon);
          lonMin = getRationalValue(ratOffsetLon + 8);
          lonSec = getRationalValue(ratOffsetLon + 16);

    var currentCanvas = canvas;
    var dimensionRounds = 0;
    var maxDimensionRounds = 3;
    var totalIterations = 0;
    var bestBlob = null;
    var bestQuality = 0.5;

            var outName = base + '_sanitized' + ext;

            downloadFile(outName, cleanBlob, mime);
            showToast('已匯出遮蔽後安全圖片（已清除 Metadata）');
          };
          reader.readAsArrayBuffer(blob);
        });
      });
    }

    if (btnCopyStatus) {
      btnCopyStatus.addEventListener('click', function () {
        var boxCount = state.maskOps.filter(function (o) { return o.type === 'box'; }).length;
        var pixCount = state.maskOps.filter(function (o) { return o.type === 'pixelate'; }).length;
        var blurCount = state.maskOps.filter(function (o) { return o.type === 'blur'; }).length;

        var text = '【截圖敏感資訊遮蔽報告】\n' +
                   '檔案名稱：' + state.fileName + '\n' +
                   '總遮蔽區域：' + state.maskOps.length + ' 處\n' +
                   '- 黑箱遮蔽：' + boxCount + ' 處\n' +
                   '- 馬賽克：' + pixCount + ' 處\n' +
                   '- 模糊處理：' + blurCount + ' 處\n' +
                   '狀態：已寫入底層像素並抹除 EXIF/XMP Metadata\n';

        copyToClipboard(text).then(function () {
          showToast('已複製處理摘要');
        });
      });
    }

    if (btnReset) {
      btnReset.addEventListener('click', function () {
        state.file = null;
        state.cleanCanvas = null;
        state.maskOps = [];
        state.redoStack = [];
        state.isBeforeView = false;
        if (workCtx && workCanvas) {
          workCtx.clearRect(0, 0, workCanvas.width, workCanvas.height);
          workCanvas.width = 0;
          workCanvas.height = 0;
        }
        if (editorSection) editorSection.style.display = 'none';
        if (dropZone) dropZone.style.display = 'block';
        showToast('已重置工作台');
      });
    }

    function buildCleanHtmlCopy() {
      var doc = document.documentElement.cloneNode(true);

      var toast = doc.querySelector('#__shared_toast');
      if (toast) toast.remove();

      var navBack = doc.querySelector('.nav-back');
      if (navBack) navBack.remove();

      var offlineBtn = doc.querySelector('#btn-download-offline');
      if (offlineBtn) offlineBtn.remove();

      var edSection = doc.querySelector('#editor-section');
      if (edSection) edSection.style.display = 'none';

      var dZone = doc.querySelector('#drop-zone');
      if (dZone) dZone.style.display = 'block';

      var c = doc.querySelector('#work-canvas');
      if (c) {
        c.width = 0;
        c.height = 0;
      }

      return '<!DOCTYPE html>\n' + doc.outerHTML;
    }

    window.buildCleanHtmlCopy = buildCleanHtmlCopy;

    if (btnDownloadOffline) {
      btnDownloadOffline.addEventListener('click', function () {
        var cleanHtml = buildCleanHtmlCopy();
        downloadFile('screenshot-sanitizer-offline.html', cleanHtml, 'text/html;charset=utf-8');
        showToast('已下載離線版工具');
      });
    }
  })();
  </script>
</body>
</html>
