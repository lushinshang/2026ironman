<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字差異比對器</title>
<style>
  :root{
    --bg:#f9f7f4;
    --text:#1a1a1a;
    --muted:#6b6459;
    --accent:#9a5b3c;
    --card:#ffffff;
    --border:#e6e1d8;
    --danger:#c0392b;
    --warn-bg:#fdf3e7;
    --warn-border:#e8c99a;
    --add-bg:#eaf5e6;
    --add-border:#b7dba9;
    --del-bg:#fbe9e7;
    --del-border:#e6b3ac;
    --mod-bg:#fdf3e0;
    --mod-border:#e8c99a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:16px;
    line-height:1.6;
  }
  header{
    max-width:1120px;
    margin:0 auto;
    padding:32px 24px 8px;
  }
  h1{
    font-size:clamp(1.5rem,3.2vw,2rem);
    margin:0 0 4px;
  }
  header p{
    color:var(--muted);
    font-size:14px;
    margin:0;
  }
  main{
    max-width:1120px;
    margin:0 auto;
    padding:16px 24px 60px;
    display:grid;
    grid-template-columns:1fr;
    gap:24px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
  }
  .nav-back{
    max-width:1120px;
    margin:0 auto;
    padding:16px 24px 0;
    font-size:14px;
  }
  .nav-back a{
    color:var(--accent);
    text-decoration:none;
  }
  .nav-back a:hover{text-decoration:underline;}
  .hidden{display:none !important;}
  .input-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
  }
  @media (max-width:720px){
    .input-grid{grid-template-columns:1fr;}
  }
  .input-col h2{
    font-size:15px;
    margin:0 0 10px;
    color:var(--text);
  }
  .input-col.dragover{
    border-color:var(--accent);
    background:#fbf3ec;
  }
  textarea.input-area{
    width:100%;
    min-height:280px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
    font-size:14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    line-height:1.7;
    color:var(--text);
    background:#fffdfa;
  }
  .file-hint{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }
  .file-name{
    font-size:13px;
    color:var(--accent);
    margin-top:4px;
    min-height:18px;
  }
  .btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:4px;
  }
  button{
    font-family:inherit;
    font-size:14px;
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    cursor:pointer;
  }
  button:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  button.primary{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  button.primary:hover:not(:disabled){opacity:.9; color:#fff;}
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    font-size:13px;
    color:var(--muted);
  }
  .stats{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:12px;
    font-size:14px;
  }
  .stats .stat-item b{font-size:16px;}
  .stats .stat-item.added b{color:#3d7a2a;}
  .stats .stat-item.removed b{color:var(--danger);}
  .stats .stat-item.modified b{color:#a06a1e;}
  .stats .stat-item.unchanged b{color:var(--muted);}
  .legend-item{display:flex; align-items:center; gap:6px;}
  .legend-swatch{
    width:14px;
    height:14px;
    border-radius:4px;
    border:1px solid var(--border);
    display:inline-block;
  }
  .legend-swatch.added{background:var(--add-bg); border-color:var(--add-border);}
  .legend-swatch.removed{background:var(--del-bg); border-color:var(--del-border);}
  .legend-swatch.modified{background:var(--mod-bg); border-color:var(--mod-border);}
  .diff-rows{
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
  }
  .diff-row{
    display:grid;
    grid-template-columns:1fr 1fr;
  }
  #diff-rows > * + *{border-top:1px solid var(--border);}
  .fold-detail > .diff-row + .diff-row{border-top:1px solid var(--border);}
  .fold-summary{
    display:block;
    width:100%;
    text-align:left;
    padding:8px 14px;
    font-size:13px;
    color:var(--muted);
    background:#f3efe8;
    border:none;
    border-radius:0;
    cursor:pointer;
    font-family:inherit;
  }
  .fold-summary:hover{color:var(--accent);}
  .diff-cell{
    padding:8px 14px;
    font-size:14px;
    line-height:1.7;
    word-break:break-word;
  }
  .diff-cell.old{border-right:1px solid var(--border);}
  .diff-cell.empty{color:var(--muted);}
  .diff-row.type-added .diff-cell.new{background:var(--add-bg);}
  .diff-row.type-removed .diff-cell.old{background:var(--del-bg);}
  .diff-row.type-modified .diff-cell.old{background:var(--mod-bg);}
  .diff-row.type-modified .diff-cell.new{background:var(--mod-bg);}
  .diff-cell .char-del{background:var(--del-border); text-decoration:line-through; text-decoration-color:var(--danger);}
  .diff-cell .char-add{background:var(--add-border); font-weight:600;}
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#1a1a1a;
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="nav-back"><a href="../index.html">← 返回 Vibe Coding 100 題清單</a></div>

<header>
  <h1>文字差異比對器</h1>
  <p>貼上或拖曳新舊兩版文字，逐句比對差異，方便比對合約改版或公文修訂內容。所有比對都在瀏覽器本機完成，不上傳任何內容。</p>
</header>

<main>
  <section class="input-grid">
    <div class="card input-col" id="col-old">
      <h2>舊版</h2>
      <textarea class="input-area" id="text-old" placeholder="貼上舊版文字，或把 .txt/.md 檔案拖曳到這裡"></textarea>
      <div class="file-hint">支援直接拖曳單一 .txt 或 .md 檔案自動帶入內容</div>
      <div class="file-name" id="file-name-old"></div>
    </div>
    <div class="card input-col" id="col-new">
      <h2>新版</h2>
      <textarea class="input-area" id="text-new" placeholder="貼上新版文字，或把 .txt/.md 檔案拖曳到這裡"></textarea>
      <div class="file-hint">支援直接拖曳單一 .txt 或 .md 檔案自動帶入內容</div>
      <div class="file-name" id="file-name-new"></div>
    </div>
  </section>

  <section class="btn-row">
    <button type="button" id="btn-compare" class="primary">開始比對</button>
    <button type="button" id="btn-download-tool">下載本工具（離線使用）</button>
  </section>

  <section class="card hidden" id="result-section">
    <div class="stats" id="diff-stats"></div>
    <div class="legend">
      <span class="legend-item"><span class="legend-swatch added"></span>新增</span>
      <span class="legend-item"><span class="legend-swatch removed"></span>刪除</span>
      <span class="legend-item"><span class="legend-swatch modified"></span>修改</span>
    </div>
    <div class="btn-row" style="margin-top:8px;">
      <button type="button" id="btn-expand-all">全部展開</button>
      <button type="button" id="btn-collapse-all">全部收合</button>
    </div>
    <div class="diff-rows" id="diff-rows" style="margin-top:12px;"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button type="button" id="btn-copy-summary">複製摘要</button>
      <button type="button" id="btn-download-report" class="primary">下載差異報告 MD</button>
      <button type="button" id="btn-download-html" class="primary">下載差異報告 HTML</button>
      <button type="button" id="btn-download-csv" class="primary">下載差異報告 CSV</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

  var ANCHOR_MAX_BLOCK_LEN = 4000;

  // 級配對都完全失敗（matchedCount===0）時才呼叫。對整個區塊的原始文字做
  // 字元級 Diff.diffChars，把長度達門檻且有意義的「共同」片段當作 anchor
  // （切分錨點），anchor 之間的內容組成 removed/added/modified 列、anchor
  // 本身組成 unchanged 列——用來救回「區塊內一部分完全相同、一部分真的有
  // 修改」但被句子級配對整段誤判成無關刪除+新增的情況。找不到任何合格
  // anchor，或區塊過長（避免昂貴的字元級 diff 拖垮效能）時回傳 null，
  // 呼叫端維持既有結果不變。
  var LINE_WRAP_WHITESPACE = /[ \t　]/;
  var CHINESE_CHAR = /[一-鿿]/;

  // 去除「緊鄰中文字」的空白字元（半形／全形／tab），同時記錄每個保留字元
  // 對應回原字串的 index，讓比對完的邊界可以映射回原始文字（含空白）以
  // 正確顯示——換行位置常因排版寬度不同，讓同樣內容在舊版/新版多出或少
  // 掉一個空白，字元級比對前先去掉這層雜訊，能讓本來該連成一段的共同
  // 片段不被單一空白切斷。只在緊鄰中文字時才去除（比照 normalizeForCompare
  // 既有規則），避免破壞英文單字或數字之間有意義的空格（例如把「1 2 3」
  // 跟「123」誤判成相同）。
  function stripLineWrapWhitespace(s){
    var chars = [];
    var origIndex = [];
    for (var i = 0; i < s.length; i++){
      var ch = s[i];
      if (LINE_WRAP_WHITESPACE.test(ch)){
        var prevChar = s.charAt(i - 1);
        var nextChar = s.charAt(i + 1);
        if (CHINESE_CHAR.test(prevChar) || CHINESE_CHAR.test(nextChar)) continue;
      }
      chars.push(ch);
      origIndex.push(i);
    }
    return { stripped: chars.join(''), origIndex: origIndex };
  }

  function anchorBasedResplit(rawOld, rawNew){
    if (rawOld.length + rawNew.length > ANCHOR_MAX_BLOCK_LEN) return null;
    var oldStrip = stripLineWrapWhitespace(rawOld);
    var newStrip = stripLineWrapWhitespace(rawNew);
    var charParts = Diff.diffChars(oldStrip.stripped, newStrip.stripped);
    var hasAnchor = charParts.some(function(p){
      return !p.added && !p.removed && p.value.length >= ANCHOR_MIN_LEN && hasMeaningfulContent(p.value);
    });
    if (!hasAnchor) return null;

    // 依無空白版本 diff 出的每個 part，取回原始文字（含空白）的對應片段：
    // part 在無空白字串裡是連續 [pos, pos+len) 的一段。結束邊界刻意取到
    // 「下一個保留字元的原始 index」（而不是這個 part 最後一個保留字元後面
    // 一格），這樣夾在這個 part 跟下一個 part 之間、被濾掉的空白會完整
    // 歸給這個 part，不會在兩個 part 交界處憑空消失（曾經因為只切到最後
    // 一個保留字元就結束，漏掉交界空白，導致英文單字黏在一起）；沒有下一
    // 個保留字元（這是最後一個 part）就取到字串結尾。
    function origSlice(rawStr, origIndex, pos, len){
      if (len <= 0) return '';
      var end = (pos + len < origIndex.length) ? origIndex[pos + len] : rawStr.length;
      return rawStr.slice(origIndex[pos], end);
    }

    var anchorRows = [];
    var bufOld = '', bufNew = '';
    // bufOldDiff/bufNewDiff 只累積「真的不同」的片段（來自 removed/added），
    // 不含短於 anchor 門檻、兩側都有的共同片段——那些片段本來就同時存在於
    // 新舊版，若也算進相似度計算，會把「骨架相同、內容全異」的表格列（例如
    // 都有「規格內容：」「數量單位：」這類欄位標籤，但實際品項完全不同）
    // 灌水成虛高的相似度，誤判成修改。相似度只看真正有差異的部分，畫面
    // 顯示仍用完整的 bufOld/bufNew（含共同片段），不影響可讀性。
    var bufOldDiff = '', bufNewDiff = '';
    function flushBuf(){
      if (!bufOld && !bufNew) return;
      if (!bufOld) anchorRows.push({ type: 'added', oldSentence: null, newSentence: bufNew });
      else if (!bufNew) anchorRows.push({ type: 'removed', oldSentence: bufOld, newSentence: null });
      else if (bufOld === bufNew){
        anchorRows.push({ type: 'unchanged', oldSentence: bufOld, newSentence: bufNew });
      } else if (sentenceSimilarity(bufOldDiff, bufNewDiff) >= SIMILARITY_THRESHOLD){
        // 兩側都有累積內容時，必須先檢查真正有差異的部分像不像，不能無條件
        // 湊成「修改」。anchor 之間夾的內容有可能剛好是兩段完全不相關的
        // 內容（例如不同段落的邊界剛好各自被切在同一個 run 裡），沒有這道
        // 檢查會把毫不相關的大段落硬湊成一則修改，比原本的純刪除+純新增
        // 更誤導。
        anchorRows.push({ type: 'modified', oldSentence: bufOld, newSentence: bufNew });
      } else {
        anchorRows.push({ type: 'removed', oldSentence: bufOld, newSentence: null });
        anchorRows.push({ type: 'added', oldSentence: null, newSentence: bufNew });
      }
      bufOld = ''; bufNew = ''; bufOldDiff = ''; bufNewDiff = '';
    }

    var oldPos = 0, newPos = 0; // 目前在「無空白字串」裡的游標位置
    charParts.forEach(function(p){
      var len = p.value.length;
      if (!p.added && !p.removed){
        var origOld = origSlice(rawOld, oldStrip.origIndex, oldPos, len);
        var origNew = origSlice(rawNew, newStrip.origIndex, newPos, len);
        if (len >= ANCHOR_MIN_LEN && hasMeaningfulContent(p.value)){
          flushBuf();
          anchorRows.push({ type: 'unchanged', oldSentence: origOld, newSentence: origNew });
        } else {
          // 共同片段但長度未達 anchor 門檻：不當作切分點，只併入畫面顯示用
          // 的 buf，不算進相似度計算，避免灌水。
          bufOld += origOld;
          bufNew += origNew;
        }
        oldPos += len; newPos += len;
      } else if (p.removed){
        var origOldR = origSlice(rawOld, oldStrip.origIndex, oldPos, len);
        bufOld += origOldR;
        bufOldDiff += origOldR;
        oldPos += len;
      } else if (p.added){
        var origNewA = origSlice(rawNew, newStrip.origIndex, newPos, len);
        bufNew += origNewA;
        bufNewDiff += origNewA;
        newPos += len;
      }
    });
    flushBuf();
    return anchorRows;
  }

  function computeDiff(oldText, newText){
    var oldSentences = splitIntoSentences(oldText);
    var newSentences = splitIntoSentences(newText);
    var normCache = {};
    function normKey(s){
      if (!Object.prototype.hasOwnProperty.call(normCache, s)) normCache[s] = normalizeForCompare(s);
      return normCache[s];
    }
    var parts = Diff.diffArrays(oldSentences, newSentences, {
      comparator: function(a, b){ return normKey(a) === normKey(b); }
    });
    var rows = [];
    // jsdiff 對「相同」（common）片段只回傳 newString 那一側的字串（比對用的
    // comparator 判定相等，不代表原始字串逐字元相同，例如純空白差異）。
    // 用 oldPtr/newPtr 追蹤兩側陣列位置，讓 unchanged 列各自顯示真正的原始
    // 文字，而不是把新版文字誤植到舊版欄位。
    var oldPtr = 0, newPtr = 0;

    for (var i = 0; i < parts.length; i++){
      var part = parts[i];

      if (!part.added && !part.removed){
        part.value.forEach(function(){
          rows.push({ type: 'unchanged', oldSentence: oldSentences[oldPtr], newSentence: newSentences[newPtr] });
          oldPtr++; newPtr++;
        });
        continue;
      }

      if (part.removed){
        var nextPart = parts[i + 1];
        if (nextPart && nextPart.added){
          var removedArr = part.value;
          var addedArr = nextPart.value;

          // 差異區塊局部重新斷句：removedArr/addedArr 是第一階段行數上限
          // 硬切出來的結果，舊版/新版排版寬度不同時切點常常對不上，導致
          // 明明內容幾乎沒變的一句話被拆成不相關的純刪除+純新增。這裡把
          // 這個區塊的原始文字重建回來（join('') 無損還原，因為合併行時
          // 就是直接字串相接、沒有分隔符），跳脫行數上限，改用真正的句尾
          // 標點重新斷句再配對一次；只有在能救回更多配對時才採用，救不回
          // 就維持原本結果，避免對真的無關的內容做無意義的二次處理。
          var original = pairRemovedAdded(removedArr, addedArr);
          var resplitRemoved = splitLineIntoSentences(removedArr.join(''));
          var resplitAdded = splitLineIntoSentences(addedArr.join(''));
          // 安全網：重新斷句找不到足夠的句尾標點時，會把大部分內容黏成一個
          // 過長的字串，這正是 Round 2 要防止的失敗模式（表格/清單被整塊誤判
          // 成一則修改）。判斷依據是「最後一段有沒有正確以句尾標點結尾」——
          // splitLineIntoSentences 保證除了最後一段以外都一定會在標點處收尾，
          // 所以只要看最後一段：結尾是標點，代表這是重組出一個完整句子（例如
          // 同一句話因硬換行上限被攔腰切開，resplit 後正確接回去），應該信任；
          // 結尾不是標點，代表沒有標點可切、是硬湊出來的殘留內容（像表格），
          // 不能信任。純看「元素數量」或「單一元素長度」都無法分辨這兩種情況
          // （曾經因為這樣誤擋過一句合法的完整句子，也曾經因為這樣漏放過一份
          // 表格），改用結尾標點判斷才能正確區分。
          var VERY_LONG_SENTENCE_SAFEGUARD = 1000;
          function isUntrustedResplit(arr){
            if (!arr.length) return true;
            var last = arr[arr.length - 1];
            var lastChar = last.charAt(last.length - 1);
            if (SENTENCE_TERMINATORS.indexOf(lastChar) === -1) return true;
            if (last.length > VERY_LONG_SENTENCE_SAFEGUARD) return true;
            return false;
          }
          var resplitCollapsed =
            (removedArr.length > 1 && isUntrustedResplit(resplitRemoved)) ||
            (addedArr.length > 1 && isUntrustedResplit(resplitAdded));
          var resplit = resplitCollapsed ? null : alignResplitArrays(resplitRemoved, resplitAdded);
          // 選策略優先比「完全相同（unchanged）的數量」，數量相同才比較
          // 總配對數（matchedCount，含 modified）。原因：位置索引配對可能
          // 因為「巧合排在同一個位置」而配出一堆 modified，數量看起來多，
          // 但都只是相似度矇混過關，不代表配對品質好；而 unchanged 是正規
          // 化後逐字元相等，是唯一不會誤判的黃金訊號，理當優先信任找到更
          // 多 unchanged 的那個策略，即使它的 matchedCount 總數比較少。
          var chosen = original;
          if (resplit){
            if (resplit.unchangedCount > original.unchangedCount) chosen = resplit;
            else if (resplit.unchangedCount === original.unchangedCount && resplit.matchedCount >= original.matchedCount) chosen = resplit;
          }
          var chosenRows = chosen.rows;
          // 第三層 fallback：句子級的兩種策略都完全沒配對成功時，才嘗試
          // 區塊內字元級細分（見 anchorBasedResplit）；只要有一種策略已經
          // 找到配對，代表句子級邊界還算可信，不需要動用更昂貴、風險也
          // 更高的字元級比對。
          if (original.matchedCount === 0 && (!resplit || resplit.matchedCount === 0)){
            var anchorRows = anchorBasedResplit(removedArr.join(''), addedArr.join(''));
            if (anchorRows) chosenRows = anchorRows;
          }
          chosenRows.forEach(function(r){ rows.push(r); });

          oldPtr += removedArr.length;
          newPtr += addedArr.length;
          i++; // 已消耗下一個 added part
        } else {
          part.value.forEach(function(s){
            rows.push({ type: 'removed', oldSentence: s, newSentence: null });
            oldPtr++;
          });
        }
        continue;
      }

      if (part.added){
        part.value.forEach(function(s){
          rows.push({ type: 'added', oldSentence: null, newSentence: s });
          newPtr++;
        });
      }
    }

    return rows;
  }

  var FOLD_THRESHOLD = 3;
  var currentFolds = [];

  function makeCell(cls, text){
    var cell = document.createElement('div');
    cell.className = 'diff-cell ' + cls;
    if (text === null || text === undefined){
      cell.classList.add('empty');
      cell.textContent = '';
    } else {
      cell.textContent = text;
    }
    return cell;
  }

  // 「修改」列的儲存格額外標示字元級差異，讓使用者一眼分辨這句是只差
  // 標點/空白，還是真的改了實質內容（例如金額、日期）。
  function makeModifiedCell(cls, side, oldText, newText){
    var cell = document.createElement('div');
    cell.className = 'diff-cell ' + cls;
    var charParts = Diff.diffChars(oldText, newText);
    charParts.forEach(function(part){
      if (side === 'old' && part.added) return;
      if (side === 'new' && part.removed) return;
      if (part.added || part.removed){
        var span = document.createElement('span');
        span.className = part.added ? 'char-add' : 'char-del';
        span.textContent = part.value;
        cell.appendChild(span);
      } else {
        cell.appendChild(document.createTextNode(part.value));
      }
    });
    return cell;
  }

  function buildRowEl(row){
    var rowEl = document.createElement('div');
    rowEl.className = 'diff-row type-' + row.type;
    if (row.type === 'modified'){
      rowEl.appendChild(makeModifiedCell('old', 'old', row.oldSentence, row.newSentence));
      rowEl.appendChild(makeModifiedCell('new', 'new', row.oldSentence, row.newSentence));
    } else {
      rowEl.appendChild(makeCell('old', row.oldSentence));
      rowEl.appendChild(makeCell('new', row.newSentence));
    }
    return rowEl;
  }

  function groupRowsForFolding(rows){
    var blocks = [];
    var i = 0;
    while (i < rows.length){
      if (rows[i].type === 'unchanged'){
        var j = i;
        while (j < rows.length && rows[j].type === 'unchanged') j++;
        var run = rows.slice(i, j);
        blocks.push(run.length >= FOLD_THRESHOLD
          ? { type: 'fold', rows: run }
          : { type: 'plain', rows: run });
        i = j;
      } else {
        blocks.push({ type: 'plain', rows: [rows[i]] });
        i++;
      }
    }
    return blocks;
  }

  function foldLabel(count, expanded){
    return '未變動 ' + count + ' 句（點擊' + (expanded ? '收合' : '展開') + '）';
  }

  function renderDiff(rows, container){
    container.textContent = '';
    currentFolds = [];

    groupRowsForFolding(rows).forEach(function(block){
      if (block.type === 'plain'){
        block.rows.forEach(function(row){
          container.appendChild(buildRowEl(row));
        });
        return;
      }

      var wrap = document.createElement('div');
      wrap.className = 'fold-block';

      var summary = document.createElement('button');
      summary.type = 'button';
      summary.className = 'fold-summary';
      summary.textContent = foldLabel(block.rows.length, false);

      var detail = document.createElement('div');
      detail.className = 'fold-detail hidden';
      block.rows.forEach(function(row){
        detail.appendChild(buildRowEl(row));
      });

      var foldState = { summary: summary, detail: detail, count: block.rows.length, expanded: false };
      summary.addEventListener('click', function(){
        foldState.expanded = !foldState.expanded;
        detail.classList.toggle('hidden', !foldState.expanded);
        summary.textContent = foldLabel(foldState.count, foldState.expanded);
      });
      currentFolds.push(foldState);

      wrap.appendChild(summary);
      wrap.appendChild(detail);
      container.appendChild(wrap);
    });
  }

  function renderStats(rows, container){
    var counts = { added: 0, removed: 0, modified: 0, unchanged: 0 };
    rows.forEach(function(row){
      if (counts.hasOwnProperty(row.type)) counts[row.type]++;
    });
    container.textContent = '';
    var labels = [
      { key: 'added', label: '新增' },
      { key: 'removed', label: '刪除' },
      { key: 'modified', label: '修改' },
      { key: 'unchanged', label: '未變動' }
    ];
    labels.forEach(function(item){
      var span = document.createElement('span');
      span.className = 'stat-item ' + item.key;
      var b = document.createElement('b');
      b.textContent = counts[item.key];
      span.appendChild(document.createTextNode(item.label + ' '));
      span.appendChild(b);
      span.appendChild(document.createTextNode(' 句'));
      container.appendChild(span);
    });
    return counts;
  }

  function buildMarkdownReport(rows, counts){
    var lines = [];
    lines.push('# 文字差異比對報告');
    lines.push('');
    lines.push('- 新增：' + counts.added + ' 句');
    lines.push('- 刪除：' + counts.removed + ' 句');
    lines.push('- 修改：' + counts.modified + ' 句');
    lines.push('- 未變動：' + counts.unchanged + ' 句');
    lines.push('');
    lines.push('## 差異內容');
    lines.push('');
    rows.forEach(function(row){
      if (row.type === 'modified'){
        lines.push('- **修改**：`' + row.oldSentence + '` → `' + row.newSentence + '`');
      } else if (row.type === 'added'){
        lines.push('- **新增**：`' + row.newSentence + '`');
      } else if (row.type === 'removed'){
        lines.push('- **刪除**：`' + row.oldSentence + '`');
      }
    });
    if (counts.added === 0 && counts.removed === 0 && counts.modified === 0){
      lines.push('（兩份文字內容完全相同，無差異）');
    }
    return lines.join('\n');
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeCsvField(field){
    var str = String(field);
    if (/[",\n\r]/.test(str)){
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  function buildHtmlReport(rows, counts){
    var rowsHtml = [];
    rows.forEach(function(row){
      if (row.type === 'unchanged'){
        rowsHtml.push('<tr class="row-unchanged"><td>未變動</td><td>' + escapeHtml(row.oldSentence) + '</td><td>' + escapeHtml(row.newSentence) + '</td></tr>');
      } else if (row.type === 'modified'){
        rowsHtml.push('<tr class="row-modified"><td>修改</td><td>' + escapeHtml(row.oldSentence) + '</td><td>' + escapeHtml(row.newSentence) + '</td></tr>');
      } else if (row.type === 'added'){
        rowsHtml.push('<tr class="row-added"><td>新增</td><td></td><td>' + escapeHtml(row.newSentence) + '</td></tr>');
      } else if (row.type === 'removed'){
        rowsHtml.push('<tr class="row-removed"><td>刪除</td><td>' + escapeHtml(row.oldSentence) + '</td><td></td></tr>');
      }
    });
    var bodyRows = rowsHtml.length ? rowsHtml.join('\n') : '<tr><td colspan="3">（兩份文字內容完全相同，無差異）</td></tr>';
    return '<!DOCTYPE html>\n<html lang="zh-Hant">\n<head>\n<meta charset="UTF-8">\n<title>文字差異比對報告</title>\n<style>\n' +
      'body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;margin:24px;color:#2a2a2a;}\n' +
      'table{border-collapse:collapse;width:100%;}\n' +
      'th,td{border:1px solid #ddd;padding:6px 10px;text-align:left;vertical-align:top;font-size:14px;}\n' +
      'th{background:#f5f5f5;}\n' +
      '.row-added td{background:#eaf5e6;}\n' +
      '.row-removed td{background:#fbe9e7;}\n' +
      '.row-modified td{background:#fdf3e0;}\n' +
      '</style>\n</head>\n<body>\n' +
      '<h1>文字差異比對報告</h1>\n' +
      '<p>新增：' + counts.added + ' 句｜刪除：' + counts.removed + ' 句｜修改：' + counts.modified + ' 句｜未變動：' + counts.unchanged + ' 句</p>\n' +
      '<table>\n<thead><tr><th>類型</th><th>舊版內容</th><th>新版內容</th></tr></thead>\n<tbody>\n' +
      bodyRows + '\n</tbody>\n</table>\n</body>\n</html>';
  }

  function buildCsvReport(rows, counts){
    var lines = [];
    lines.push(['類型', '舊版內容', '新版內容'].map(escapeCsvField).join(','));
    rows.forEach(function(row){
      var typeLabel = row.type === 'unchanged' ? '未變動' : row.type === 'modified' ? '修改' : row.type === 'added' ? '新增' : '刪除';
      var oldVal = row.type === 'added' ? '' : (row.oldSentence || '');
      var newVal = row.type === 'removed' ? '' : (row.newSentence || '');
      lines.push([typeLabel, oldVal, newVal].map(escapeCsvField).join(','));
    });
    return '﻿' + lines.join('\r\n');
  }

  function setAllFolds(expanded){
    currentFolds.forEach(function(f){
      f.expanded = expanded;
      f.detail.classList.toggle('hidden', !expanded);
      f.summary.textContent = foldLabel(f.count, expanded);
    });
  }

  window.Day3App = window.Day3App || {};
  window.Day3App.splitIntoSentences = splitIntoSentences;
  window.Day3App.computeDiff = computeDiff;
  window.Day3App.renderDiff = renderDiff;
  window.Day3App.setAllFolds = setAllFolds;
  window.Day3App.renderStats = renderStats;
  window.Day3App.buildMarkdownReport = buildMarkdownReport;
  window.Day3App.buildHtmlReport = buildHtmlReport;
  window.Day3App.buildCsvReport = buildCsvReport;

  function setupDropColumn(colId, textareaId, fileNameId){
    var col = document.getElementById(colId);
    var textarea = document.getElementById(textareaId);
    var fileNameEl = document.getElementById(fileNameId);

    col.addEventListener('dragover', function(e){
      e.preventDefault();
      col.classList.add('dragover');
    });
    col.addEventListener('dragleave', function(){
      col.classList.remove('dragover');
    });
    col.addEventListener('drop', function(e){
      e.preventDefault();
      col.classList.remove('dragover');
      var files = e.dataTransfer && e.dataTransfer.files;
      if (!files || !files.length) return;
      var file = files[0];
      var lowerName = file.name.toLowerCase();
      if (!(lowerName.endsWith('.txt') || lowerName.endsWith('.md'))) {
        fileNameEl.textContent = '僅支援 .txt 或 .md 檔案：' + file.name;
        return;
      }
      var reader = new FileReader();
      reader.onload = function(evt){
        textarea.value = evt.target.result;
        fileNameEl.textContent = '已載入：' + file.name;
      };
      reader.onerror = function(){
        fileNameEl.textContent = '讀取失敗：' + file.name;
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  setupDropColumn('col-old', 'text-old', 'file-name-old');
  setupDropColumn('col-new', 'text-new', 'file-name-new');

  var compareBtn = document.getElementById('btn-compare');
  var resultSection = document.getElementById('result-section');
  var diffRowsEl = document.getElementById('diff-rows');
  var statsEl = document.getElementById('diff-stats');

  compareBtn.addEventListener('click', function(){
    var oldText = document.getElementById('text-old').value;
    var newText = document.getElementById('text-new').value;
    var rows = computeDiff(oldText, newText);
    var counts = renderStats(rows, statsEl);
    renderDiff(rows, diffRowsEl);
    resultSection.classList.remove('hidden');
    window.Day3App.lastRows = rows;
    window.Day3App.lastCounts = counts;
  });

  document.getElementById('btn-expand-all').addEventListener('click', function(){
    setAllFolds(true);
  });
  document.getElementById('btn-collapse-all').addEventListener('click', function(){
    setAllFolds(false);
  });

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  document.getElementById('btn-copy-summary').addEventListener('click', function(){
    if (!window.Day3App.lastRows){ showToast('請先執行比對'); return; }
    var report = buildMarkdownReport(window.Day3App.lastRows, window.Day3App.lastCounts);
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(report).then(function(){
        showToast('已複製差異摘要');
      }).catch(function(){
        showToast('複製失敗，請手動選取');
      });
    } else {
      showToast('此瀏覽器不支援自動複製，請手動選取');
    }
  });

  document.getElementById('btn-download-report').addEventListener('click', function(){
    if (!window.Day3App.lastRows){ showToast('請先執行比對'); return; }
    var report = buildMarkdownReport(window.Day3App.lastRows, window.Day3App.lastCounts);
    var blob = new Blob([report], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '差異比對報告.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('btn-download-html').addEventListener('click', function(){
    if (!window.Day3App.lastRows){ showToast('請先執行比對'); return; }
    var report = buildHtmlReport(window.Day3App.lastRows, window.Day3App.lastCounts);
    var blob = new Blob([report], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '差異比對報告.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('btn-download-csv').addEventListener('click', function(){
    if (!window.Day3App.lastRows){ showToast('請先執行比對'); return; }
    var report = buildCsvReport(window.Day3App.lastRows, window.Day3App.lastCounts);
    var blob = new Blob([report], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '差異比對報告.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  function buildCleanHtmlCopy(){
    var clone = document.documentElement.cloneNode(true);

    var cloneNavBack = clone.querySelector('.nav-back');
    if (cloneNavBack) cloneNavBack.remove();

    var cloneDownloadTool = clone.querySelector('#btn-download-tool');
    if (cloneDownloadTool) cloneDownloadTool.remove();

    ['text-old', 'text-new'].forEach(function(id){
      var el = clone.querySelector('#' + id);
      if (el){ el.textContent = ''; el.value = ''; }
    });

    ['file-name-old', 'file-name-new'].forEach(function(id){
      var el = clone.querySelector('#' + id);
      if (el) el.textContent = '';
    });

    var cloneStats = clone.querySelector('#diff-stats');
    if (cloneStats) cloneStats.textContent = '';

    var cloneRows = clone.querySelector('#diff-rows');
    if (cloneRows) cloneRows.textContent = '';

    var cloneResultSection = clone.querySelector('#result-section');
    if (cloneResultSection) cloneResultSection.classList.add('hidden');

    var cloneToast = clone.querySelector('#toast');
    if (cloneToast){
      cloneToast.textContent = '';
      cloneToast.classList.remove('show');
    }

    return '<!doctype html>\n' + clone.outerHTML;
  }

  var btnDownloadTool = document.getElementById('btn-download-tool');
  if (btnDownloadTool){
    btnDownloadTool.addEventListener('click', function(){
      var html = buildCleanHtmlCopy();
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '文字差異比對器.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('已下載，可離線使用');
    });
  }
})();
</script>
</body>
</html>
