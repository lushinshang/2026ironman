name: Day28 Daily Stats Collector

on:
  schedule:
    # 每天 UTC 00:00（台北時間 08:00）——資料源本身是月更新，每天檢查一次確保不漏接新月份
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "day28-daily-stats"
  cancel-in-progress: false

jobs:
  collect:
    # 資料源：聯合信用卡中心「發卡機構通報詐欺交易型態之金額及筆數」CSV
    # （https://www.nccc.com.tw/dataDownload/Fraud/BANK_FRAUD_TWN_ALL.CSV）。
    # 已實測 ubuntu-latest 可正常存取此站（原 165dashboard.tw 版本對雲端代管
    # runner 有 AWS ELB 層 403 封鎖，已換源，細節見
    # sdd/scheduled-work-dashboard/proposal.md）。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch monthly stats + completeness check
        working-directory: VibeCoding/Day28_scheduled-work-dashboard
        run: python3 scripts/fetch_monthly_stats.py

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VibeCoding/Day28_scheduled-work-dashboard/data/monthly-stats.csv \
                  VibeCoding/Day28_scheduled-work-dashboard/data/validation-log.csv
          if git diff --cached --quiet; then
            echo "無異動跳過 commit"
          else
            git commit -m "chore(day28): monthly stats update $(date -u +%Y-%m-%d)"
            git push
          fi
